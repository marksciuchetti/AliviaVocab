/* ============================================================
   WORD WILDS - styles  (anime / idol glass look)
   ============================================================ */
:root{
  --ink:#2a2350; --muted:#7a74a6; --white:#fff;
  --pink:#ff5fa2; --pink-2:#ff8ec6; --violet:#8b5cf6; --violet-2:#b79cff; --sky:#4cc3ff; --mint:#4ee0c0; --gold:#ffcf5c; --coral:#ff6b81;
  --ok:#2ecc9a; --ok-bg:#e3fbf3; --bad:#ff5f8f; --bad-bg:#ffe6ef;
  --glass:rgba(255,255,255,.7); --glass-strong:rgba(255,255,255,.9); --line:rgba(255,255,255,.95);
  --shadow:0 12px 32px rgba(120,90,200,.16); --shadow-sm:0 6px 18px rgba(120,90,200,.14); --glow:0 8px 22px rgba(155,107,255,.35);
  --grad:linear-gradient(135deg,#ff5fa2 0%,#8b5cf6 55%,#4cc3ff 100%);
  --grad-btn:linear-gradient(135deg,#ff6fae,#9b6bff);
  --grad-mint:linear-gradient(135deg,#4ee0c0,#4cc3ff);
  --grad-gold:linear-gradient(135deg,#ffd76a,#ff9f5c);
  --grad-soft:linear-gradient(135deg,rgba(255,95,162,.14),rgba(139,92,246,.14),rgba(76,195,255,.14));
  --r:24px; --r-sm:16px;
  --font-head:'Poppins','Nunito',system-ui,-apple-system,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  --font-sfx:'Poppins','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.45;
  background:#efe6ff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 600px at 8% 0%,#ffd9ec 0%,rgba(255,217,236,0) 60%),
    radial-gradient(800px 600px at 95% 10%,#e2d6ff 0%,rgba(226,214,255,0) 60%),
    radial-gradient(900px 700px at 60% 100%,#d5f0ff 0%,rgba(213,240,255,0) 60%),
    linear-gradient(180deg,#f7ecff 0%,#efe6ff 50%,#eaf2ff 100%);
}
body::after{
  content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;opacity:.55;
  background:
    radial-gradient(circle at 15% 30%,rgba(255,255,255,.9) 0 6px,transparent 7px),
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.8) 0 9px,transparent 10px),
    radial-gradient(circle at 70% 75%,rgba(255,255,255,.8) 0 5px,transparent 6px),
    radial-gradient(circle at 30% 85%,rgba(255,255,255,.9) 0 7px,transparent 8px),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.6) 0 4px,transparent 5px),
    radial-gradient(circle at 90% 60%,rgba(255,255,255,.7) 0 6px,transparent 7px);
  animation:drift 40s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-30px,20px)}}
.sparkle-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
.sparkle-layer i{position:absolute;width:14px;height:14px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:twinkle 4s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(25deg)}}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0}
.hidden{display:none!important}
svg{display:inline-block;vertical-align:middle}

#app{max-width:1060px;margin:0 auto;padding:12px 14px 40px;position:relative;z-index:1}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:18px;position:relative;z-index:5;
}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.hud-avatar{width:56px;height:56px;border-radius:50%;background:var(--grad);padding:3px;flex:0 0 auto;box-shadow:var(--glow)}
.hud-avatar svg{width:100%;height:100%;border-radius:50%;background:#fff;object-fit:cover}
.hud-name{font-family:var(--font-head);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.xp{height:9px;border-radius:8px;background:rgba(122,116,166,.18);overflow:hidden;margin-top:5px;width:150px;max-width:100%}
.xp > i{display:block;height:100%;background:var(--grad);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(139,92,246,.6)}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hud-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid #fff;
  font-family:var(--font-head);font-weight:600;font-size:.9rem;line-height:1;white-space:nowrap;box-shadow:0 3px 10px rgba(120,90,200,.1);
}
.pill svg{width:1.15em;height:1.15em}
.pill.coins{background:var(--grad-gold);color:#4a2c00;border-color:transparent}
.pill.region{color:#fff;border-color:transparent}
.icon-btn{
  width:42px;height:42px;border:1px solid #fff;border-radius:14px;background:rgba(255,255,255,.8);display:inline-grid;place-items:center;vertical-align:middle;
  box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s;
}
.icon-btn svg{width:22px;height:22px}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.icon-btn:active{transform:translateY(1px)}
.tab{
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border:1px solid #fff;border-radius:999px;background:rgba(255,255,255,.75);
  font-family:var(--font-head);font-weight:600;font-size:.92rem;box-shadow:0 3px 10px rgba(120,90,200,.1);transition:transform .12s,box-shadow .12s,background .2s;color:var(--ink);
}
.tab svg{width:20px;height:20px}
.tab.active{background:var(--grad-btn);color:#fff;box-shadow:var(--glow);border-color:transparent}
.tab.active svg path,.tab.active svg rect,.tab.active svg circle{stroke:#fff}
.tab:hover{transform:translateY(-2px)}
@media (max-width:640px){
  .tab span{display:none}
  .tab{padding:9px 11px}
  .hud{padding:8px 10px;gap:8px}
  .xp{width:110px}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-head);font-weight:700;font-size:1rem;line-height:1.1;letter-spacing:.01em;
  padding:13px 26px;border:0;border-radius:999px;background:var(--grad-btn);color:#fff;
  box-shadow:var(--glow);transition:transform .15s,box-shadow .15s,filter .15s;text-decoration:none;
  user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);pointer-events:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(155,107,255,.42);filter:brightness(1.05)}
.btn:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(155,107,255,.35)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.choice:focus-visible{outline:3px solid rgba(76,195,255,.7);outline-offset:3px}
.btn.big{font-size:1.2rem;padding:17px 36px}
.btn.white{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid #fff}
.btn.white:hover{box-shadow:var(--shadow)}
.btn.mint{background:var(--grad-mint);color:#083b36;box-shadow:0 8px 20px rgba(78,224,192,.35)}
.btn.coral{background:linear-gradient(135deg,#ff6b81,#ff9a5c);box-shadow:0 8px 20px rgba(255,107,129,.38)}
.btn.sky{background:linear-gradient(135deg,#4cc3ff,#8b5cf6)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;padding:8px 12px}
.btn.ghost::after{display:none}
.btn.ghost:hover{transform:none;filter:none}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.btn[disabled]:hover,.btn.disabled:hover{transform:none}
.btn svg{width:1.2em;height:1.2em}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn-row.center{justify-content:center}

/* ---------- Panels ---------- */
.panel{
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;position:relative;
}
.panel.tight{padding:14px}
.panel-head{
  display:flex;align-items:center;gap:12px;margin:-22px -22px 18px;padding:16px 22px;
  border-radius:24px 24px 0 0;background:var(--grad-soft);border-bottom:1px solid rgba(255,255,255,.9);position:relative;
}
.panel-head h2{font-size:1.3rem}
.panel-head.region{color:#fff}
.eyebrow{font-family:var(--font-head);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- Screens ---------- */
.screen{display:none}
.screen.active{display:block;animation:screenIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.screen-top h2{font-size:1.55rem;min-width:0;overflow-wrap:anywhere}
.screen-top .pill{flex:0 0 auto}
.screen-top .spacer{flex:1}

/* ---------- Speech bubble / mentor ---------- */
.mentor{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.mentor .mentor-art{flex:0 0 auto;width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(120,90,200,.25))}
.mentor .mentor-art svg{width:100%;height:100%}
.bubble{
  position:relative;background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #fff;border-radius:20px;padding:12px 18px;box-shadow:var(--shadow-sm);
  font-weight:600;font-size:1rem;flex:1;animation:bubbleIn .35s cubic-bezier(.2,.9,.3,1.3) both;
}
.bubble::before{content:'';position:absolute;left:-9px;bottom:20px;width:18px;height:18px;background:var(--glass-strong);border-left:1px solid #fff;border-bottom:1px solid #fff;transform:rotate(45deg);border-radius:0 0 0 4px}
.bubble .who{display:block;font-family:var(--font-head);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;margin-bottom:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
@keyframes bubbleIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){.mentor .mentor-art{width:70px;height:70px}.bubble{font-size:.92rem}}

/* ---------- Creature display ---------- */
.creature{position:relative;display:inline-block;line-height:0}
.creature svg{width:100%;height:100%;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(80,50,140,.18))}
.creature .shadow{position:absolute;left:50%;bottom:6%;width:60%;height:10%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(90,60,160,.28),rgba(90,60,160,0) 70%);z-index:0}
.creature.bob svg{animation:bob 2.8s ease-in-out infinite}
.creature.bob .shadow{animation:shadowBob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadowBob{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.88)}}
.creature.hop svg{animation:hop .6s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-26px) scale(.94,1.08)}55%{transform:translateY(0) scale(1.06,.92)}75%{transform:translateY(-8px) scale(1)}100%{transform:translateY(0)}}
.creature.shake svg{animation:shake .5s ease-in-out 1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.creature.lunge svg{animation:lunge .55s cubic-bezier(.3,1.2,.4,1) 1}
@keyframes lunge{0%{transform:translateX(0)}35%{transform:translateX(46px) scale(1.05)}100%{transform:translateX(0)}}
.creature.lungeL svg{animation:lungeL .55s cubic-bezier(.3,1.2,.4,1) 1}
@keyframes lungeL{0%{transform:translateX(0)}35%{transform:translateX(-46px) scale(1.05)}100%{transform:translateX(0)}}
.creature.hit svg{animation:hitFlash .5s ease-out 1}
@keyframes hitFlash{0%{filter:brightness(3) saturate(0);transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{filter:brightness(1)}100%{transform:translateX(0)}}
.creature.silhouette svg{filter:brightness(0) opacity(.28)}
.creature.pop svg{animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.creature.vanish svg{animation:vanish .5s ease-in both}
@keyframes vanish{to{transform:scale(.2) translateY(-40px);opacity:0}}
.aura{transform-origin:100px 120px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* speed-line burst */
.burst{position:absolute;inset:-20%;z-index:0;pointer-events:none;opacity:0}
.burst.go{animation:burst .55s ease-out 1}
@keyframes burst{0%{opacity:0;transform:scale(.6)}20%{opacity:1}100%{opacity:0;transform:scale(1.15)}}

/* ---------- SFX text ---------- */
.sfx{
  position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-6deg);z-index:30;pointer-events:none;
  font-family:var(--font-sfx);font-weight:900;font-style:italic;font-size:3rem;letter-spacing:.02em;color:#fff;
  text-shadow:0 3px 0 var(--pink),0 0 18px rgba(255,95,162,.55),0 10px 26px rgba(139,92,246,.45);
  animation:sfxPop .9s cubic-bezier(.2,1.2,.3,1) both;white-space:nowrap;
}
.sfx.bad{text-shadow:0 3px 0 #ff3d7f,0 0 18px rgba(255,61,127,.55),0 10px 26px rgba(139,92,246,.35)}
.sfx.blue{text-shadow:0 3px 0 var(--sky),0 0 18px rgba(76,195,255,.6),0 10px 26px rgba(139,92,246,.35)}
.sfx.mint{text-shadow:0 3px 0 #2ecc9a,0 0 18px rgba(78,224,192,.6),0 10px 26px rgba(139,92,246,.35)}
@keyframes sfxPop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.15)}45%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-6deg) scale(1)}}
.float-num{position:absolute;z-index:31;pointer-events:none;font-family:var(--font-head);font-weight:800;font-size:1.3rem;color:#1d9c74;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:floatUp 1s ease-out both}
.float-num.dmg{color:#ff3d7f;font-style:italic;font-size:2rem;letter-spacing:.02em}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

/* ---------- Title screen ---------- */
.title-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;min-height:62vh}
@media (max-width:760px){.title-wrap{grid-template-columns:1fr;min-height:0}}
.logo{font-family:var(--font-head);font-weight:900;font-style:italic;font-size:clamp(3.4rem,9vw,6.4rem);line-height:.92;letter-spacing:-.03em;display:inline-block;
  background:linear-gradient(135deg,#ff5fa2 0%,#b05cff 50%,#4cc3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 20px rgba(139,92,246,.35))}
.logo span{display:block;padding-left:.6em;background:linear-gradient(135deg,#ff9f5c,#ff5fa2 60%,#ff8ec6);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-family:var(--font-head);font-weight:600;font-size:1.15rem;margin:16px 0 24px;color:var(--muted)}
.title-stage{position:relative;text-align:center}
.title-stage .creature{width:min(360px,80vw);height:min(360px,80vw)}
.title-stage .ring{position:absolute;left:50%;top:50%;width:96%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,200,236,.55) 40%,rgba(255,200,236,0) 70%);z-index:0}
.title-stage .rays{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:0;opacity:.7;
  background:repeating-conic-gradient(rgba(255,255,255,.9) 0 5deg,transparent 5deg 15deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:spin 70s linear infinite}
.title-buttons{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.title-buttons .btn{min-width:250px}
.version{font-size:.78rem;color:var(--muted);margin-top:24px;font-weight:700}
.version .build{display:inline-block;background:var(--grad-btn);color:#fff;border-radius:999px;padding:3px 10px;margin-right:8px;font-family:var(--font-head);font-weight:700;letter-spacing:.02em}
.parade{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;margin-top:8px;padding:6px 0}
.parade .creature{width:84px;height:84px}
.parade .creature svg{animation-delay:inherit}
@media (max-width:640px){.parade .creature{width:60px;height:60px}}

/* ---------- Setup ---------- */
.name-input{
  width:100%;max-width:420px;font-family:var(--font-head);font-weight:700;font-size:1.3rem;padding:13px 18px;border:2px solid #fff;border-radius:18px;
  background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm);
}
.name-input:focus{outline:none;border-color:var(--violet-2);box-shadow:0 0 0 4px rgba(139,92,246,.2),var(--shadow-sm)}
.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:640px){.starter-grid{grid-template-columns:1fr}}
.starter{
  background:var(--glass-strong);border:2px solid #fff;border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px;text-align:center;cursor:pointer;
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.starter:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.starter.selected{border-color:var(--violet-2);background:linear-gradient(180deg,#fff,#f3ecff);transform:translateY(-4px);box-shadow:0 0 0 4px rgba(139,92,246,.18),var(--shadow)}
.starter .creature{width:150px;height:150px}
.starter h3{font-size:1.25rem;margin-top:4px}

/* ---------- Trail map ---------- */
.map-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
@media (max-width:860px){.map-layout{grid-template-columns:1fr}}
.map-panel{padding:10px}
.worldmap{width:100%;height:auto;display:block;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.worldmap .node{cursor:pointer}
.worldmap .node.locked{cursor:not-allowed}
.worldmap .node .ring{transition:transform .2s}
.worldmap .node:hover .ring{transform:scale(1.08)}
.worldmap text{font-family:var(--font-head);font-weight:700}
.map-side{display:flex;flex-direction:column;gap:16px}
.tamer-card{padding:16px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7))}
.tamer-card .creature{width:170px;height:170px;margin:0 auto;display:block}
.tamer-card .tc-name{font-family:var(--font-head);font-weight:800;font-size:1.35rem;text-align:center}
.tamer-card .tc-title{text-align:center;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-weight:700;font-size:.95rem}
.badge-strip{display:flex;gap:4px;justify-content:center;margin-top:12px}
.badge-strip svg{width:40px;height:40px}
.quick-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.quick-modes{grid-template-columns:1fr}}
.mode-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--glass-strong);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mode-card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad-gold);flex:0 0 auto;box-shadow:0 4px 10px rgba(255,159,92,.35)}
.mode-card .ic svg{width:26px;height:26px}
.mode-card h4{font-size:1.02rem}
.mode-card p{font-size:.85rem;color:var(--muted);font-weight:600}
.mode-card.locked{opacity:.55;cursor:not-allowed}
.region-list{display:none;flex-direction:column;gap:10px;margin-top:12px}
.region-list .rl{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--glass-strong);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow-sm);text-align:left}
.region-list .rl .em{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 4px 10px rgba(120,90,200,.25)}
.region-list .rl .em svg{width:30px;height:30px}
.region-list .rl h4{font-size:1.02rem}
.region-list .rl .stars svg{width:18px;height:18px}
.region-list .rl.locked{opacity:.55}
@media (max-width:640px){.region-list{display:flex}}

/* ---------- Flashcards ---------- */
.learn-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:center}
@media (max-width:760px){.learn-layout{grid-template-columns:1fr}}
.learn-art{text-align:center}
.learn-art .creature{width:min(280px,70vw);height:min(280px,70vw)}
.flash{min-height:260px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.flash .word{font-family:var(--font-head);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.5rem);display:flex;align-items:center;gap:12px;flex-wrap:wrap;letter-spacing:-.02em}
.flash .word .icon-btn{width:40px;height:40px}
.flash .def{font-size:1.12rem;font-weight:600;background:rgba(255,255,255,.75);border:1.5px solid #fff;border-left:5px solid var(--violet-2);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.flash .def.hiddenDef{color:transparent;user-select:none;text-shadow:0 0 16px rgba(42,35,80,.5);cursor:pointer}
.flash .example{font-size:.98rem;color:var(--muted);font-weight:600;font-style:italic}
.flash .clue{font-size:.95rem;font-weight:600;display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.flash .clue b{color:var(--violet)}
.progress-dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.progress-dots i{width:11px;height:11px;border-radius:50%;background:rgba(122,116,166,.25)}
.progress-dots i.done{background:var(--ok)}
.progress-dots i.cur{background:var(--grad);box-shadow:0 0 10px rgba(139,92,246,.6)}

/* ---------- Quiz / battle ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qbar{flex:1;height:12px;border-radius:10px;background:rgba(122,116,166,.18);overflow:hidden;min-width:120px}
.qbar > i{display:block;height:100%;background:var(--grad-mint);width:0;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:2px}
.hearts svg{width:28px;height:28px;transition:transform .3s;filter:drop-shadow(0 2px 4px rgba(255,61,127,.35))}
.hearts svg.lost{animation:heartPop .5s ease-out both}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-10deg)}100%{transform:scale(1)}}
.streak{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-head);font-weight:800;color:#ff6b2c;animation:popIn .4s both}
.streak svg{width:22px;height:22px}

.arena{
  position:relative;border-radius:var(--r);overflow:hidden;padding:14px 16px 4px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);
  background:linear-gradient(180deg,#ffe4f1 0%,#efe4ff 52%,#d9ecff 100%);margin-bottom:14px;min-height:210px;
}
.arena.market{background:linear-gradient(180deg,#ffe8d6 0%,#ffe0ee 52%,#e9dcff 100%)}
.arena.civic{background:linear-gradient(180deg,#e3e0ff 0%,#d9c9ff 52%,#c8b6ff 100%)}
.arena.mind{background:linear-gradient(180deg,#dcf8f4 0%,#d9f0ff 52%,#e1dcff 100%)}
.arena.champion{background:linear-gradient(180deg,#ffd3ea 0%,#e5c4ff 52%,#c9b8ff 100%)}
.arena.geo{background:linear-gradient(180deg,#ffe9f6 0%,#e6f4ff 52%,#d4f5ea 100%)}
.arena::before{content:'';position:absolute;inset:-40% -10%;background:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,255,255,.35) 0 4deg,transparent 4deg 14deg);opacity:.9;pointer-events:none;animation:spin 90s linear infinite}
.arena::after{content:'';position:absolute;left:50%;bottom:-40px;width:130%;height:150px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);pointer-events:none}
.arena-inner{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:1}
.fighter{position:relative;text-align:center;flex:1}
.fighter .creature{width:min(200px,38vw);height:min(200px,38vw)}
.fighter.boss .creature{width:min(230px,42vw);height:min(230px,42vw)}
.fighter .plate{display:inline-block;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid #fff;border-radius:16px;padding:7px 12px;box-shadow:var(--shadow-sm);margin-bottom:4px;text-align:left;min-width:150px;max-width:100%}
.fighter .plate b{font-family:var(--font-head);font-size:.92rem;display:block}
@media (max-width:560px){.fighter .plate{min-width:0;padding:5px 8px}.fighter .plate b{font-size:.85rem}.fighter .plate .small{font-size:.72rem}}
.hpbar{height:9px;border-radius:6px;background:rgba(122,116,166,.2);overflow:hidden;margin-top:5px}
.hpbar > i{display:block;height:100%;background:var(--grad-mint);width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hpbar > i.low{background:linear-gradient(90deg,#ff6b81,#ff9f5c)}
.vs{font-family:var(--font-head);font-weight:900;font-style:italic;font-size:2.6rem;color:#fff;text-shadow:0 3px 0 var(--pink),0 0 18px rgba(255,95,162,.6);align-self:center;transform:rotate(-8deg)}
@media (max-width:560px){.vs{font-size:1.8rem}}

.question{margin-bottom:14px}
.question .prompt{font-family:var(--font-head);font-weight:600;font-size:1rem;color:var(--muted);margin-bottom:8px}
.question .big{font-family:var(--font-head);font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:-.02em}
.question .quote{font-size:1.12rem;font-weight:700;background:rgba(255,255,255,.75);border:1.5px solid #fff;border-left:5px solid var(--pink-2);border-radius:16px;padding:14px 16px;line-height:1.45;box-shadow:var(--shadow-sm)}
.question .quote .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--violet);margin:0 4px;text-align:center;color:var(--violet)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.stack{grid-template-columns:1fr}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{
  display:flex;align-items:center;gap:12px;text-align:left;background:var(--glass-strong);border:1.5px solid #fff;border-radius:18px;padding:14px 16px;
  box-shadow:var(--shadow-sm);font-weight:700;font-size:1.02rem;transition:transform .12s,box-shadow .12s,background .2s,border-color .2s;min-height:58px;
}
.choice .key{width:30px;height:30px;border-radius:50%;background:var(--grad-btn);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-size:.85rem;font-weight:700;flex:0 0 auto;box-shadow:0 3px 8px rgba(155,107,255,.35)}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--violet-2)}
.choice.correct{background:linear-gradient(135deg,#e3fbf3,#dff5ff);border-color:var(--ok);animation:pulseOk .5s ease-out}
.choice.correct .key{background:linear-gradient(135deg,#2ecc9a,#4cc3ff)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shakeSmall .4s ease-out}
.choice.wrong .key{background:linear-gradient(135deg,#ff5f8f,#ff9a5c)}
.choice.dim{opacity:.45}
.choices.locked .choice{pointer-events:none}
@keyframes pulseOk{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shakeSmall{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* word builder */
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:12px;border:1.5px dashed rgba(139,92,246,.45);border-radius:16px;background:rgba(255,255,255,.55);margin-bottom:12px}
.slot{min-width:54px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.25rem;padding:0 10px;box-shadow:var(--shadow-sm)}
.slot.empty{background:transparent;box-shadow:none;color:transparent;border:1.5px dotted rgba(122,116,166,.5)}
.slot.filled{cursor:pointer;background:var(--grad-gold);color:#4a2c00;animation:popIn .25s both}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:58px;height:56px;padding:0 16px;border:1.5px solid #fff;border-radius:16px;background:var(--glass-strong);font-family:var(--font-head);font-weight:700;font-size:1.3rem;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s,opacity .2s}
.tile:hover{transform:translateY(-2px)}
.tile.used{opacity:.25;pointer-events:none;transform:scale(.9)}
.spell-input{
  width:100%;font-family:var(--font-head);font-weight:700;font-size:1.5rem;padding:14px 18px;border:2px solid #fff;border-radius:18px;text-align:center;
  letter-spacing:.04em;background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm);
}
.spell-input:focus{outline:none;border-color:var(--violet-2);box-shadow:0 0 0 4px rgba(139,92,246,.2),var(--shadow-sm)}
.spell-input.ok{background:var(--ok-bg);border-color:var(--ok)}
.spell-input.bad{background:var(--bad-bg);border-color:var(--bad);animation:shakeSmall .4s}
.letter-hint{font-family:var(--font-head);font-weight:700;font-size:1.4rem;letter-spacing:.25em;text-align:center;margin:8px 0;color:var(--violet)}

.feedback{
  margin-top:14px;border-radius:18px;padding:14px 16px;background:var(--glass-strong);border:1.5px solid #fff;box-shadow:var(--shadow-sm);
  display:flex;gap:12px;align-items:flex-start;animation:bubbleIn .3s both;
}
.feedback.good{background:linear-gradient(135deg,#e6fbf4,#e4f4ff);border-left:5px solid var(--ok)}
.feedback.bad{background:linear-gradient(135deg,#ffe8f0,#fff0f5);border-left:5px solid var(--bad)}
.feedback .fb-text{flex:1;font-weight:600}
.feedback .fb-text b{font-family:var(--font-head);font-size:1.08rem;display:block;margin-bottom:2px}

/* ---------- Hunt ---------- */
.team-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:-4px 0 14px}
.slotc{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm);overflow:hidden;animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;border:1.5px solid #fff}
.slotc svg{width:56px;height:56px;margin-top:8px}
.slotc.empty{background:rgba(255,255,255,.4);border:1.5px dashed rgba(122,116,166,.45);box-shadow:none;animation:none}
.hitdot{width:12px;height:12px;border-radius:50%;background:rgba(122,116,166,.25);display:inline-block}
.hitdot.on{background:var(--grad-btn);box-shadow:0 0 8px rgba(255,95,162,.6)}
.drill-bar{display:flex;align-items:center;gap:10px;background:var(--grad-gold);border-radius:14px;padding:9px 14px;margin-bottom:12px;font-weight:700;color:#4a2c00;box-shadow:0 4px 12px rgba(255,159,92,.3)}
.drill-bar svg{width:22px;height:22px}
.drill-bar .pips{display:inline-flex;gap:4px;margin-left:auto}
.drill-bar .pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.6)}
.drill-bar .pips i.done{background:#fff;box-shadow:0 0 8px #fff}

/* ---------- Word lists ---------- */
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.deck-card{background:var(--glass-strong);border:1px solid #fff;border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.deck-card.current{background:linear-gradient(180deg,#fff,#f4edff);box-shadow:0 0 0 3px rgba(139,92,246,.2),var(--shadow)}
.deck-head{display:flex;gap:12px;align-items:center}
.deck-head h3{font-size:1.12rem;overflow-wrap:anywhere}
.deck-head svg{flex:0 0 auto}
.deck-preview{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.deck-preview span{width:46px;height:46px;display:inline-block}
.deck-preview span svg{width:100%;height:100%}
.deck-preview .more{font-family:var(--font-head);font-weight:700;color:var(--muted);width:auto;padding-left:6px}
.deck-text{width:100%;min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;line-height:1.6;padding:12px 14px;border:2px solid #fff;border-radius:16px;background:rgba(255,255,255,.85);resize:vertical;box-shadow:var(--shadow-sm)}
.deck-text:focus{outline:none;border-color:var(--violet-2);box-shadow:0 0 0 4px rgba(139,92,246,.2)}

/* ---------- Results ---------- */
.result-hero{text-align:center;padding:10px 0}
.result-hero .creature{width:220px;height:220px}
.result-hero h2{font-size:2.1rem;letter-spacing:-.02em}
.result-stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.result-stars svg{width:58px;height:58px;animation:starIn .6s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 4px 8px rgba(255,159,92,.4))}
.result-stars svg:nth-child(2){animation-delay:.2s}
.result-stars svg:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1);opacity:1}}
.reward-list{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.reward{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;background:var(--glass-strong);border:1px solid #fff;font-family:var(--font-head);font-weight:700;box-shadow:var(--shadow-sm);animation:popIn .4s both}
.reward svg{width:22px;height:22px}
.evolved-list{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:10px 0}
.evolved{width:150px;text-align:center;font-weight:700;font-size:.9rem}
.evolved .creature{width:120px;height:120px}
.evolved .tag{display:inline-block;background:var(--grad-gold);color:#4a2c00;border-radius:999px;padding:3px 11px;font-family:var(--font-head);font-size:.78rem}

/* ---------- Album (photocards) ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid #fff;background:rgba(255,255,255,.75);font-family:var(--font-head);font-weight:600;font-size:.88rem;box-shadow:0 3px 10px rgba(120,90,200,.1)}
.chip.active{background:var(--grad-btn);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{
  position:relative;background:linear-gradient(180deg,#fff 0%,#f7f1ff 100%);border-radius:20px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;text-align:left;padding:0;
  transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;border:0;
}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 46%,rgba(255,190,235,.45) 52%,rgba(190,220,255,.45) 58%,transparent 70%);transform:translateX(-130%);transition:transform .7s ease;pointer-events:none}
.card:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 16px 34px rgba(120,90,200,.25)}
.card:hover::after{transform:translateX(130%)}
.card .card-top{padding:9px 12px 0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--font-head);font-weight:700;font-size:.74rem;color:var(--muted);letter-spacing:.06em}
.card .card-top span:first-child{white-space:nowrap}
.card .type-pill{font-size:.62rem;padding:2px 8px}
.card .card-art{padding:0 10px;text-align:center;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%)}
.card .card-art .creature{width:120px;height:120px}
.card .card-name{padding:4px 12px 10px;font-family:var(--font-head);font-weight:700;font-size:1rem;display:flex;flex-direction:column}
.card .card-name small{font-weight:700;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.type-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-family:var(--font-head);font-weight:700;color:#fff;line-height:1.4;box-shadow:0 3px 8px rgba(120,90,200,.2);letter-spacing:.04em}
.mastery{display:flex;gap:3px;padding:0 12px 12px}
.mastery i{flex:1;height:6px;border-radius:4px;background:rgba(122,116,166,.2)}
.mastery i.on{background:var(--grad-mint);box-shadow:0 0 6px rgba(78,224,192,.6)}
.card.unknown .card-art .creature svg{filter:brightness(0) opacity(.2)}
.card.unknown::before{opacity:.25}

/* ---------- Modal ---------- */
.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(60,40,120,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s both;overflow:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:640px;background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:26px;box-shadow:0 24px 60px rgba(60,40,120,.35);padding:24px;position:relative;animation:popIn .35s cubic-bezier(.2,1.3,.4,1) both;max-height:calc(100vh - 32px);overflow:auto}
.modal .close{position:absolute;top:12px;right:12px}
.detail{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media (max-width:600px){.detail{grid-template-columns:1fr}}
.detail .creature{width:220px;height:220px;display:block;margin:0 auto}
.detail h2{font-size:1.7rem;letter-spacing:-.02em}
.detail .def{font-weight:700;font-size:1.05rem;background:rgba(255,255,255,.8);border:1.5px solid #fff;border-left:5px solid var(--violet-2);border-radius:14px;padding:10px 12px;margin:10px 0;box-shadow:var(--shadow-sm)}
.detail .clue{font-size:.95rem;font-weight:600;color:var(--muted)}
.stage-label{display:inline-block;font-family:var(--font-head);font-weight:700;font-size:.82rem;background:var(--grad-gold);color:#4a2c00;border-radius:999px;padding:3px 12px}

/* ---------- Badges ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.badge-item{text-align:center;font-weight:700}
.badge-item > svg{width:110px;height:110px}
.badge-svg{filter:drop-shadow(0 6px 14px rgba(120,90,200,.28))}
.badge-svg.locked{filter:grayscale(.3) opacity(.55)}
.badge-item .stars svg{width:20px;height:20px}
.badge-item .badge-svg.earned{animation:badgeIn .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes badgeIn{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat{border-radius:16px;padding:12px;background:rgba(255,255,255,.7);border:1px solid #fff;text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-family:var(--font-head);font-size:1.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* ---------- Shop ---------- */
.shop-layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:760px){.shop-layout{grid-template-columns:1fr}}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--glass-strong);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow-sm);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.item .creature{width:100px;height:100px;margin:0 auto}
.item h4{font-size:1rem}
.item p{font-size:.8rem;color:var(--muted);font-weight:600;flex:1}
.item .btn{padding:9px 14px;font-size:.88rem}
.item.owned{background:rgba(255,255,255,.6)}
.item.equipped{background:linear-gradient(180deg,#fff,#f1e8ff);box-shadow:0 0 0 3px rgba(139,92,246,.2),var(--shadow-sm)}

/* ---------- Parent corner ---------- */
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{padding:8px 10px;border-bottom:1px solid rgba(122,116,166,.18);text-align:left}
.table th{font-family:var(--font-head);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.table .bar{height:8px;border-radius:6px;background:rgba(122,116,166,.18);overflow:hidden;width:100px}
.table .bar i{display:block;height:100%;background:var(--grad-mint)}
.table-wrap{overflow-x:auto}

/* ---------- Overlays ---------- */
.levelup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(60,40,120,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .25s both}
.levelup .rays{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,180,230,.35) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite}
.levelup .box{position:relative;text-align:center;padding:30px 40px;background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:28px;box-shadow:0 24px 60px rgba(60,40,120,.35);animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both}
.levelup .big-sfx{font-family:var(--font-head);font-weight:900;font-style:italic;font-size:clamp(2.6rem,8vw,4.4rem);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;letter-spacing:-.02em;filter:drop-shadow(0 6px 16px rgba(139,92,246,.35))}
.levelup .creature{width:200px;height:200px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);animation:confFall linear both;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
@keyframes confFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:rgba(42,35,80,.92);color:#fff;padding:11px 20px;border-radius:999px;font-family:var(--font-head);font-weight:600;box-shadow:0 10px 30px rgba(42,35,80,.35);animation:toastIn .3s both;max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.flash-screen{position:fixed;inset:0;z-index:45;pointer-events:none;background:var(--pink);opacity:0;animation:flashRed .35s ease-out both}
@keyframes flashRed{0%{opacity:.3}100%{opacity:0}}

/* ---------- Print (coloring pages) ---------- */
#print-area{display:none}
@media print{
  body{background:#fff}
  body::before,body::after,.sparkle-layer{display:none!important}
  #app > *:not(#print-area){display:none!important}
  .confetti,.toast,.levelup,.modal-root,.flash-screen,.sfx{display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;text-align:center;padding:20px;font-family:var(--font-body);color:#222}
  .print-page:last-child{page-break-after:auto}
  .print-page h1{font-family:var(--font-head);font-size:2rem;margin-bottom:0}
  .print-page .pw{font-size:1.2rem;margin:4px 0 10px}
  .print-page svg{width:420px;height:420px}
  .print-page.cert svg{width:64px;height:64px}
  .print-page .pdef{font-size:1rem;max-width:560px;margin:0 auto 16px;border:2px dashed #444;border-radius:12px;padding:10px}
  .print-page .pbox{border:3px solid #444;border-radius:16px;height:260px;margin:10px auto 0;max-width:640px;position:relative}
  .print-page .pbox span{position:absolute;left:12px;top:8px;font-weight:700;color:#777}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

</style>
</head>
<body>
<div id="app">
  <header id="hud" class="hud hidden" aria-label="Tamer status"></header>
  <main id="screens">
    <section class="screen" id="screen-title"></section>
    <section class="screen" id="screen-setup"></section>
    <section class="screen" id="screen-trail"></section>
    <section class="screen" id="screen-learn"></section>
    <section class="screen" id="screen-hunt"></section>
    <section class="screen" id="screen-quiz"></section>
    <section class="screen" id="screen-result"></section>
    <section class="screen" id="screen-album"></section>
    <section class="screen" id="screen-badges"></section>
    <section class="screen" id="screen-shop"></section>
    <section class="screen" id="screen-decks"></section>
    <section class="screen" id="screen-parent"></section>
  </main>
  <div id="overlay-root"></div>
  <div id="print-area"></div>
</div>

<script>
/* ============================================================
   WORD WILDS - weekly word list and settings
   ============================================================
   WORD LIST
   Replace these with the current week's words. Pattern:
   ["the word", "the meaning", "part of speech"],
   The part of speech is optional. When present (noun, verb,
   adjective, or adverb) it sets the creature's color family and
   turns on part-of-speech questions; leave it "" for lists that
   do not test parts of speech. Lists can also be typed inside
   the game (Lists button), and those lists are saved in the browser.
   ============================================================ */

const WORDS = [
  ["astride",      "with one leg on each side of", "adverb"],
  ["drowsed",      "was almost asleep or lightly asleep", "verb"],
  ["patch",        "a small piece of ground where something grows", "noun"],
  ["glistened",    "shone with reflected light", "verb"],

/* ============================================================
   WORD TAMERS - vector creature art
   All creatures are drawn in a 200 x 200 box. Ground line is y = 178.
   ============================================================ */
const Art = (() => {
  const SW = 2.6;
  let LINE = false;           // line-art (coloring page) mode while rendering
  let GID = 0;                // unique gradient ids per rendered svg
  let DEFS = null;

  /* ---------- primitives ---------- */
  const ell = (cx, cy, rx, ry) =>
    `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0 Z`;
  const circ = (cx, cy, r) => ell(cx, cy, r, r);

  function hexToRgb(h){ h = h.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function darken(hex, amt){ const [r,g,b] = hexToRgb(hex); return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt)); }
  function lighten(hex, amt){ const [r,g,b] = hexToRgb(hex); return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt); }
  function mix(a, b, t){ const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
  /* anime style: outlines are a deep, tinted version of the fill instead of black */
  function lineCol(fill){ if(!fill || fill === INK) return INK; if(fill === '#fff' || fill === '#ffffff') return '#5a5488'; return darken(mix(fill, INK, .45), .2); }

  function grad(type, color){
    if(!DEFS) DEFS = { uid:++GID, n:0, map:{}, list:[] };
    const key = type + (color || '');
    if(!DEFS.map[key]){
      const id = `g${DEFS.uid}_${DEFS.n++}`; let def = '';
      if(type === 'body') def = `<radialGradient id="${id}" cx="34%" cy="26%" r="88%"><stop offset="0" stop-color="${lighten(color, .2)}"/><stop offset=".5" stop-color="${color}"/><stop offset="1" stop-color="${darken(color, .3)}"/></radialGradient>`;
      else if(type === 'shade') def = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".48" stop-color="#2a2350" stop-opacity="0"/><stop offset="1" stop-color="#2a2350" stop-opacity=".24"/></linearGradient>`;
      else if(type === 'hi') def = `<radialGradient id="${id}" cx="30%" cy="20%" r="48%"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
      else if(type === 'iris') def = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${darken(color, .5)}"/><stop offset=".55" stop-color="${color}"/><stop offset="1" stop-color="${lighten(color, .6)}"/></linearGradient>`;
      else if(type === 'blush') def = `<radialGradient id="${id}"><stop offset="0" stop-color="#ff7fae" stop-opacity=".8"/><stop offset="1" stop-color="#ff7fae" stop-opacity="0"/></radialGradient>`;
      else if(type === 'aura') def = `<radialGradient id="${id}"><stop offset="0" stop-color="#fff0fa" stop-opacity=".95"/><stop offset=".55" stop-color="#d9c6ff" stop-opacity=".5"/><stop offset="1" stop-color="#d9c6ff" stop-opacity="0"/></radialGradient>`;
      else if(type === 'gloss') def = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
      DEFS.map[key] = id; DEFS.list.push(def);
    }
    return `url(#${DEFS.map[key]})`;
  }
  const strokeFor = (fill, sw = SW) => `stroke="${lineCol(fill)}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
  const stroke = `stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"`;

  /* A soft-shaded shape: radial body gradient, bottom shadow, glossy highlight, tinted outline. */
  function shaded(d, base, dark, o = {}) {
    const { outline = true, sw = SW } = o;
    if (LINE) return `<path d="${d}" fill="#fff" ${stroke}/>`;
    return `<path d="${d}" fill="${grad('body', base)}"/>` +
           `<path d="${d}" fill="${grad('shade')}"/>` +
           `<path d="${d}" fill="${grad('hi')}"/>` +
           (outline ? `<path d="${d}" fill="none" ${strokeFor(base, sw)}/>` : '');
  }
  /* A flat shape with a tinted outline */
  function flat(d, fill, o = {}) {
    const { outline = true, sw = SW, opacity = 1, soft = false } = o;
    const f = LINE ? (fill === INK ? INK : '#fff') : fill;
    if (LINE && !outline) return '';
    if (soft && !LINE) return shaded(d, fill, null, { outline, sw });
    return `<path d="${d}" fill="${f}" ${outline ? (LINE ? stroke : strokeFor(fill, sw)) : ''} ${opacity < 1 ? `opacity="${opacity}"` : ''}/>`;
  }
  /* Decorative fill with no outline (skipped in line art) */
  function deco(d, fill, opacity = 1) {
    if (LINE) return '';
    return `<path d="${d}" fill="${fill}" ${opacity < 1 ? `opacity="${opacity}"` : ''}/>`;
  }
  function line(d, sw = SW, color = INK) {
    if (LINE) color = INK;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  function highlight(cx, cy, rx, ry, rot = -30) {
    if (LINE) return '';
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity="0.5" transform="rotate(${rot} ${cx} ${cy})"/>`;
  }

  /* Anime eye: tall shape, gradient iris, lash line with a flick, twin highlights */
  function eye(x, y, r, iris = '#3b2a6e', o = {}) {
    const { dx = 0, dy = 0, closed = false, side = 0 } = o;
    const lc = INK;
    if (closed) return line(`M${x - r},${y + 2} q${r},${-r * 1.1} ${2 * r},0`, SW);
    const rx = r * 0.86, ry = r * 1.1;
    const px = x + dx, py = y + dy;
    let s = `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="#6a62a0" stroke-width="1.4"/>`;
    if (!LINE) {
      s += `<ellipse cx="${px}" cy="${py + r * .1}" rx="${(r * .64).toFixed(2)}" ry="${(r * .82).toFixed(2)}" fill="${grad('iris', iris)}"/>`;
      s += `<ellipse cx="${px}" cy="${py + r * .16}" rx="${(r * .3).toFixed(2)}" ry="${(r * .44).toFixed(2)}" fill="#1c1735"/>`;
      s += `<path d="M${x - rx},${y - ry * .15} A${rx},${ry} 0 0 1 ${x + rx},${y - ry * .15} L${x + rx},${y - ry} L${x - rx},${y - ry} Z" fill="${lc}" opacity=".13"/>`;
      s += `<ellipse cx="${px - r * .24}" cy="${py - r * .3}" rx="${(r * .27).toFixed(2)}" ry="${(r * .2).toFixed(2)}" fill="#fff"/>`;
      s += `<circle cx="${px + r * .26}" cy="${py + r * .36}" r="${(r * .12).toFixed(2)}" fill="#fff" opacity=".92"/>`;
    } else {
      s += `<ellipse cx="${px}" cy="${py + r * .1}" rx="${(r * .64).toFixed(2)}" ry="${(r * .82).toFixed(2)}" fill="none" stroke="${lc}" stroke-width="1.5"/>`;
      s += `<ellipse cx="${px}" cy="${py + r * .16}" rx="${(r * .3).toFixed(2)}" ry="${(r * .44).toFixed(2)}" fill="${lc}"/>`;
    }
    s += `<path d="M${x - rx * .96},${y - ry * .3} Q${x},${y - ry * 1.28} ${x + rx * .96},${y - ry * .3}" fill="none" stroke="${lc}" stroke-width="${(r * .28).toFixed(2)}" stroke-linecap="round"/>`;
    if (side) s += `<path d="M${x + side * rx * .9},${y - ry * .42} l${side * r * .3},${-r * .3}" fill="none" stroke="${lc}" stroke-width="${(r * .2).toFixed(2)}" stroke-linecap="round"/>`;
    s += `<path d="M${x - rx * .7},${y + ry * .78} Q${x},${y + ry * 1.05} ${x + rx * .7},${y + ry * .78}" fill="none" stroke="${lc}" stroke-width="1.2" opacity=".45"/>`;
    return s;
  }
  function eyes(cx, cy, dist, r, iris, o = {}) { return eye(cx - dist, cy, r, iris, Object.assign({ side:-1 }, o)) + eye(cx + dist, cy, r, iris, Object.assign({ side:1 }, o)); }
  function mouth(type, x, y, w = 14) {
    const h = w * 0.5;
    switch (type) {
      case 'smile': return line(`M${x - w / 2},${y} q${w / 2},${h} ${w},0`, 2.2);
      case 'open': {
        const d = `M${x - w / 2},${y} q${w / 2},${h * 1.8} ${w},0 Z`;
        return flat(d, '#ff6f91', { sw:2 }) + (LINE ? '' : `<path d="M${x - w * 0.22},${y + h * 0.55} q${w * 0.22},${h * 0.7} ${w * 0.44},0 Z" fill="#ff9fb5"/>`);
      }
      case 'cat': return line(`M${x - w / 2},${y} q${w / 4},${h} ${w / 2},0 q${w / 4},${h} ${w / 2},0`, 2.2);
      case 'grin': {
        const d = `M${x - w / 2},${y} q${w / 2},${h * 1.6} ${w},0 Z`;
        return flat(d, '#ff6f91', { sw:2 }) + flat(`M${x - w * 0.38},${y + 1} l0,${h * 0.55} l${w * 0.14},${-h * 0.55}Z`, '#fff', { sw: 1.5 }) +
               flat(`M${x + w * 0.38},${y + 1} l0,${h * 0.55} l${-w * 0.14},${-h * 0.55}Z`, '#fff', { sw: 1.5 });
      }
      case 'beak': return flat(`M${x - w / 2},${y - 2} L${x + w / 2},${y - 2} L${x},${y + h + 2} Z`, '#ffb347', { soft:true, sw:2 });
      case 'tiny': return line(`M${x - 3},${y} q3,3 6,0`, 2.2);
      default: return '';
    }
  }
  function blush(cx, cy, dist, color = '#ff8fa3') {
    if (LINE) return '';
    const g = grad('blush');
    return `<ellipse cx="${cx - dist}" cy="${cy}" rx="10" ry="6" fill="${g}"/><ellipse cx="${cx + dist}" cy="${cy}" rx="10" ry="6" fill="${g}"/>`;
  }

    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2);

  const SHAPES = {
    egg:   'M100,52 C138,52 160,92 160,128 C160,160 134,180 100,180 C66,180 40,160 40,128 C40,92 62,52 100,52 Z',
    round: circ(100, 118, 60),
    pear:  'M100,56 C122,56 126,84 138,104 C152,128 152,176 100,178 C48,176 48,128 62,104 C74,84 78,56 100,56 Z',
    wide:  'M100,66 C150,66 172,100 172,134 C172,166 140,180 100,180 C60,180 28,166 28,134 C28,100 50,66 100,66 Z',
    bean:  'M100,60 C136,60 156,84 158,118 C160,150 142,180 100,180 C58,180 40,150 42,118 C44,84 64,60 100,60 Z',
    dome:  'M38,132 C38,84 66,62 100,62 C134,62 162,84 162,132 Z',
    blob:  'M100,62 C130,58 162,82 160,122 C158,156 136,180 100,180 C64,180 42,156 40,122 C38,82 70,66 100,62 Z',
  };

  const ACC = {
    flower(a) { const { x, y, w } = a; const r = w * 0.16, cx = x + w * 0.28, cy = y + 2; let s = '';
      for (let i = 0; i < 6; i++) { const ang = i * 60; s += `<ellipse cx="${cx}" cy="${cy - r * 0.9}" rx="${r * 0.42}" ry="${r * 0.9}" fill="${LINE ? '#fff' : '#fff'}" ${stroke} transform="rotate(${ang} ${cx} ${cy})"/>`; }

             flat(`M${cx},${cy} C${cx + r * 0.6},${cy - r * 1.3} ${cx + r * 2.6},${cy - r * 1.2} ${cx + r * 2.2},${cy} C${cx + r * 2.6},${cy + r * 1.2} ${cx + r * 0.6},${cy + r * 1.3} ${cx},${cy}Z`, '#ff6fa5') +

             flat(`M${x - r * 0.98},${y + 10} L${x + r * 1.35},${y + 10} Q${x + r * 1.4},${y + 18} ${x + r * 0.9},${y + 18} L${x - r * 0.9},${y + 18} Z`, '#c42846') +

    scarf(a) { const { x, y, w } = a; const r = w * 0.5;
      return flat(`M${x - r},${y - 6} Q${x},${y + 10} ${x + r},${y - 6} L${x + r},${y + 6} Q${x},${y + 22} ${x - r},${y + 6} Z`, '#e8435e') +
             flat(`M${x + r * 0.45},${y + 8} L${x + r * 0.85},${y + 34} L${x + r * 0.25},${y + 30} Z`, '#e8435e'); },
    cape(a) { const { x, y, w } = a; const r = w * 0.5; const b = Math.min(y + 112, 184); const h = b - y; /* drawn behind the body */
      return flat(`M${x - r * 0.9},${y} C${x - r * 1.6},${y + h * .36} ${x - r * 1.9},${y + h * .72} ${x - r * 1.3},${b} L${x + r * 1.3},${b} C${x + r * 1.9},${y + h * .72} ${x + r * 1.6},${y + h * .36} ${x + r * 0.9},${y} Z`, '#e8435e'); },
    capeKnot(a) { const { x, y, w } = a; const r = w * 0.5;
      return line(`M${x - r * 0.9},${y + 2} Q${x},${y + 12} ${x + r * 0.9},${y + 2}`, 5) + flat(circ(x, y + 8, 4), '#ffc83d', { sw: 2 }); },
  };

  /* ---------- creatures ----------
     Each returns { layers:string, hat:{x,y,w}, neck:{x,y,w} }.
     stage: 1 hatchling, 2 grown, 3 evolved  */
  const C = {};

  /* ---------- procedural creature generator (v2) ----------
     Every word gets a stable design from a hash of its letters.
     Bodies are soft, organic curves; details echo the hand-drawn set. */
  function hash(str){ let h = 5381; for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h; }
  const pick = (arr, seed) => arr[hash(seed) % arr.length];
  const chance = (seed, pct) => (hash(seed) % 100) < pct;

  const FAMILIES = {
    noun:      [{ base:'#ffc83d', dark:'#dfa000' }, { base:'#ffa541', dark:'#e5781e' }, { base:'#f2bd6e', dark:'#d6913c' }, { base:'#ffd98a', dark:'#e0a83a' }],
    verb:      [{ base:'#ff6b81', dark:'#d9405c' }, { base:'#f26d6d', dark:'#c93f3f' }, { base:'#ff8c69', dark:'#e0603f' }, { base:'#ff9fb5', dark:'#e0607f' }],
    adjective: [{ base:'#8d6bf7', dark:'#5e3fd1' }, { base:'#9fb8ff', dark:'#6f8ae0' }, { base:'#b487f0', dark:'#7b4fd0' }, { base:'#c9b8ff', dark:'#8f78e0' }],
    adverb:    [{ base:'#7fdccc', dark:'#36b1a0' }, { base:'#5fc983', dark:'#2f9a57' }, { base:'#52c9b3', dark:'#279a86' }, { base:'#a8e6a1', dark:'#63b95a' }],
  };
  const ALL_FAMILIES = [].concat(FAMILIES.noun, FAMILIES.verb, FAMILIES.adjective, FAMILIES.adverb,
    [{ base:'#7bd3f7', dark:'#3a9bd0' }, { base:'#f7a8d8', dark:'#d066a8' }, { base:'#c9d86a', dark:'#93a832' }, { base:'#ffb0a0', dark:'#e07460' }]);
  const ACCENTS = ['#ffc83d', '#e8435e', '#4aa3ff', '#24a96c', '#ff8c42', '#8b5cf6', '#ff6fa5', '#2f5fe0'];
  const IRISES = ['#3b2a6e', '#2f8f6f', '#5a3618', '#1f7f8f', '#7c4ddc', '#c05891', '#2e8b57', '#2a3a7a'];

  /* Body shapes: smooth closed curves, ground line y = 178. */
  const BODIES = {
    round: { d:'M100,60 C137,60 161,88 161,122 C161,156 134,178 100,178 C66,178 39,156 39,122 C39,88 63,60 100,60 Z',
      face:106, earL:[64, 76], earR:[136, 76], side:[44, 124], tail:[150, 142], feetY:171, feetX:26, hat:{ x:100, y:62, w:102 }, neck:{ x:100, y:148, w:98 }, cy:119 },
    egg: { d:'M100,52 C129,52 150,86 152,122 C154,154 129,178 100,178 C71,178 46,154 48,122 C50,86 71,52 100,52 Z',
      face:102, earL:[68, 78], earR:[132, 78], side:[50, 126], tail:[147, 144], feetY:171, feetX:26, hat:{ x:100, y:56, w:88 }, neck:{ x:100, y:148, w:88 }, cy:115 },
    drop: { d:'M100,52 C110,62 132,76 144,100 C154,120 152,150 130,166 C112,178 88,178 70,166 C48,150 46,120 56,100 C68,76 90,62 100,52 Z',
      face:110, earL:[70, 90], earR:[130, 90], side:[52, 128], tail:[144, 146], feetY:170, feetX:24, hat:{ x:100, y:64, w:76 }, neck:{ x:100, y:150, w:88 }, cy:118 },
    pear: { d:'M100,56 C114,56 120,70 126,88 C134,110 152,124 152,146 C152,170 128,178 100,178 C72,178 48,170 48,146 C48,124 66,110 74,88 C80,70 86,56 100,56 Z',
      face:96, earL:[80, 66], earR:[120, 66], side:[54, 140], tail:[146, 150], feetY:172, feetX:28, hat:{ x:100, y:58, w:64 }, neck:{ x:100, y:128, w:72 }, slim:true, cy:120 },
    squish: { d:'M100,74 C140,74 164,94 164,124 C164,154 138,176 100,176 C62,176 36,154 36,124 C36,94 60,74 100,74 Z',
      face:112, earL:[62, 86], earR:[138, 86], side:[42, 128], tail:[156, 146], feetY:170, feetX:34, hat:{ x:100, y:76, w:110 }, neck:{ x:100, y:154, w:110 }, cy:125 },
    bun: { d:'M100,58 C120,58 132,70 136,84 C154,92 164,110 162,134 C160,162 134,178 100,178 C66,178 40,162 38,134 C36,110 46,92 64,84 C68,70 80,58 100,58 Z',
      face:100, earL:[74, 68], earR:[126, 68], side:[46, 130], tail:[152, 146], feetY:172, feetX:28, hat:{ x:100, y:60, w:74 }, neck:{ x:100, y:146, w:92 }, slim:true, cy:118 },
    tall: { d:'M100,56 C128,56 144,84 144,118 C144,152 130,176 100,176 C70,176 56,152 56,118 C56,84 72,56 100,56 Z',
      face:102, earL:[74, 66], earR:[126, 66], side:[58, 122], tail:[140, 144], feetY:170, feetX:24, hat:{ x:100, y:58, w:84 }, neck:{ x:100, y:144, w:84 }, slim:true, cy:116 },
  };

  function specFor(word, pos){
    const k = String(word).toLowerCase().replace(/[^a-z]/g, '');
    const fam = FAMILIES[pos] || ALL_FAMILIES;
    const pal = pick(fam, k + '|pal');
    return {
      body:    pick(Object.keys(BODIES), k + '|body2'),
      ears:    pick(['none', 'cat', 'bunny', 'round', 'floppy', 'cat', 'round', 'bunny'], k + '|ears'),
      crest:   pick(['none', 'horn', 'twohorn', 'leaf', 'plume', 'antenna', 'fin', 'tuft', 'bangs', 'bangs', 'ahoge', 'bangs'], k + '|crest3'),
      tail:    pick(['none', 'curl', 'flame', 'leaf', 'bolt', 'fluff', 'spike', 'curl'], k + '|tail'),
      pattern: pick(['none', 'spots', 'stripes', 'belly', 'star', 'belly', 'spots', 'belly'], k + '|pattern'),
      mouth:   pick(['smile', 'open', 'cat', 'grin', 'tiny', 'smile', 'open'], k + '|mouth'),
      muzzle:  chance(k + '|muzzle', 45),
      fluff:   chance(k + '|fluff', 45),
      whiskers:chance(k + '|whisk', 35),
      freckles:chance(k + '|freck', 30),
      eyeR:    11.5 + (hash(k + '|eye') % 3),
      eyeDist: 20 + (hash(k + '|dist') % 5),
      arms:    hash(k + '|arms') % 3 !== 0,
      base: pal.base, dark: pal.dark,
      accent: pick(ACCENTS, k + '|accent'),
      iris:   pick(IRISES, k + '|iris'),
      innerEar: '#ffb3c6',
    };
  }

  function genCreature(spec, st){
    const m = BODIES[spec.body] || BODIES.round; const cx = 100, fy = m.face;
    const { base, dark, accent } = spec;
    const light = lighten(base, .58);
    let s = '';
    const evolved = st >= 3;
    /* wings (evolved), behind everything */
    if(evolved){
      const wc = lighten(accent, .55), wd = lighten(accent, .2);
      const wx = m.side[0] + 16, wy = m.side[1] - 14;
      s += shaded(`M${wx},${wy} C${wx - 28},${wy - 28} ${wx - 40},${wy - 52} ${wx - 20},${wy - 62} C${wx - 2},${wy - 68} ${wx + 12},${wy - 34} ${wx + 26},${wy - 6} Z`, wc, wd, { cx:wx - 10, cy:wy - 30 });
      const rx = 200 - wx;
      s += shaded(`M${rx},${wy} C${rx + 28},${wy - 28} ${rx + 40},${wy - 52} ${rx + 20},${wy - 62} C${rx + 2},${wy - 68} ${rx - 12},${wy - 34} ${rx - 26},${wy - 6} Z`, wc, wd, { cx:rx + 10, cy:wy - 30 });
    }
    /* tail, behind the body */
    if(st >= 2 && spec.tail !== 'none'){
      const [tx, ty] = m.tail; const tc = evolved ? '#ffc83d' : accent;
      switch(spec.tail){
        case 'curl':
          s += line(`M${tx},${ty} C${tx + 26},${ty - 36} ${tx + 54},${ty - 6} ${tx + 32},${ty + 12}`, 8.5);
          if(!LINE) s += `<path d="M${tx + 2},${ty - 2} C${tx + 24},${ty - 30} ${tx + 46},${ty - 6} ${tx + 30},${ty + 7}" fill="none" stroke="${tc}" stroke-width="3.5" stroke-linecap="round"/>`;
          s += flat(circ(tx + 32, ty + 12, 6.5), tc, { sw:2.5 });
          break;
        case 'flame': s += flat(`M${tx},${ty + 10} C${tx + 6},${ty - 18} ${tx + 30},${ty - 38} ${tx + 38},${ty - 6} C${tx + 42},${ty + 12} ${tx + 16},${ty + 22} ${tx},${ty + 10}Z`, tc) + deco(`M${tx + 10},${ty + 6} C${tx + 13},${ty - 8} ${tx + 26},${ty - 18} ${tx + 30},${ty - 2} C${tx + 32},${ty + 8} ${tx + 18},${ty + 13} ${tx + 10},${ty + 6}Z`, lighten(tc, .5)); break;
        case 'leaf': s += `<g transform="translate(${tx} ${ty + 8}) rotate(62)">` + flat('M0,0 C-15,-12 -14,-42 0,-54 C14,-42 15,-12 0,0 Z', '#3fb86b') + line('M0,-5 L0,-46', 2.2) + '</g>'; break;
        case 'bolt': s += flat(`M${tx},${ty + 4} C${tx + 8},${ty - 8} ${tx + 16},${ty - 18} ${tx + 26},${ty - 26} L${tx + 20},${ty - 8} L${tx + 40},${ty - 14} C${tx + 30},${ty - 2} ${tx + 20},${ty + 10} ${tx + 8},${ty + 20} L${tx + 15},${ty + 2} Z`, tc); break;
        case 'fluff': s += flat(circ(tx + 15, ty + 10, 10), tc, { sw:3 }) + flat(circ(tx + 29, ty, 12), tc, { sw:3 }) + flat(circ(tx + 18, ty - 13, 9), tc, { sw:3 }) + deco(circ(tx + 26, ty - 3, 4), lighten(tc, .5)); break;
        case 'spike': s += flat(`M${tx},${ty - 8} C${tx + 10},${ty - 22} ${tx + 18},${ty - 30} ${tx + 30},${ty - 32} C${tx + 26},${ty - 22} ${tx + 30},${ty - 20} ${tx + 40},${ty - 18} C${tx + 32},${ty - 8} ${tx + 34},${ty - 2} ${tx + 40},${ty + 6} C${tx + 28},${ty + 8} ${tx + 12},${ty + 12} ${tx},${ty + 10} Z`, tc); break;
      }
    }
    /* ears, behind the body */
    const ear = (ex, ey, sgn, kind) => {
      const pink = spec.innerEar;
      switch(kind){
        case 'cat': {
          const d = `M${ex + 14 * sgn},${ey + 10} C${ex + 8 * sgn},${ey - 6} ${ex + 2 * sgn},${ey - 22} ${ex - 10 * sgn},${ey - 32} C${ex - 20 * sgn},${ey - 18} ${ex - 25 * sgn},${ey - 2} ${ex - 24 * sgn},${ey + 16} Z`;
          return shaded(d, base, dark, { cx:ex - 5 * sgn, cy:ey - 4 }) + deco(`M${ex + 4 * sgn},${ey + 4} C${ex + 1 * sgn},${ey - 6} ${ex - 3 * sgn},${ey - 14} ${ex - 10 * sgn},${ey - 21} C${ex - 15 * sgn},${ey - 11} ${ex - 17 * sgn},${ey - 2} ${ex - 16 * sgn},${ey + 9} Z`, pink);
        }
        case 'bunny': return `<g transform="rotate(${-15 * sgn} ${ex} ${ey})">` + shaded(`M${ex - 12},${ey + 6} C${ex - 15},${ey - 22} ${ex - 8},${ey - 58} ${ex},${ey - 60} C${ex + 8},${ey - 58} ${ex + 15},${ey - 22} ${ex + 12},${ey + 6} Z`, base, dark, { cx:ex, cy:ey - 26, s:.86, dx:3, dy:4 }) + deco(ell(ex, ey - 26, 6, 24), pink) + '</g>';
        case 'round': return shaded(circ(ex + 4 * sgn, ey - 10, 17), base, dark, { cx:ex + 4 * sgn, cy:ey - 10, s:.85, dx:3, dy:3 }) + deco(circ(ex + 4 * sgn, ey - 10, 8), pink);
        default: return '';
      }
    };
    if(spec.ears !== 'none' && spec.ears !== 'floppy'){
      const es = Math.max(.7, Math.min(1, m.hat.w / 100));
      const wrapEar = (ex, ey, sgn) => `<g transform="translate(${ex} ${ey}) scale(${es}) translate(${-ex} ${-ey})">` + ear(ex, ey, sgn, spec.ears) + '</g>';
      s += wrapEar(m.earL[0], m.earL[1], -1) + wrapEar(m.earR[0], m.earR[1], 1);
    }
    if(spec.ears === 'floppy'){
      const lx = m.earL[0] - 6, ly = m.earL[1], rx = m.earR[0] + 6, ry = m.earR[1];
      s += shaded(`M${lx},${ly} C${lx - 24},${ly - 6} ${lx - 36},${ly + 30} ${lx - 22},${ly + 58} C${lx - 14},${ly + 74} ${lx + 6},${ly + 60} ${lx + 6},${ly + 36} C${lx + 6},${ly + 16} ${lx + 4},${ly + 6} ${lx},${ly} Z`, dark, darken(dark, .2), { cx:lx - 12, cy:ly + 30 });
      s += shaded(`M${rx},${ry} C${rx + 24},${ry - 6} ${rx + 36},${ry + 30} ${rx + 22},${ry + 58} C${rx + 14},${ry + 74} ${rx - 6},${ry + 60} ${rx - 6},${ry + 36} C${rx - 6},${ry + 16} ${rx - 4},${ry + 6} ${rx},${ry} Z`, dark, darken(dark, .2), { cx:rx + 12, cy:ry + 30 });
    }
    /* crest on the head */
    if(st >= 2 && spec.crest !== 'none' && spec.crest !== 'bangs' && spec.crest !== 'ahoge'){
      const hx = m.hat.x, hy = m.hat.y + 2; const cc = evolved ? '#ffc83d' : accent;
      switch(spec.crest){
        case 'horn': s += flat(`M${hx - 8},${hy + 10} C${hx - 10},${hy - 6} ${hx - 6},${hy - 20} ${hx + 7},${hy - 30} C${hx + 5},${hy - 18} ${hx + 9},${hy - 6} ${hx + 6},${hy + 10} Z`, cc); break;
        case 'twohorn': s += flat(`M${hx - 26},${hy + 14} C${hx - 32},${hy + 2} ${hx - 33},${hy - 8} ${hx - 30},${hy - 18} C${hx - 22},${hy - 10} ${hx - 14},${hy - 2} ${hx - 8},${hy + 8} Z`, cc) + flat(`M${hx + 26},${hy + 14} C${hx + 32},${hy + 2} ${hx + 33},${hy - 8} ${hx + 30},${hy - 18} C${hx + 22},${hy - 10} ${hx + 14},${hy - 2} ${hx + 8},${hy + 8} Z`, cc); break;
        case 'leaf': s += `<g transform="translate(${hx} ${hy + 8}) rotate(8)">` + flat('M0,0 C-14,-12 -12,-38 0,-48 C12,-38 14,-12 0,0 Z', '#3fb86b') + line('M0,-4 L0,-40', 2.2) + '</g>'; break;
        case 'plume': s += line(`M${hx + 2},${hy + 8} C${hx + 2},${hy - 8} ${hx + 8},${hy - 18} ${hx + 16},${hy - 26}`, 3.5) + flat(`M${hx + 16},${hy - 26} C${hx + 8},${hy - 32} ${hx + 8},${hy - 46} ${hx + 20},${hy - 48} C${hx + 32},${hy - 48} ${hx + 34},${hy - 32} ${hx + 24},${hy - 24} Z`, cc); break;
        case 'antenna': s += line(`M${hx - 12},${hy + 8} C${hx - 20},${hy - 6} ${hx - 28},${hy - 14} ${hx - 34},${hy - 24}`) + line(`M${hx + 12},${hy + 8} C${hx + 20},${hy - 6} ${hx + 28},${hy - 14} ${hx + 34},${hy - 24}`) + flat(circ(hx - 35, hy - 26, 5), cc) + flat(circ(hx + 35, hy - 26, 5), cc); break;
        case 'fin': s += flat(`M${hx - 18},${hy + 12} C${hx - 14},${hy - 12} ${hx - 6},${hy - 28} ${hx + 2},${hy - 30} C${hx + 12},${hy - 20} ${hx + 16},${hy - 2} ${hx + 16},${hy + 12} Z`, cc); break;
        case 'tuft': s += flat(`M${hx - 15},${hy + 10} C${hx - 13},${hy - 2} ${hx - 9},${hy - 11} ${hx - 2},${hy - 16} C${hx - 2},${hy - 9} ${hx + 1},${hy - 9} ${hx + 5},${hy - 13} C${hx + 6},${hy - 6} ${hx + 9},${hy - 5} ${hx + 13},${hy - 8} C${hx + 15},${hy - 1} ${hx + 15},${hy + 4} ${hx + 15},${hy + 10} Z`, cc); break;
      }
    }
    /* body */
    s += shaded(m.d, base, dark, { cy:m.cy });
    /* cheek fluff sticking out of the silhouette */
    if(spec.fluff){
      const fyl = fy + 14;
      [[m.side[0] + 2, -1], [200 - m.side[0] - 2, 1]].forEach(([x, sgn]) => {
        s += flat(`M${x},${fyl - 12} C${x + 9 * sgn},${fyl - 12} ${x + 12 * sgn},${fyl - 8} ${x + 13 * sgn},${fyl - 4} C${x + 8 * sgn},${fyl - 4} ${x + 8 * sgn},${fyl - 3} ${x + 12 * sgn},${fyl + 1} C${x + 8 * sgn},${fyl + 4} ${x + 6 * sgn},${fyl + 4} ${x + 9 * sgn},${fyl + 9} C${x + 3 * sgn},${fyl + 10} ${x},${fyl + 8} ${x},${fyl + 4} Z`, base, { sw:2.2, soft:true });
      });
    }
    /* anime hair: bangs or a single curl, drawn on top of the head */
    if(st >= 2 && (spec.crest === 'bangs' || spec.crest === 'ahoge')){
      const hx = m.hat.x, hy = m.hat.y; const hc = evolved ? lighten(accent, .1) : lighten(base, .12);
      if(spec.crest === 'bangs'){
        s += shaded(`M${hx - 30},${hy + 18} C${hx - 30},${hy + 2} ${hx - 22},${hy - 6} ${hx - 12},${hy - 2} C${hx - 10},${hy - 12} ${hx},${hy - 14} ${hx + 6},${hy - 4} C${hx + 12},${hy - 12} ${hx + 24},${hy - 8} ${hx + 30},${hy + 16} C${hx + 22},${hy + 8} ${hx + 16},${hy + 22} ${hx + 10},${hy + 28} C${hx + 4},${hy + 18} ${hx - 4},${hy + 20} ${hx - 10},${hy + 30} C${hx - 14},${hy + 20} ${hx - 22},${hy + 20} ${hx - 30},${hy + 18} Z`, hc, null, { sw:2.2 });
        if(!LINE) s += `<path d="M${hx - 18},${hy + 6} Q${hx - 6},${hy - 2} ${hx + 4},${hy + 4}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>`;
      } else {
        s += line(`M${hx + 2},${hy + 4} C${hx - 2},${hy - 10} ${hx + 6},${hy - 24} ${hx + 18},${hy - 20} C${hx + 26},${hy - 18} ${hx + 22},${hy - 8} ${hx + 14},${hy - 10}`, 4, lineCol(base));
        if(!LINE) s += `<path d="M${hx + 2},${hy + 4} C${hx - 2},${hy - 10} ${hx + 6},${hy - 24} ${hx + 18},${hy - 20} C${hx + 26},${hy - 18} ${hx + 22},${hy - 8} ${hx + 14},${hy - 10}" fill="none" stroke="${hc}" stroke-width="2" stroke-linecap="round"/>`;
      }
    }
    /* pattern */
    const by = fy + 40;
    if(spec.pattern === 'belly') s += deco(`M${cx - 30},${by + 22} C${cx - 32},${by - 2} ${cx - 18},${by - 14} ${cx},${by - 14} C${cx + 18},${by - 14} ${cx + 32},${by - 2} ${cx + 30},${by + 22} C${cx + 20},${by + 32} ${cx - 20},${by + 32} ${cx - 30},${by + 22} Z`, light);
    if(spec.pattern === 'spots') s += deco(circ(cx - 24, by - 6, 6.5), dark) + deco(circ(cx + 22, by + 4, 5), dark) + deco(circ(cx + 2, by + 18, 5.5), dark) + deco(circ(cx - 10, by + 6, 3.2), dark);
    if(spec.pattern === 'stripes'){ const sl = m.side; s += deco(`M${sl[0] + 2},${sl[1] + 6} q15,-5 24,9 q-13,7 -24,-9Z`, dark) + deco(`M${200 - sl[0] - 2},${sl[1] + 6} q-15,-5 -24,9 q13,7 24,-9Z`, dark) + deco(`M${sl[0] + 8},${sl[1] + 26} q13,-3 20,8 q-11,6 -20,-8Z`, dark) + deco(`M${200 - sl[0] - 8},${sl[1] + 26} q-13,-3 -20,8 q11,6 20,-8Z`, dark); }
    if(spec.pattern === 'star') s += star(cx, by + 4, 9, light, { sw:2 });
    if(evolved) s += star(cx, fy - 22, 6, '#fff', { sw:2 });
    s += highlight(cx - 26, m.hat.y + 20, 9, 5);
    /* face */
    if(spec.muzzle) s += flat(ell(cx, fy + 17, 21, 13.5), lighten(base, .62), { sw:2, soft:true });
    const eyeDist = m.slim ? Math.min(spec.eyeDist, 19) : spec.eyeDist;
    s += eyes(cx, fy, eyeDist, spec.eyeR, spec.iris);
    if(spec.freckles && !LINE){ s += deco(circ(cx - eyeDist - 6, fy + 11, 1.5), dark) + deco(circ(cx - eyeDist, fy + 13, 1.5), dark) + deco(circ(cx + eyeDist + 6, fy + 11, 1.5), dark) + deco(circ(cx + eyeDist, fy + 13, 1.5), dark); }
    s += mouth(spec.mouth, cx, fy + (spec.muzzle ? 16 : 20), spec.mouth === 'open' ? 19 : spec.mouth === 'grin' ? 19 : 14);
    if(spec.muzzle && spec.mouth !== 'open' && spec.mouth !== 'grin') s += flat(ell(cx, fy + 11, 4.2, 3), '#3a3160', { sw:1.5 });
    s += blush(cx, fy + 13, eyeDist + 13);
    if(spec.whiskers){ const wy = fy + 10, wx = eyeDist + 22; s += line(`M${cx - wx},${wy - 3} L${cx - wx - 12},${wy - 6}`, 2.2) + line(`M${cx - wx + 1},${wy + 4} L${cx - wx - 11},${wy + 5}`, 2.2) + line(`M${cx + wx},${wy - 3} L${cx + wx + 12},${wy - 6}`, 2.2) + line(`M${cx + wx - 1},${wy + 4} L${cx + wx + 11},${wy + 5}`, 2.2); }
    /* arms and feet */
    if(spec.arms){ const [sx, sy] = m.side; s += `<g transform="rotate(24 ${sx + 8} ${sy + 14})">` + flat(ell(sx + 8, sy + 14, 11, 7.5), base, { soft:true }) + '</g>' + `<g transform="rotate(-24 ${200 - sx - 8} ${sy + 14})">` + flat(ell(200 - sx - 8, sy + 14, 11, 7.5), base, { soft:true }) + '</g>'; }

const SAVE_KEY = 'wordWilds.save.v2';

/* ---------- helpers ---------- */
const rnd = (n) => Math.floor(Math.random() * n);
function shuffle(arr){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickWeighted(items, weightFn){
  const ws = items.map(weightFn); const total = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for(let i = 0; i < items.length; i++){ r -= ws[i]; if(r <= 0) return items[i]; }
  return items[items.length - 1];
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'list'; }
function wordKey(w){ return String(w).toLowerCase().trim(); }

const SUFFIXES = ['mon', 'ling', 'ix', 'oo', 'puff', 'zor', 'tail', 'wisp', 'dra', 'bit', 'let', 'kin', 'nook', 'paw', 'bo', 'sprout'];
function autoName(w){
  const clean = String(w).replace(/[^a-zA-Z]/g, '');
  const stem = clean.slice(0, clean.length > 6 ? 5 : 4) || 'Word';
  return stem.charAt(0).toUpperCase() + stem.slice(1).toLowerCase() + SUFFIXES[Art.hash(clean.toLowerCase() + '|name') % SUFFIXES.length];
}
const SPECIES = ['Grass Wordling', 'Meadow Sprite', 'Trail Hopper', 'Fern Friend', 'Brook Bouncer', 'Hedge Hider', 'Sunny Puff', 'Pebble Pal', 'Dusk Dasher', 'Bloom Buddy'];

/* Split a word into syllable-like chunks for the Word Builder. */
function chunkWord(word){
  const parts = String(word).toLowerCase().split(/[\s-]+/).filter(Boolean);
  let chunks = [];
  parts.forEach(part => { chunks = chunks.concat(chunkPart(part)); });
  // keep between 2 and 6 tiles
  while(chunks.length > 6){ let bi = 0, bl = Infinity; for(let i = 0; i < chunks.length - 1; i++){ const l = chunks[i].length + chunks[i + 1].length; if(l < bl){ bl = l; bi = i; } } chunks.splice(bi, 2, chunks[bi] + chunks[bi + 1]); }
  if(chunks.length < 2){ const w = chunks.join(''); if(w.length >= 4){ const h = Math.ceil(w.length / 2); chunks = [w.slice(0, h), w.slice(h)]; } else chunks = w.split(''); }
  return chunks;
}
function chunkPart(w){
  const isV = (c, i) => 'aeiou'.includes(c) || (c === 'y' && i > 0);
  const letters = w.replace(/[^a-z]/g, '');
  if(letters.length <= 3) return [letters];
  let tailChunk = null, body = letters;
  // consonant + "le" ending stays together (ta-ble, gul-li-ble)
  if(/[^aeiou]le$/.test(letters) && letters.length > 4){ tailChunk = letters.slice(-3); body = letters.slice(0, -3); }
  // find vowel nuclei
  const nuclei = [];
  for(let i = 0; i < body.length; i++){
    if(isV(body[i], i)){ if(nuclei.length && nuclei[nuclei.length - 1].end === i - 1) nuclei[nuclei.length - 1].end = i; else nuclei.push({ start:i, end:i }); }
  }
  // silent final e joins the previous syllable
  if(nuclei.length > 1 && body.endsWith('e') && nuclei[nuclei.length - 1].start === body.length - 1 && !isV(body[body.length - 2], body.length - 2)) nuclei.pop();
  const cuts = [];
  for(let i = 0; i < nuclei.length - 1; i++){
    const a = nuclei[i], b = nuclei[i + 1];
    const n = b.start - a.end - 1;
    if(n === 0) cuts.push(b.start);
    else if(n === 1) cuts.push(a.end + 1);
    else {
      const c2 = body.slice(a.end + 1, a.end + 3);
      if(['ch', 'sh', 'th', 'ph', 'wh', 'ck', 'gh'].includes(c2)) cuts.push(a.end + 3);
      else cuts.push(a.end + 2);
    }
  }
  const out = []; let prev = 0;
  cuts.forEach(c => { if(c > prev && c < body.length){ out.push(body.slice(prev, c)); prev = c; } });
  out.push(body.slice(prev));
  if(tailChunk) out.push(tailChunk);
  return out.filter(Boolean);
}

function defaultState(){

function newDeck(id, name, words, custom){

    stops:{ meet:{ done:false }, catch:{ stars:0, best:0, done:false }, train:{ best:0 }, boss:{ stars:0, won:false }, dojo:{ best:0, done:false }, champion:{ stars:0, won:false } } };

  return d;
}
function setDeckWords(d, words){
  d.words = words.map(w => [String(w[0]).trim(), String(w[1]).trim(), String(w[2] || '').trim().toLowerCase()]);
  const rec = {};
  d.words.forEach(w => { const k = wordKey(w[0]); rec[k] = d.wordsRec && d.wordsRec[k] ? d.wordsRec[k] : { seen:false, mastery:0, correct:0, wrong:0, last:0 }; });
  d.wordsRec = rec;
}
