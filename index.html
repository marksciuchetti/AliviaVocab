/* ---------- progression ---------- */
const Progress = {
  level(){ return levelFromXp(state.xp); },
  title(){ return TITLES[Math.min(TITLES.length - 1, this.level() - 1)]; },
  xpIntoLevel(){ const L = this.level(); const prev = L > 1 ? xpForLevel(L - 1) : 0; return { have:state.xp - prev, need:xpForLevel(L) - prev }; },
  addCoins(n){ state.coins += n; },
  addXp(n){ state.xp += n; },
  recordAnswer(deckId, key, ok){
    const w = Deck.rec(deckId, key);
    w.seen = true;
    if(ok){ w.mastery = Math.min(MASTERY_MAX, w.mastery + 1); w.correct++; }
    else { w.mastery = Math.max(0, w.mastery - 1); w.wrong++; }
    w.last = Date.now();
    state.stats.answered++; if(ok) state.stats.correct++;
  },
  stageOf(deckId, key){ return stageFor(Deck.rec(deckId, key)); },
  snapshotStages(deckId){ const o = {}; Deck.words(deckId).forEach(w => { o[w.key] = stageFor(Deck.rec(deckId, w.key)); }); return o; },
  stopUnlocked(d, stopId){
    const s = d.stops;
    switch(stopId){
      case 'meet': return true;
      case 'catch': return s.meet.done;
      case 'train': return s.meet.done;
      case 'boss': return s.meet.done && s.train.best >= 70;
      case 'dojo': return s.meet.done;
      case 'champion': return s.boss.won;
    }
    return false;
  },
  stopStars(d, stopId){
    const s = d.stops;
    switch(stopId){
      case 'meet': return s.meet.done ? 3 : 0;
      case 'catch': return s.catch.stars;
      case 'train': return s.train.best === 100 ? 3 : s.train.best >= 80 ? 2 : s.train.best >= 60 ? 1 : 0;
      case 'boss': return s.boss.stars;
      case 'dojo': return s.dojo.best === 100 ? 3 : s.dojo.best >= 80 ? 2 : s.dojo.best >= 60 ? 1 : 0;
      case 'champion': return s.champion.stars;
    }
    return 0;
  },
  totalStars(d){ return STOPS.reduce((a, st) => a + this.stopStars(d, st.id), 0); },
  seenWords(deckId){ return Deck.words(deckId).filter(w => Deck.rec(deckId, w.key).seen); },
};

/* ---------- question factory ---------- */
const Quiz = {
  distractors(w, n){ return shuffle(Deck.words(w.deck).filter(o => o.key !== w.key)).slice(0, n); },
  make(w, type){
    const q = { type, deck:w.deck, key:w.key, word:w.word, def:w.def, pos:w.pos, wobj:w };
    if(type === 'd2w'){
      q.options = shuffle(this.distractors(w, 3).concat([w])).map(o => ({ id:o.key, text:o.word, correct:o.key === w.key }));
    } else if(type === 'w2d'){
      q.options = shuffle(this.distractors(w, 3).concat([w])).map(o => ({ id:o.key, text:o.def, correct:o.key === w.key }));
    } else if(type === 'pos'){
      const answer = w.pos === 'other' ? w.posRaw.toLowerCase() : w.pos;
      let pool = POS_LIST.includes(answer) ? POS_LIST.slice() : shuffle(POS_LIST).slice(0, 3).concat([answer]);
      q.options = shuffle(pool).map(p => ({ id:p, text:cap(p), correct:p === answer }));
    } else if(type === 'build'){
      q.chunks = w.chunks.slice();
      q.target = w.word.toLowerCase().replace(/[\s-]+/g, '');
      const others = Deck.words(w.deck).filter(o => o.key !== w.key);
      let decoy = null;
      for(let tries = 0; tries < 12 && !decoy && others.length; tries++){ const c = others[rnd(others.length)].chunks; const ch = c[rnd(c.length)]; if(!w.chunks.includes(ch) && ch.length > 1) decoy = ch; }
      q.tiles = shuffle(q.chunks.concat(decoy ? [decoy] : []));
    } else if(type === 'spell'){
      q.target = w.word;
    }
    return q;
  },
  checkText(q, text){
    const norm = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
    return norm(text) === norm(q.target);
  },
};

/* ---------- session (train, boss, dojo, champion, quick practice) ---------- */
const MODES = {
  train:    { title:'Training',        count:10, types:{ d2w:4, w2d:3, pos:3, build:1 },           coinsPer:10, xpPer:10 },
  grounds:  { title:'Quick Practice',  count:10, types:{ d2w:3, w2d:3, pos:2, build:2 },           coinsPer:10, xpPer:10 },
  dojo:     { title:'Spelling Dojo',   count:8,  types:{ spell:1 },                                coinsPer:12, xpPer:14 },
  boss:     { title:'Guardian Battle', hp:8,  hearts:3, types:{ d2w:3, w2d:2, pos:2, build:2, spell:1 }, coinsPer:15, xpPer:12 },
  champion: { title:'Champion Arena',  hp:12, hearts:3, types:{ d2w:2, w2d:2, pos:2, build:2, spell:3 }, coinsPer:20, xpPer:15 },
};

class Session {
  constructor(cfg){
    this.mode = cfg.mode; this.deckId = cfg.deckId || state.currentDeck;
    const m = MODES[this.mode];
    this.title = m.title;
    this.pool = cfg.pool;                       // word objects
    this.types = Object.assign({}, cfg.types || m.types);
    if(!this.pool.some(w => w.posRaw)) delete this.types.pos;
    this.count = m.count || 0;
    this.isBattle = !!m.hp;
    this.bossHpMax = m.hp || 0; this.bossHp = this.bossHpMax;
    this.hearts = m.hearts || 0; this.heartsMax = this.hearts;
    this.coinsPer = m.coinsPer; this.xpPer = m.xpPer;
    this.boss = cfg.boss || null;               // { name, spec } or 'quizzard'
    this.asked = 0; this.correct = 0; this.wrong = 0; this.streak = 0; this.bestStreak = 0;
    this.coins = 0; this.xp = 0; this.history = []; this.recent = []; this.requeue = []; this.missed = new Set();
    this.stagesBefore = Progress.snapshotStages(this.deckId);
    this.levelBefore = Progress.level();
    this.done = false; this.won = false; this.current = null; this.qStart = 0; this.extra = 0;
  }
  nextWord(){
    if(this.requeue.length && this.requeue[0].after <= this.asked){ return this.requeue.shift().w; }
    const candidates = this.pool.filter(w => !this.recent.includes(w.key));
    const list = candidates.length ? candidates : this.pool;
    return pickWeighted(list, w => { const r = Deck.rec(this.deckId, w.key); return 1 + (MASTERY_MAX - r.mastery) * 1.1 + (r.wrong > r.correct ? 1.5 : 0); });
  }
  pickType(w){
    const t = Object.assign({}, this.types); if(!w.posRaw) delete t.pos;
    const keys = Object.keys(t);
    if(this.asked === 0 && keys.includes('d2w')) return 'd2w';
    return pickWeighted(keys, k => t[k]);
  }
  next(){
    if(this.done) return null;
    if(!this.isBattle && this.asked >= this.count + this.extra){ this.finish(true); return null; }
    const w = this.nextWord();
    this.recent.push(w.key); if(this.recent.length > 2) this.recent.shift();
    this.current = Quiz.make(w, this.pickType(w));
    this.qStart = Date.now();
    return this.current;
  }
  answer(ok){
    const q = this.current; if(!q || this.done) return null;
    this.asked++;
    const ev = { ok, key:q.key, coins:0, xp:0, crit:false, speedy:false, heartLost:false, damage:0, bossDown:false, defeated:false, finished:false, streak:0 };
    const elapsed = Date.now() - this.qStart;
    Progress.recordAnswer(this.deckId, q.key, ok);
    if(ok){
      this.correct++; this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
      let coins = this.coinsPer + Math.min(25, Math.max(0, this.streak - 1) * 5);
      let xp = this.xpPer + ((q.type === 'spell' || q.type === 'build') ? 5 : 0);
      if(elapsed < 6000){ coins += 5; ev.speedy = true; }
      ev.coins = coins; ev.xp = xp; this.coins += coins; this.xp += xp;
      Progress.addCoins(coins); Progress.addXp(xp);
      if(this.isBattle){
        const dmg = this.streak >= 3 ? 2 : 1; ev.crit = dmg === 2; ev.damage = dmg;
        this.bossHp = Math.max(0, this.bossHp - dmg);
        if(this.bossHp === 0){ ev.bossDown = true; this.finish(true); ev.finished = true; }
      }
    } else {
      this.wrong++; this.streak = 0; this.missed.add(q.key);
      if(this.isBattle){ this.hearts--; ev.heartLost = true; if(this.hearts <= 0){ ev.defeated = true; this.finish(false); ev.finished = true; } }
      if(!this.done){ this.requeue.push({ w:q.wobj, after:this.asked + 2 }); if(!this.isBattle && this.extra < 3) this.extra++; }
    }
    ev.streak = this.streak;
    this.history.push({ key:q.key, type:q.type, ok });
    if(!this.isBattle && !this.done && this.asked >= this.count + this.extra){ this.finish(true); ev.finished = true; }
    Store.save();
    return ev;
  }
  finish(won){
    if(this.done) return;
    this.done = true; this.won = won;
    const d = Deck.get(this.deckId);
    state.stats.sessions++;
    state.stats.bestStreak = Math.max(state.stats.bestStreak, this.bestStreak);
    const res = { mode:this.mode, deckId:this.deckId, won, correct:this.correct, asked:this.asked, coins:this.coins, xp:this.xp,
                  stars:0, bonusCoins:0, bonusXp:0, newBadge:false, evolved:[], levelUp:false, percent:this.asked ? Math.round(this.correct / this.asked * 100) : 0 };
    const pctStars = p => p === 100 ? 3 : p >= 80 ? 2 : p >= 60 ? 1 : 0;
    if(this.mode === 'train'){
      res.stars = pctStars(res.percent); if(res.percent > d.stops.train.best) d.stops.train.best = res.percent;
      res.bonusCoins = 30 + res.stars * 10; res.bonusXp = 40;
    } else if(this.mode === 'dojo'){
      res.stars = pctStars(res.percent); d.stops.dojo.done = true; if(res.percent > d.stops.dojo.best) d.stops.dojo.best = res.percent;
      res.bonusCoins = 30 + res.stars * 10; res.bonusXp = 50;
    } else if(this.mode === 'boss'){
      if(won){ res.stars = Math.max(1, this.hearts); d.stops.boss.won = true; d.stops.boss.stars = Math.max(d.stops.boss.stars, res.stars); res.bonusCoins = 100 + this.hearts * 25; res.bonusXp = 150; state.stats.battlesWon++; }
      else { res.bonusCoins = 10; res.bonusXp = 20; }
    } else if(this.mode === 'champion'){
      if(won){ res.stars = Math.max(1, this.hearts); if(!d.stops.champion.won) res.newBadge = true; d.stops.champion.won = true; d.stops.champion.stars = Math.max(d.stops.champion.stars, res.stars); res.bonusCoins = 250 + this.hearts * 50; res.bonusXp = 350; state.stats.battlesWon++; }
      else { res.bonusCoins = 20; res.bonusXp = 30; }
    } else {
      res.stars = pctStars(res.percent); res.bonusCoins = 20 + res.stars * 10; res.bonusXp = 30;
    }
    Progress.addCoins(res.bonusCoins); Progress.addXp(res.bonusXp);
    const after = Progress.snapshotStages(this.deckId);
    Deck.words(this.deckId).forEach(w => { if(after[w.key] > this.stagesBefore[w.key] && after[w.key] >= 2) res.evolved.push({ w, from:this.stagesBefore[w.key], to:after[w.key] }); });
    res.levelUp = Progress.level() > this.levelBefore;
    res.level = Progress.level();
    this.result = res;
    Store.save();
  }
}

/* ---------- Tall Grass Hunt (catch run) ---------- */
class Hunt {
  constructor(deckId, pool){
    this.deckId = deckId; this.queue = shuffle(pool); this.qi = 0;
    this.caught = []; this.phase = 0; this.hits = 0; this.drill = null; this.escaped = null;
    this.clean = {}; this.queue.forEach(w => { this.clean[w.key] = true; });
    this.coins = 0; this.xp = 0; this.misses = 0; this.asked = 0; this.correct = 0;
    this.stagesBefore = Progress.snapshotStages(deckId); this.levelBefore = Progress.level();
    this.done = false; this.current = null; this.hpPct = 100; this.streak = 0; this.bestStreak = 0;
  }
  foe(){ return this.queue[this.qi]; }
  needed(){ const w = this.foe(); return w && w.posRaw ? 2 : 1; }
  question(){
    const w = this.foe(); if(!w) return null;
    let type;
    if(this.drill){ type = (w.posRaw && this.drill.done % 2 === 1) ? 'pos' : (this.drill.done % 2 === 1 ? 'w2d' : 'd2w'); }
    else type = this.phase === 0 ? 'd2w' : (w.posRaw ? 'pos' : 'w2d');
    this.current = Quiz.make(w, type);
    return this.current;
  }
  answer(ok){
    const w = this.foe(); const ev = { ok, caught:false, drillStart:false, drillDone:false, drillProgress:false, fled:null, returned:null, coins:0, xp:0, finished:false };
    this.asked++;
    if(this.drill){
      if(ok){
        this.drill.done++; ev.drillProgress = true; ev.coins = 5; this.coins += 5; Progress.addCoins(5);
        if(this.drill.done >= this.drill.need){
          Progress.recordAnswer(this.deckId, w.key, true);
          if(this.escaped){ this.caught.push(this.escaped); ev.returned = this.escaped; this.escaped = null; }
          this.drill = null; ev.drillDone = true; ev.xp = 10; this.xp += 10; Progress.addXp(10);
        }
      }
      Store.save();
      return ev;
    }
    if(ok){
      this.correct++; this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
      Progress.recordAnswer(this.deckId, w.key, true);
      this.hits++;
      const coins = 10 + Math.min(20, Math.max(0, this.streak - 1) * 5); ev.coins = coins; this.coins += coins; Progress.addCoins(coins);
      ev.xp = 10; this.xp += 10; Progress.addXp(10);
      if(this.hits >= this.needed()){
        this.caught.push(w); ev.caught = true; state.stats.caught++;
        ev.coins += 15; this.coins += 15; Progress.addCoins(15); ev.xp += 10; this.xp += 10; Progress.addXp(10);
        this.qi++; this.phase = 0; this.hits = 0;
        if(this.qi >= this.queue.length){ this.finish(); ev.finished = true; }
      } else this.phase++;
    } else {
      this.misses++; this.streak = 0; this.clean[w.key] = false;
      Progress.recordAnswer(this.deckId, w.key, false);
      this.hpPct = Math.max(0, this.hpPct - 34);
      if(DRILL_REPS > 0){
        this.drill = { need:DRILL_REPS, done:0 }; ev.drillStart = true;
        if(LOSE_A_CREATURE && this.caught.length){ this.escaped = this.caught.pop(); ev.fled = this.escaped; }
      }
    }
    Store.save();
    return ev;
  }
  finish(){
    if(this.done) return; this.done = true;
    const d = Deck.get(this.deckId);
    const total = this.queue.length; const clean = this.queue.filter(w => this.clean[w.key]).length;
    const pct = total ? Math.round(clean / total * 100) : 0;
    const tier = pct === 100 ? { name:'Perfect Hunt', stars:3 } : pct >= 80 ? { name:'Gold Hunt', stars:2 } : pct >= 60 ? { name:'Silver Hunt', stars:1 } : { name:'Explorer Hunt', stars:1 };
    d.stops.catch.done = true; d.stops.catch.stars = Math.max(d.stops.catch.stars, tier.stars); d.stops.catch.best = Math.max(d.stops.catch.best, pct);
    state.stats.sessions++; state.stats.bestStreak = Math.max(state.stats.bestStreak, this.bestStreak);
    const bonusCoins = 50 + tier.stars * 25, bonusXp = 100;
    Progress.addCoins(bonusCoins); Progress.addXp(bonusXp);
    const after = Progress.snapshotStages(this.deckId); const evolved = [];
    Deck.words(this.deckId).forEach(w => { if(after[w.key] > this.stagesBefore[w.key] && after[w.key] >= 2) evolved.push({ w, from:this.stagesBefore[w.key], to:after[w.key] }); });
    this.result = { mode:'catch', deckId:this.deckId, won:true, stars:tier.stars, tier:tier.name, clean, total, percent:pct, coins:this.coins, xp:this.xp, bonusCoins, bonusXp,
                    evolved, levelUp:Progress.level() > this.levelBefore, level:Progress.level(), caught:this.caught.slice(), missed:this.queue.filter(w => !this.clean[w.key]) };
    Store.save();
  }
}

  function renderHuntMeta(){

  async function nextWild(){

  function setHuntPanel(html){ $('#hpanel').innerHTML = html + '<div id="feedback"></div>'; }
  function askWild(){
    const q = hunt.question(); if(!q) return finishHunt();
    const w = hunt.foe(); const keyHint = (i) => `<span class="key">${i + 1}</span>`;
    let head;
    if(hunt.drill) head = `<div class="drill-bar">${I.pencil}<span>Practice <b>${esc(w.word)}</b></span><span class="pips">${Array.from({ length:hunt.drill.need }, (_, i) => `<i class="${i < hunt.drill.done ? 'done' : ''}"></i>`).join('')}</span></div>`;
    else head = '';
    let prompt;
    if(q.type === 'd2w') prompt = `<div class="prompt">${esc(w.name)} asks: which word means...</div><div class="quote">${esc(q.def)}</div>`;
    else if(q.type === 'pos') prompt = `<div class="prompt">${esc(w.name)} asks: what part of speech is...</div><div class="big">${esc(q.word)} <button class="icon-btn" data-action="say" data-text="${esc(q.word)}" aria-label="Hear the word">${I.speaker}</button></div>`;
    else prompt = `<div class="prompt">${esc(w.name)} asks: what does this word mean?</div><div class="big">${esc(q.word)} <button class="icon-btn" data-action="say" data-text="${esc(q.word)}" aria-label="Hear the word">${I.speaker}</button></div>`;
    setHuntPanel(`${head}<div class="question">${prompt}</div><div class="choices ${q.type === 'w2d' ? 'stack' : ''}" id="choices">${q.options.map((o, i) => `<button class="choice" data-action="chooseWild" data-i="${i}">${keyHint(i)}<span>${esc(o.text)}</span></button>`).join('')}</div>`);
  }
  async function chooseWild(i){
    const q = hunt.current; if(!q || q.locked) return; q.locked = true;
    const ok = q.options[i].correct; const w = hunt.foe();
    $$('#choices .choice').forEach((b, k) => { if(q.options[k].correct) b.classList.add('correct'); else if(k === i) b.classList.add('wrong'); else b.classList.add('dim'); });
    $('#choices').classList.add('locked');
    const ev = hunt.answer(ok);
    bumpCoins(); renderHuntMeta();
    const partner = $('#partnerArt .creature'), wild = $('#wildArt .creature'), arena = $('#harena');
    const fb = $('#feedback');
    const answerText = q.options.find(o => o.correct).text;
    if(ok){
      Sound.play(ev.caught ? 'grab' : 'correct');
      if(partner){ partner.className = 'creature lunge'; } burst($('#partnerArt'));
      if(!hunt.drill || ev.drillDone){ setTimeout(() => { if(wild){ wild.className = 'creature hit'; } }, 240); }
      if(ev.coins) floatNum($('#partnerArt'), `+${ev.coins} ${I.coin}`);
      sfx(ev.caught ? 'CAUGHT!' : ev.drillDone ? 'PRACTICED!' : ev.drillProgress ? 'YES!' : ['NICE!', 'HIT!', 'GREAT!'][rnd(3)], ev.caught ? 'mint' : '', arena);
      if(!ev.caught) renderWildPlate(); else { const pl = $('#wildPlate'); if(pl) pl.innerHTML = `<b>${esc(w.name)}</b> ${typePill(w.pos)}<div class="small muted" style="margin-top:4px">Caught!</div>`; }
      let msg;
      if(ev.caught) msg = `<b>${esc(w.name)} joined your team!</b>${esc(w.word)}: ${esc(w.def)}`;
      else if(ev.drillDone) msg = `<b>Practice complete!</b>${ev.returned ? esc(ev.returned.name) + ' heard you practicing and came back. ' : ''}Back to the hunt.`;
      else if(ev.drillProgress) msg = `<b>Correct.</b> ${hunt.drill.need - hunt.drill.done} more to go.`;
      else msg = `<b>Direct hit!</b> One more question and ${esc(w.name)} is yours.`;
      fb.innerHTML = `<div class="feedback good"><div class="fb-text">${msg}</div></div>`;
      if(ev.returned){ await wait(600); renderStrip(); }
      if(ev.caught){ await wait(700); if(wild) wild.className = 'creature vanish'; await wait(500); renderStrip(); }
      await wait(ev.caught ? 900 : 1200);
      if(current !== 'hunt' || !hunt) return;
      if(ev.finished) return finishHunt();
      if(ev.caught) nextWild(); else { if(wild) wild.className = 'creature bob'; askWild(); }
    } else {
      Sound.play('wrong');
      if(partner){ partner.className = 'creature shake'; }
      if(!hunt.drill || ev.drillStart){ setTimeout(() => { if(wild) wild.className = 'creature lungeL'; Sound.play('hurt'); flashScreen(); const hp = $('#huntHp'); if(hp){ hp.style.width = hunt.hpPct + '%'; hp.classList.toggle('low', hunt.hpPct <= 34); } }, 200); }
      sfx('MISS', 'bad', arena);
      let msg = `<b>Not quite. The answer is <u>${esc(answerText)}</u>.</b>${q.type === 'pos' ? esc(w.word) + ' is ' + (/^[aeiou]/.test(answerText.toLowerCase()) ? 'an ' : 'a ') + esc(answerText.toLowerCase()) + '.' : esc(w.word) + ': ' + esc(w.def)}`;
      if(ev.drillStart){
        msg += `<div class="small" style="margin-top:6px">${ev.fled ? `<strong>${esc(ev.fled.name)}</strong> slipped out of your bag and ran into the grass! ` : ''}Practice <strong>${esc(w.word)}</strong> ${hunt.drill.need} times to ${ev.fled ? 'bring it back' : 'continue'}.</div>`;
        if(ev.fled){ Sound.play('flee'); await wait(300); renderStrip(); }
      } else if(hunt.drill) msg += `<div class="small" style="margin-top:6px">That one does not count. Try again.</div>`;
      fb.innerHTML = `<div class="feedback bad"><div class="fb-text">${msg}</div><button class="icon-btn" data-action="say" data-text="${esc(w.word)}" aria-label="Hear the word">${I.speaker}</button><button class="btn" data-action="nextWild" id="nextBtn">Got it</button></div>`;
      setTimeout(() => { const b = $('#nextBtn'); if(b) b.focus(); }, 100);
      if(hunt.hpPct === 0){ hunt.hpPct = 100; setTimeout(() => { const hp = $('#huntHp'); if(hp){ hp.style.width = '100%'; hp.classList.remove('low'); } toast(`${partnerName()} took a rest and is full of energy again.`); }, 1500); }
    }
  }
  function continueWild(){ if(!hunt || hunt.done) return finishHunt(); const wild = $('#wildArt .creature'); if(wild) wild.className = 'creature bob'; askWild(); }
  function finishHunt(){ if(!hunt) return; if(!hunt.done) hunt.finish(); const res = hunt.result; renderResult(res, hunt); }
  function quitHunt(){
    if(!hunt || hunt.done){ hunt = null; renderTrail(); return; }
    modal(`<h2>Leave the hunt?</h2><p style="margin:10px 0 18px;font-weight:600">Your coins and XP so far are safe, but the hunt will start over next time.</p><div class="btn-row"><button class="btn coral" data-action="confirmQuitHunt">Leave</button><button class="btn white" data-action="closeModal">Keep hunting</button></div>`);
  }

  /* ---------- Sessions (train, boss, dojo, champion, quick practice) ---------- */
  function startSession(cfg){ session = new Session(cfg); renderQuizShell(); nextQuestion(); }
  function arenaClass(){ return { train:'market', boss:'civic', dojo:'mind', champion:'champion', grounds:'geo' }[session.mode] || 'geo'; }
  function renderQuizShell(){
    const s = session; const d = Deck.get(s.deckId);
    $('#screen-quiz').innerHTML = `
      <div class="quiz-top">
        <button class="icon-btn" data-action="quitSession" aria-label="Leave">${I.back}</button>
        <h2 style="font-size:1.3rem">${s.title} <span class="pill" style="font-size:.8rem;vertical-align:middle">${esc(d.name)}</span></h2>
        <span class="spacer" style="flex:1"></span>
        <div id="qmeta" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
      </div>
      <div class="arena ${arenaClass()}"><div class="arena-inner" id="arena"></div></div>
      <div class="panel" id="qpanel"></div>`;
    renderArena();
    show('quiz');
  }
  function renderMeta(){
    const s = session; const m = $('#qmeta'); if(!m) return;
    let html = '';
    if(s.streak >= 3) html += `<span class="streak">${I.flame} ${s.streak} streak</span>`;
    if(!s.isBattle){ const total = s.count + s.extra; html += `<span class="pill">${Math.min(s.asked, total)} / ${total}</span><div class="qbar" style="width:160px"><i style="width:${Math.min(100, s.asked / total * 100)}%"></i></div>`; }
    m.innerHTML = html;
  }
  function bossArt(s, cls){ return creatureHTML(s.boss.spec, { stage:3, aura:true }, cls); }
  function renderArena(){
    const s = session; const a = $('#arena');
    const heartsHtml = s.isBattle ? `<div class="hearts" id="hearts">${Array.from({ length:s.heartsMax }, (_, i) => i < s.hearts ? I.heart : I.heartEmpty).join('')}</div>` : '';
    let right;
    if(s.isBattle) right = `<div class="fighter boss"><div class="plate"><b>${esc(s.boss.name)}</b><div class="hpbar"><i id="bosshp" style="width:100%"></i></div></div><div id="bossArt">${bossArt(s, 'bob')}</div></div>`;
    else right = `<div class="fighter boss"><div class="plate"><b id="mysteryName">Who could it be?</b><span class="small muted">Answer to find out</span></div><div id="bossArt"></div></div>`;
    a.innerHTML = `
      <div class="fighter"><div class="plate"><b>${esc(state.name)} &amp; ${esc(partnerName())}</b>${heartsHtml}${!s.isBattle ? `<span class="small muted">Streak bonus at 3</span>` : ''}</div><div id="partnerArt">${partnerObj() ? creatureHTML(partnerObj(), partnerOpts(), 'bob') : ''}</div></div>
      <div class="vs">VS</div>
      ${right}`;
  }
  function nextQuestion(){
    const q = session.next();
    if(!q){ return finishSession(); }
    renderMeta();
    const pa = $('#partnerArt'); if(pa && partnerObj()) pa.innerHTML = creatureHTML(partnerObj(), partnerOpts(), 'bob');
    if(session.isBattle){ const ba = $('#bossArt .creature'); if(ba) ba.className = 'creature bob'; }
    else { $('#bossArt').innerHTML = creatureHTML(q.wobj, { stage:Math.max(1, stageFor(Deck.rec(q.deck, q.key))) }, 'silhouette bob'); $('#mysteryName').textContent = 'Who could it be?'; }
    const p = $('#qpanel'); const keyHint = (i) => `<span class="key">${i + 1}</span>`;
    let body = '';
    const choicesHtml = (stack) => `<div class="choices ${stack ? 'stack' : ''}" id="choices">${q.options.map((o, i) => `<button class="choice" data-action="choose" data-i="${i}">${keyHint(i)}<span>${esc(o.text)}</span></button>`).join('')}</div>`;
    if(q.type === 'd2w') body = `<div class="question"><div class="prompt">Which word matches this meaning?</div><div class="quote">${esc(q.def)}</div></div>` + choicesHtml(false);
    else if(q.type === 'w2d') body = `<div class="question"><div class="prompt">What does this word mean?</div><div class="big">${esc(q.word)} <button class="icon-btn" data-action="say" data-text="${esc(q.word)}" aria-label="Hear the word">${I.speaker}</button></div></div>` + choicesHtml(true);
    else if(q.type === 'pos') body = `<div class="question"><div class="prompt">What part of speech is this word?</div><div class="big">${esc(q.word)} <button class="icon-btn" data-action="say" data-text="${esc(q.word)}" aria-label="Hear the word">${I.speaker}</button></div><div class="small muted" style="margin-top:6px">${esc(q.def)}</div></div>` + choicesHtml(false);
    else if(q.type === 'build'){ q.placed = []; body = `<div class="question"><div class="prompt">Build the word that means:</div><div class="quote">${esc(q.def)}</div></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div class="btn-row center" style="margin-top:12px"><button class="btn white" data-action="clearTiles">Clear</button><span class="small muted">${q.tiles.length > q.chunks.length ? 'One tile does not belong.' : 'Use every tile.'}</span></div>`; }
    else if(q.type === 'spell'){ q.hints = 0; body = `<div class="question"><div class="prompt">Spell the word that means:</div><div class="quote">${esc(q.def)}</div>${q.pos !== 'other' ? `<div class="small muted" style="margin-top:8px">Part of speech: ${esc(posInfo(q.pos).label.toLowerCase())}</div>` : ''}</div>
        <div class="letter-hint" id="letterHint">${letterHint(q)}</div>
        <input class="spell-input" id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word" aria-label="Type the word">
        <div class="btn-row center" style="margin-top:12px"><button class="btn" data-action="checkSpell">Check</button><button class="btn white" data-action="hintSpell" id="hintBtn">Hint ${hintCost(q) ? `(${hintCost(q)} ${I.coin})` : '(free)'}</button><button class="icon-btn" data-action="say" data-text="${esc(q.word)}" aria-label="Hear the word" title="Hear the word">${I.speaker}</button></div>`; }
    p.innerHTML = body + `<div id="feedback"></div>`;
    if(q.type === 'build') renderBuilder();
    if(q.type === 'spell'){ const inp = $('#spellInput'); inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); actions.checkSpell(); } }); setTimeout(() => inp.focus(), 80); }
  }
  function hintCost(q){ return q.hints === 0 ? 0 : 10; }
  function letterHint(q){ const t = q.target; let out = ''; for(let i = 0; i < t.length; i++){ const ch = t[i]; if(ch === ' ') out += '&nbsp;&nbsp;'; else out += (i < (q.hints || 0) ? esc(ch) : '_'); } return out; }
  function renderBuilder(){
    const q = session.current; const slots = $('#slots'), tiles = $('#tiles');
    slots.innerHTML = q.chunks.map((c, i) => { const t = q.placed[i]; return t === undefined ? `<div class="slot empty">${esc(c)}</div>` : `<button class="slot filled" data-action="unplace" data-i="${i}">${esc(q.tiles[t])}</button>`; }).join('');
    tiles.innerHTML = q.tiles.map((t, i) => `<button class="tile ${q.placed.includes(i) ? 'used' : ''}" data-action="place" data-i="${i}">${esc(t)}</button>`).join('');
  }
  function placeTile(i){
    const q = session.current; if(q.locked || q.placed.includes(i)) return;
    const slot = q.placed.findIndex(v => v === undefined);
    if(q.placed.length < q.chunks.length && slot === -1) q.placed.push(i); else if(slot !== -1) q.placed[slot] = i; else return;
    Sound.play('click'); renderBuilder();
    if(q.placed.length === q.chunks.length && !q.placed.includes(undefined)){ const built = q.placed.map(k => q.tiles[k]).join(''); q.locked = true; setTimeout(() => resolveAnswer(built === q.target, built), 250); }
  }
  function unplace(i){ const q = session.current; if(q.locked) return; q.placed[i] = undefined; while(q.placed.length && q.placed[q.placed.length - 1] === undefined) q.placed.pop(); renderBuilder(); }
  function clearTiles(){ const q = session.current; if(q.locked) return; q.placed = []; renderBuilder(); }
  function choose(i){
    const q = session.current; if(q.locked) return; q.locked = true;
    const ok = q.options[i].correct;
    $$('#choices .choice').forEach((b, k) => { if(q.options[k].correct) b.classList.add('correct'); else if(k === i) b.classList.add('wrong'); else b.classList.add('dim'); });
    $('#choices').classList.add('locked');
    resolveAnswer(ok, q.options[i].text);
  }
  function checkSpell(){
    const q = session.current; if(q.locked) return; const inp = $('#spellInput'); const val = inp.value.trim(); if(!val){ inp.focus(); return; }
    const ok = Quiz.checkText(q, val); q.locked = true; inp.classList.add(ok ? 'ok' : 'bad'); inp.disabled = true;
    resolveAnswer(ok, val);
  }
  function hintSpell(){
    const q = session.current; if(q.locked) return;
    const cost = hintCost(q);
    if(q.hints >= q.target.replace(/ /g, '').length) return;
    if(cost > state.coins){ toast('Not enough coins for another hint'); return; }
    if(cost){ state.coins -= cost; bumpCoins(); Store.save(); }
    q.hints++; while(q.target[q.hints - 1] === ' ') q.hints++;
    $('#letterHint').innerHTML = letterHint(q);
    const hb = $('#hintBtn'); if(hb) hb.innerHTML = `Hint (${hintCost(q)} ${I.coin})`;
    Sound.play('click'); const inp = $('#spellInput'); if(inp) inp.focus();
  }
  function resolveAnswer(ok, given){
    const s = session; const q = s.current; const w = q.wobj;
    const ev = s.answer(ok);
    bumpCoins(); renderMeta();
    const partner = $('#partnerArt .creature'), boss = $('#bossArt .creature'), arena = $('#arena');
    if(!s.isBattle){ $('#bossArt').innerHTML = creatureHTML(w, { stage:Math.max(1, stageFor(Deck.rec(w.deck, w.key))) }, ok ? 'pop' : 'shake'); $('#mysteryName').textContent = w.name + ' (' + w.word + ')'; }
    const answerText = q.type === 'pos' ? q.options.find(o => o.correct).text : w.word;
    if(ok){
      Sound.play(ev.crit ? 'crit' : 'correct');
      if(partner){ partner.className = 'creature ' + (s.isBattle ? 'lunge' : 'hop'); }
      burst($('#partnerArt'));
      if(s.isBattle && boss){ setTimeout(() => { boss.className = 'creature hit'; Sound.play('hit'); const hp = $('#bosshp'); if(hp){ hp.style.width = (s.bossHp / s.bossHpMax * 100) + '%'; hp.classList.toggle('low', s.bossHp / s.bossHpMax <= .3); } floatNum($('#bossArt'), `-${ev.damage}`, 'dmg'); }, 260); }
      sfx(ev.crit ? 'CRITICAL!' : ev.streak >= 5 ? 'ON FIRE!' : ev.streak >= 3 ? 'COMBO!' : ['NICE!', 'YES!', 'GREAT!', 'SUPER!'][rnd(4)], ev.crit ? 'bad' : '', arena);
      floatNum($('#partnerArt'), `+${ev.coins} ${I.coin}`);
    } else {
      Sound.play('wrong');
      if(partner){ partner.className = 'creature shake'; }
      if(s.isBattle){ setTimeout(() => { if(boss){ boss.className = 'creature lungeL'; } Sound.play('hurt'); flashScreen(); renderHearts(); }, 200); }
      sfx('MISS', 'bad', arena);
    }
    const fb = $('#feedback');
    const speak = `<button class="icon-btn" data-action="say" data-text="${esc(w.word)}" aria-label="Hear the word">${I.speaker}</button>`;
    const explain = q.type === 'pos' ? `${esc(w.word)} is ${/^[aeiou]/.test(answerText.toLowerCase()) ? 'an' : 'a'} ${esc(answerText.toLowerCase())}. ${esc(w.def)}` : esc(w.def);
    if(ok) fb.innerHTML = `<div class="feedback good"><div class="fb-text"><b>${ev.crit ? 'Critical hit! ' : ''}${esc(cap(answerText))} is right!</b>${explain}${ev.speedy ? ' <span class="pill" style="background:var(--gold-2);font-size:.8rem;margin-left:6px">Speedy +5</span>' : ''}</div>${speak}<button class="btn" data-action="nextQ" id="nextBtn">Next</button></div>`;
    else fb.innerHTML = `<div class="feedback bad"><div class="fb-text"><b>Not quite. The answer is <u>${esc(answerText)}</u>.</b>${explain}<div class="small muted" style="margin-top:4px">${q.type === 'spell' || q.type === 'build' ? `You wrote: ${esc(given)}` : 'This word will come back soon so you can catch it.'}</div></div>${speak}<button class="btn" data-action="nextQ" id="nextBtn">Got it</button></div>`;
    const myToken = ++advanceToken;
    if(ev.finished){ setTimeout(() => { if(myToken === advanceToken) finishSession(); }, ok ? 1400 : 2200); return; }
    if(ok){ setTimeout(() => { if(myToken === advanceToken) nextQuestion(); }, 1700); }
    else { setTimeout(() => { const b = $('#nextBtn'); if(b) b.focus(); }, 100); }
  }
  function renderHearts(){ const h = $('#hearts'); if(!h) return; h.innerHTML = Array.from({ length:session.heartsMax }, (_, i) => i < session.hearts ? I.heart : I.heartEmpty).join(''); const lost = h.children[session.hearts]; if(lost) lost.classList.add('lost'); }
  function nextQ(){ advanceToken++; if(session.done) finishSession(); else nextQuestion(); }
  function quitSession(){
    if(!session || session.done){ pendingNav = null; renderTrail(); return; }
    modal(`<h2>Leave this ${session.isBattle ? 'battle' : 'session'}?</h2><p style="margin:10px 0 18px;font-weight:600">Your coins and XP so far are safe, but the ${session.isBattle ? 'battle' : 'session'} will not be finished.</p><div class="btn-row"><button class="btn coral" data-action="confirmQuit">Leave</button><button class="btn white" data-action="closeModal">Keep going</button></div>`);
  }
  function finishSession(){ advanceToken++; const s = session; if(!s.done) s.finish(s.isBattle ? s.bossHp === 0 : true); renderResult(s.result, s); }

  /* ---------- Result ---------- */
  function renderResult(res, run){
    const d = Deck.get(res.deckId); const won = res.won; const isBattle = res.mode === 'boss' || res.mode === 'champion';
    let headline, sub;
    if(res.mode === 'catch'){ headline = res.tier + '!'; sub = `You caught all ${res.total} creatures and knew ${res.clean} of ${res.total} on the first try.`; }
    else if(res.mode === 'boss'){ headline = won ? `${run.boss.name.replace('Guardian ', '')} is impressed!` : 'The Guardian wins this round'; sub = won ? 'The Champion Arena is open!' : 'Every miss teaches you something. Train a little and try again!'; }
    else if(res.mode === 'champion'){ headline = won ? 'CHAMPION!' : 'So close!'; sub = won ? `${esc(state.name)} is the Champion of ${esc(d.name)}!` : 'The Quizzard is tough. Practice the words you missed and return.'; }
    else { headline = res.percent === 100 ? 'Perfect!' : res.percent >= 80 ? 'Excellent work!' : res.percent >= 60 ? 'Good job!' : 'Keep practicing!'; sub = `You answered ${res.correct} of ${res.asked} correctly (${res.percent}%).`; }

    const missed = res.mode === 'catch' ? res.missed : Array.from(run.missed).map(k => Deck.find(res.deckId, k)).filter(Boolean);

    $('#screen-result').innerHTML = `
      <div class="panel" style="max-width:760px;margin:0 auto">
        <div class="result-hero">
          ${hero}
          <h2 style="font-size:2rem;margin-top:4px">${headline}</h2>
          <p style="font-weight:600;margin-top:4px">${sub}</p>
          ${showStars ? `<div class="result-stars">${[0, 1, 2].map(i => i < res.stars ? I.star : I.starEmpty).join('')}</div>` : ''}
          <div class="reward-list">
            <span class="reward">${I.coin} +${res.coins + res.bonusCoins} coins</span>
            <span class="reward" style="animation-delay:.1s">${I.bolt} +${res.xp + res.bonusXp} XP</span>
            ${run.bestStreak >= 3 ? `<span class="reward" style="animation-delay:.2s">${I.flame} Best streak ${run.bestStreak}</span>` : ''}
            ${res.newBadge ? `<span class="reward" style="animation-delay:.3s;background:var(--gold-2)">${I.trophy} ${esc(d.name)} Badge</span>` : ''}
          </div>
          ${res.newBadge ? `<div class="badge-item" style="margin:6px 0 10px">${deckBadge(d, 120)}</div>` : ''}
          ${res.mode === 'catch' ? `<div class="eyebrow" style="margin-top:10px">Your team</div><div class="evolved-list">${res.caught.map(w => `<div class="evolved">${creatureHTML(w, { stage:Math.max(1, stageFor(Deck.rec(w.deck, w.key))) }, 'pop')}<div>${esc(w.name)}</div><span class="small muted">${esc(w.word)}</span></div>`).join('')}</div>` : ''}
          ${res.evolved.length ? `<div class="eyebrow" style="margin-top:10px">Creatures that grew</div><div class="evolved-list">${res.evolved.map(e => `<div class="evolved">${creatureHTML(e.w, { stage:e.to }, 'pop')}<div>${esc(e.w.name)}</div><span class="tag">${STAGE_NAMES[e.to]}</span></div>`).join('')}</div>` : ''}
          ${missed.length ? `<div class="eyebrow" style="margin-top:14px">Words to review</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px">${missed.map(w => `<span class="pill" style="background:var(--bad-bg)" title="${esc(w.def)}">${esc(w.word)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="btn-row center" style="margin-top:18px">
          ${res.mode === 'boss' && !won ? `<button class="btn coral" data-action="openStop" data-id="boss">Try again</button>` : ''}
          ${res.mode === 'champion' && !won ? `<button class="btn coral" data-action="openStop" data-id="champion">Try again</button>` : ''}
          ${res.mode === 'train' ? `<button class="btn" data-action="openStop" data-id="train">Train again</button>` : ''}
          ${res.mode === 'dojo' ? `<button class="btn" data-action="openStop" data-id="dojo">Spell again</button>` : ''}
          ${res.mode === 'catch' ? `<button class="btn" data-action="openStop" data-id="catch">Hunt again</button>` : ''}
          ${res.mode === 'grounds' ? `<button class="btn" data-action="startGrounds">Practice again</button>` : ''}
          ${missed.length >= 4 && res.mode !== 'grounds' ? `<button class="btn mint" data-action="trainTricky">Train the tricky words</button>` : ''}
          <button class="btn ${(isBattle || res.mode === 'catch') && won ? '' : 'white'}" data-action="backFromResult">Continue</button>
        </div>
      </div>`;
    show('result');
    session = null; hunt = null; lastMissed = missed;
    if(won && (isBattle || res.mode === 'catch')){ Sound.play('win'); confetti(res.mode === 'champion' ? 140 : 80); }
    else if(isBattle){ Sound.play('lose'); }
    else { Sound.play(res.stars >= 2 ? 'win' : 'coin'); if(res.stars === 3) confetti(50); }
    if(res.evolved.length) setTimeout(() => Sound.play('evolve'), 600);
    if(res.levelUp){ pendingLevel = res.level; clearTimeout(levelUpTimer); levelUpTimer = setTimeout(() => { if(pendingLevel){ pendingLevel = 0; levelUp(res.level); } }, 700); }
  }

  function saveDeck(){

    if(bad.length){ err.textContent = 'Check line ' + bad.join(', line ') + '. Each line needs a word, an equals sign, then the meaning.'; return; }
    if(words.length < 4){ err.textContent = 'Add at least four words so a question has enough choices.'; return; }
    if(editingDeck) Deck.updateCustom(editingDeck, name, words); else Deck.addCustom(name, words);

        <div style="font-family:var(--font-head);font-size:40px;font-weight:700;border-bottom:3px solid #1b1a22;display:inline-block;padding:0 30px 4px">${esc(state.name)}</div>
        <p style="font-size:16px;margin:14px auto;max-width:560px">caught every creature, defeated the Guardian, and won the Champion Arena for <b>${esc(d.name)}</b> with the help of ${esc(partnerName())}.</p>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:10px 0">${Deck.words(d.id).map(w => `<span style="width:64px;height:64px;display:inline-block">${artOf(w, { stage:Math.max(2, stageFor(Deck.rec(d.id, w.key))) })}</span>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;gap:30px;margin-top:24px;font-size:14px">
          <div style="flex:1;border-top:2px solid #1b1a22;padding-top:6px">Professor Quill, Mentor</div>
          <div style="flex:1;border-top:2px solid #1b1a22;padding-top:6px">Witness</div>
          <div style="flex:1;border-top:2px solid #1b1a22;padding-top:6px">${date}</div>
        </div>
      </div></div>`;
    setTimeout(() => window.print(), 100);
  }

  /* ---------- effects ---------- */
  function sfx(text, cls = '', container){
    const host = container || $('#app'); if(!host) return;
    const el = document.createElement('div'); el.className = 'sfx ' + cls; el.textContent = text;
    if(getComputedStyle(host).position === 'static') host.style.position = 'relative';
    host.appendChild(el); setTimeout(() => el.remove(), 1000);
  }
  function floatNum(host, html, cls = ''){
    if(!host) return; if(getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const el = document.createElement('div'); el.className = 'float-num ' + cls; el.innerHTML = html; el.style.left = (30 + rnd(40)) + '%'; el.style.top = '20%';
    host.appendChild(el); setTimeout(() => el.remove(), 1100);
  }
  function burst(host){
    if(!host) return; if(getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const el = document.createElement('div'); el.className = 'burst go';
    el.innerHTML = `<svg viewBox="0 0 200 200" width="100%" height="100%">${Array.from({ length:14 }, (_, i) => `<path d="M100,100 L100,6" stroke="${i % 2 ? '#ffc83d' : INK}" stroke-width="${i % 2 ? 5 : 3}" stroke-linecap="round" transform="rotate(${i * (360 / 14)} 100 100)"/>`).join('')}</svg>`;
    host.appendChild(el); setTimeout(() => el.remove(), 700);
  }
  function flashScreen(){ const el = document.createElement('div'); el.className = 'flash-screen'; document.body.appendChild(el); setTimeout(() => el.remove(), 400); }
  function confetti(n = 60){
    const root = document.createElement('div'); root.className = 'confetti';
    const colors = ['#ffc83d', '#ff6b81', '#7fdccc', '#4aa3ff', '#8b5cf6', '#24a96c', '#fff'];
    for(let i = 0; i < n; i++){ const p = document.createElement('i'); p.style.left = rnd(100) + '%'; p.style.background = colors[rnd(colors.length)]; p.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; p.style.animationDelay = (Math.random() * .8) + 's'; p.style.width = (8 + rnd(8)) + 'px'; p.style.height = (12 + rnd(10)) + 'px'; root.appendChild(p); }
    document.body.appendChild(root); setTimeout(() => root.remove(), 4200);
  }
  let toastTimer = null;
  function toast(msg){ let t = $('.toast'); if(t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800); }
  function modal(html){ $('#overlay-root').innerHTML = `<div class="modal-root" data-action="modalBackdrop"><div class="modal">${html}</div></div>`; }
  function closeModal(){ const m = $('#overlay-root .modal-root'); if(m) m.remove(); }
  function levelUp(level){
    Sound.play('levelup'); confetti(60);
    const div = document.createElement('div'); div.className = 'levelup'; div.dataset.action = 'closeLevelUp';
    div.innerHTML = `<div class="rays"></div><div class="box"><span class="big-sfx">LEVEL UP!</span>${partnerObj() ? creatureHTML(partnerObj(), partnerOpts(), 'hop') : ''}<h2 style="font-size:1.6rem">Level ${level}: ${Progress.title()}</h2><p class="muted" style="margin:6px 0 16px;font-weight:600">Keep going, Tamer!</p><button class="btn" data-action="closeLevelUp">Awesome</button></div>`;
    $('#overlay-root').appendChild(div);
  }

  /* ---------- actions ---------- */
  const actions = {
    title(){ renderTitle(); },
    begin(){ setupName = ''; setupPick = null; renderSetup(1); },
    continue(){ Sound.play('click'); renderTrail(); },
    newGame(){ modal(`<h2>Start over?</h2><p style="margin:10px 0 18px;font-weight:600">This erases ${esc(state.name)}'s creatures, badges, and coins. Saved word lists are kept. This cannot be undone.</p><div class="btn-row"><button class="btn coral" data-action="confirmNew">Yes, start over</button><button class="btn white" data-action="closeModal">Keep my adventure</button></div>`); },
    confirmNew(){ const keep = Object.values(state.decks).filter(d => d.custom).map(d => [d.id, d.name, d.words]); Store.reset(); keep.forEach(([id, name, words]) => { state.decks[id] = newDeck(id, name, words, true); }); Store.save(); closeModal(); actions.begin(); },
    setupName(){ const v = ($('#nameInput').value || '').trim(); if(!v){ $('#nameInput').focus(); toast('Please type a name first'); return; } setupName = v; Sound.play('click'); renderSetup(2); },
    pickStarter(d){ setupPick = d.id; Sound.play('click'); renderSetup(2); },
    finishSetup(){ if(!setupPick) return; const deckId = state.currentDeck; const keep = state.decks; const fresh = defaultState(); fresh.decks = keep; fresh.currentDeck = deckId; fresh.name = setupName; fresh.partner = { deck:deckId, key:setupPick }; state = fresh; Deck.rec(deckId, setupPick).seen = true; Store.save(); Sound.play('hatch'); confetti(50); renderTrail(); toast(`Welcome, ${setupName}! ${partnerName()} joined you.`); },
    nav(d){ Sound.play('click'); const id = d.id; if(current === 'quiz' && session && !session.done){ pendingNav = id; quitSession(); return; } if(current === 'hunt' && hunt && !hunt.done){ pendingNav = id; quitHunt(); return; }
      if(id === 'trail') renderTrail(); else if(id === 'album') renderAlbum(); else if(id === 'badges') renderBadges(); else if(id === 'shop') renderShop(); else if(id === 'decks') renderDecks(); else if(id === 'parent') renderParent(); },
    toggleSound(){ state.sound = !state.sound; Store.save(); if(state.sound) Sound.play('click'); if(current === 'parent') renderParent(); else renderHud(); },
    openStop(d){ Sound.play('click'); closeModal(); openStop(d.id); },
    lockedStop(d){ const msgs = { catch:'Meet the creatures first', train:'Meet the creatures first', boss:'Score 70% in Training to unlock the Guardian', dojo:'Meet the creatures first', champion:'Defeat the Guardian first' }; toast(msgs[d.id] || 'Locked'); },
    lockedQuick(){ toast('Meet at least four creatures first'); },
    reveal(){ reveal(); },
    learnNext(){ Sound.play('click'); learnNext(); },
    learnPrev(){ Sound.play('click'); learnPrev(); },
    learnFinish(){ Sound.play('click'); learnFinish(); },
    say(d){ Speech.say(d.text); },
    chooseWild(d){ chooseWild(+d.i); },
    nextWild(){ Sound.play('click'); continueWild(); },
    quitHunt(){ quitHunt(); },
    confirmQuitHunt(){ hunt = null; closeModal(); if(pendingNav){ const id = pendingNav; pendingNav = null; actions.nav({ id }); } else renderTrail(); },
    startGrounds(){ const d = Deck.current(); const pool = Progress.seenWords(d.id); if(pool.length < 4){ toast('Meet at least four creatures first'); return; } closeModal(); startSession({ mode:'grounds', pool }); },
    trainTricky(){ const pool = lastMissed.slice(); if(pool.length < 4){ toast('Not enough tricky words yet'); return; } startSession({ mode:'grounds', pool }); },
    choose(d){ choose(+d.i); },
    place(d){ placeTile(+d.i); },
    unplace(d){ unplace(+d.i); },
    clearTiles(){ clearTiles(); },
    checkSpell(){ checkSpell(); },
    hintSpell(){ hintSpell(); },
    nextQ(){ Sound.play('click'); nextQ(); },
    quitSession(){ quitSession(); },
    confirmQuit(){ advanceToken++; session = null; closeModal(); if(pendingNav){ const id = pendingNav; pendingNav = null; actions.nav({ id }); } else renderTrail(); },
    backFromResult(){ if(pendingLevel){ const L = pendingLevel; pendingLevel = 0; clearTimeout(levelUpTimer); levelUp(L); return; } Sound.play('click'); renderTrail(); },
    albumFilter(d){ albumFilter = d.id; renderAlbum(); },
    openCard(d){ Sound.play('click'); openCard(d.deck, d.id); },
    setPartner(d){ state.partner = { deck:d.deck, key:d.id }; Store.save(); Sound.play('coin'); closeModal(); toast(`${partnerName()} is now your partner!`); renderHud(); if(current === 'album') renderAlbum(); },
    printOne(d){ const w = Deck.find(d.deck, d.id); if(w) printPages([w]); },
    printAll(){ printPages(Deck.words()); },
    printList(){ printList(); },
    printCert(){ printCert(); },
    buy(d){ const it = ITEM_BY_ID[d.id]; if(state.coins < it.price){ toast('Not enough coins yet. Keep practicing!'); return; } state.coins -= it.price; state.items.owned.push(it.id); actions.equip(d, true); Sound.play('buy'); confetti(30); toast(`You bought the ${it.name}!`); },
    equip(d, silent){ const it = ITEM_BY_ID[d.id]; state.items.equipped = state.items.equipped.filter(id => ITEM_BY_ID[id].slot !== it.slot); state.items.equipped.push(it.id); Store.save(); if(!silent) Sound.play('click'); renderShop(); },
    unequip(d){ state.items.equipped = state.items.equipped.filter(id => id !== d.id); Store.save(); Sound.play('click'); renderShop(); },
    newDeck(){ Sound.play('click'); renderEditor(null, null); },
    editDeck(d){ Sound.play('click'); renderEditor(Deck.get(d.id), null); },
    copyDeck(d){ Sound.play('click'); renderEditor(null, Deck.get(d.id)); },
    saveDeck(){ saveDeck(); },
    useDeck(d){ Deck.setCurrent(d.id); Sound.play('coin'); toast(`Now playing: ${Deck.current().name}`); renderTrail(); },
    deleteDeckAsk(d){ const dk = Deck.get(d.id); modal(`<h2>Delete this list?</h2><p style="margin:10px 0 18px;font-weight:600">"${esc(dk.name)}" and its creatures will be removed. This cannot be undone.</p><div class="btn-row"><button class="btn coral" data-action="deleteDeck" data-id="${d.id}">Delete</button><button class="btn white" data-action="closeModal">Keep it</button></div>`); },
    deleteDeck(d){ Deck.remove(d.id); closeModal(); toast('List deleted'); renderDecks(); },
    resetAsk(){ modal(`<h2>Reset all progress?</h2><p style="margin:10px 0 18px;font-weight:600">This erases every creature, badge, and coin. Saved word lists are kept. This cannot be undone.</p><div class="btn-row"><button class="btn coral" data-action="confirmReset">Yes, reset everything</button><button class="btn white" data-action="closeModal">Cancel</button></div>`); },
    confirmReset(){ actions.confirmNew(); closeModal(); renderTitle(); toast('Progress has been reset'); },
    closeModal(){ pendingNav = null; closeModal(); },
    modalBackdrop(d, e){ if(e && e.target && e.target.classList.contains('modal-root')) closeModal(); },
    closeLevelUp(){ const l = $('.levelup'); if(l) l.remove(); },
  };

  function init(){
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-action]'); if(!t) return;
      const name = t.dataset.action; if(!name || !actions[name]) return;
      if(t.classList.contains('disabled') || t.disabled) return;
      actions[name](t.dataset, e);
    });
    document.addEventListener('keydown', e => {
      if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const q = current === 'quiz' && session ? session.current : current === 'hunt' && hunt ? hunt.current : null;
      if((current === 'quiz' || current === 'hunt') && q && !q.locked && /^[1-4]$/.test(e.key)){ const btns = $$('#choices .choice'); const i = +e.key - 1; if(btns[i]) btns[i].click(); }
      else if((current === 'quiz' || current === 'hunt') && (e.key === 'Enter' || e.key === ' ')){ const b = $('#nextBtn'); if(b){ e.preventDefault(); b.click(); } }
      else if(e.key === 'Escape'){ closeModal(); actions.closeLevelUp(); }
      else if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('node')){ e.preventDefault(); e.target.click(); }
    });
    Store.load();
    renderTitle();
  }

  return { init, actions, show, renderTrail, __session:() => session, __hunt:() => hunt };
})();

document.addEventListener('DOMContentLoaded', UI.init);

</script>
</body>
</html>
