/* ============================================================
   WORD TAMERS - styles  (ink & paper manga look)
   ============================================================ */
:root{
  --ink:#1b1a22; --paper:#f6f1e7; --paper-2:#e9e0cf; --white:#fff;
  --gold:#ffc83d; --gold-2:#ffe066; --coral:#ff6b81; --mint:#7fdccc; --sky:#4aa3ff;
  --civic:#2f5fe0; --market:#f0a12c; --geo:#24a96c; --mind:#7c4ddc; --champ:#e8435e;
  --muted:#6b6877; --ok:#24a96c; --ok-bg:#dcf5e8; --bad:#e8435e; --bad-bg:#ffe1e7;
  --r:20px; --r-sm:14px; --sh:6px 6px 0 var(--ink); --sh-sm:4px 4px 0 var(--ink);
  --font-head:'Fredoka','Nunito',system-ui,-apple-system,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  --font-sfx:'Bangers','Fredoka',Impact,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.45;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(27,26,34,.09) 1.3px,transparent 1.5px);
  background-size:16px 16px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.15;margin:0}
p{margin:0}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:inline-block;vertical-align:middle}

#app{max-width:1060px;margin:0 auto;padding:12px 14px 40px;position:relative}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--white);border:3px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh);padding:8px 12px;margin-bottom:18px;position:relative;z-index:5;
}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.hud-avatar{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--gold-2);overflow:hidden;flex:0 0 auto;display:grid;place-items:center}
.hud-avatar svg{width:66px;height:66px;margin-top:10px}
.hud-name{font-family:var(--font-head);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.xp{height:10px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-top:4px;width:150px;max-width:100%}
.xp > i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hud-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2.5px solid var(--ink);border-radius:999px;
  background:var(--white);font-family:var(--font-head);font-weight:700;font-size:.95rem;line-height:1;white-space:nowrap;
}
.pill svg{width:1.15em;height:1.15em}
.pill.coins{background:var(--gold-2)}
.pill.region{color:#fff}
.icon-btn{
  width:42px;height:42px;border:2.5px solid var(--ink);border-radius:12px;background:var(--white);display:inline-grid;place-items:center;vertical-align:middle;
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tab{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--white);
  font-family:var(--font-head);font-weight:700;font-size:.95rem;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;
}
.tab svg{width:20px;height:20px}
.tab.active{background:var(--gold)}
.tab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (max-width:640px){
  .tab span{display:none}
  .tab{padding:8px 10px}
  .hud{padding:8px 10px;gap:8px}
  .xp{width:110px}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-head);font-weight:700;font-size:1.05rem;line-height:1.1;
  padding:13px 24px;border:3px solid var(--ink);border-radius:16px;background:var(--gold);
  box-shadow:var(--sh-sm);transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;
  user-select:none;-webkit-user-select:none;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.choice:focus-visible{outline:3px dashed var(--sky);outline-offset:3px}
.btn.big{font-size:1.3rem;padding:16px 34px;border-radius:20px;box-shadow:var(--sh)}
.btn.big:active{box-shadow:2px 2px 0 var(--ink)}
.btn.white{background:var(--white)}
.btn.mint{background:var(--mint)}
.btn.coral{background:var(--coral)}
.btn.sky{background:var(--sky);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;padding:8px 12px}
.btn.ghost:active{transform:none}
.btn[disabled],.btn.disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.btn[disabled]:active{transform:none;box-shadow:var(--sh-sm)}
.btn svg{width:1.2em;height:1.2em}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn-row.center{justify-content:center}

/* ---------- Panels ---------- */
.panel{
  background:var(--white);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:20px;position:relative;
}
.panel.tight{padding:14px}
.panel-head{
  display:flex;align-items:center;gap:12px;margin:-20px -20px 16px;padding:14px 20px;border-bottom:3px solid var(--ink);
  border-radius:17px 17px 0 0;background:var(--paper);position:relative;overflow:hidden;
}
.panel-head::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(27,26,34,.12) 1.2px,transparent 1.4px);background-size:10px 10px;opacity:.6;pointer-events:none}
.panel-head > *{position:relative;z-index:1}
.panel-head h2{font-size:1.4rem}
.panel-head.region{color:#fff}
.panel-head.region::after{background-image:radial-gradient(rgba(0,0,0,.18) 1.2px,transparent 1.4px)}
.eyebrow{font-family:var(--font-head);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:var(--muted)}
.marker{background:linear-gradient(transparent 58%,var(--gold-2) 58%,var(--gold-2) 92%,transparent 92%);padding:0 .15em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- Screens ---------- */
.screen{display:none}
.screen.active{display:block;animation:screenIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.screen-top h2{font-size:1.6rem;min-width:0;overflow-wrap:anywhere}
.screen-top .pill{flex:0 0 auto}
.screen-top .spacer{flex:1}

/* ---------- Speech bubble / mentor ---------- */
.mentor{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.mentor .mentor-art{flex:0 0 auto;width:96px;height:96px}
.mentor .mentor-art svg{width:100%;height:100%}
.bubble{
  position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;box-shadow:var(--sh-sm);
  font-weight:600;font-size:1rem;flex:1;animation:bubbleIn .35s cubic-bezier(.2,.9,.3,1.3) both;
}
.bubble::before{content:'';position:absolute;left:-14px;bottom:18px;width:18px;height:18px;background:var(--white);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble .who{display:block;font-family:var(--font-head);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mind);margin-bottom:2px}
@keyframes bubbleIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){.mentor .mentor-art{width:70px;height:70px}.bubble{font-size:.92rem}}

/* ---------- Creature display ---------- */
.creature{position:relative;display:inline-block;line-height:0}
.creature svg{width:100%;height:100%;position:relative;z-index:1}
.creature .shadow{position:absolute;left:50%;bottom:6%;width:56%;height:9%;transform:translateX(-50%);background:rgba(27,26,34,.16);border-radius:50%;z-index:0}
.creature.bob svg{animation:bob 2.8s ease-in-out infinite}
.creature.bob .shadow{animation:shadowBob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shadowBob{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.88)}}
.creature.hop svg{animation:hop .6s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-26px) scale(.94,1.08)}55%{transform:translateY(0) scale(1.06,.92)}75%{transform:translateY(-8px) scale(1)}100%{transform:translateY(0)}}
.creature.shake svg{animation:shake .5s ease-in-out 1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.creature.lunge svg{animation:lunge .55s cubic-bezier(.3,1.2,.4,1) 1}
@keyframes lunge{0%{transform:translateX(0)}35%{transform:translateX(46px) scale(1.05)}100%{transform:translateX(0)}}
.creature.lungeL svg{animation:lungeL .55s cubic-bezier(.3,1.2,.4,1) 1}
@keyframes lungeL{0%{transform:translateX(0)}35%{transform:translateX(-46px) scale(1.05)}100%{transform:translateX(0)}}
.creature.hit svg{animation:hitFlash .5s ease-out 1}
@keyframes hitFlash{0%{filter:brightness(3) saturate(0);transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{filter:brightness(1)}100%{transform:translateX(0)}}
.creature.silhouette svg{filter:brightness(0) opacity(.35)}
.creature.pop svg{animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.aura{transform-origin:100px 120px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* speed-line burst */
.burst{position:absolute;inset:-20%;z-index:0;pointer-events:none;opacity:0}
.burst.go{animation:burst .55s ease-out 1}
@keyframes burst{0%{opacity:0;transform:scale(.6)}20%{opacity:1}100%{opacity:0;transform:scale(1.15)}}

/* ---------- SFX text ---------- */
.sfx{
  position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-6deg);z-index:30;pointer-events:none;
  font-family:var(--font-sfx);font-size:3.2rem;letter-spacing:.04em;color:var(--gold);
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);
  animation:sfxPop .9s cubic-bezier(.2,1.2,.3,1) both;white-space:nowrap;
}
.sfx.bad{color:var(--coral)}
.sfx.blue{color:var(--sky)}
.sfx.mint{color:var(--mint)}
@keyframes sfxPop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.15)}45%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-6deg) scale(1)}}
.float-num{position:absolute;z-index:31;pointer-events:none;font-family:var(--font-head);font-weight:700;font-size:1.3rem;color:var(--ok);text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff;animation:floatUp 1s ease-out both}
.float-num.dmg{color:var(--bad);font-family:var(--font-sfx);font-size:2rem;letter-spacing:.05em}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

/* ---------- Title screen ---------- */
.title-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;min-height:62vh}
.parade{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:8px;padding:6px 0}
.parade .creature{width:84px;height:84px}
.parade .creature svg{animation-delay:inherit}
@media (max-width:640px){.parade .creature{width:60px;height:60px}}
@media (max-width:760px){.title-wrap{grid-template-columns:1fr;min-height:0}}
.logo{font-family:var(--font-sfx);font-size:clamp(3.8rem,10vw,7rem);line-height:.95;letter-spacing:.03em;color:var(--gold);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);transform:rotate(-3deg);display:inline-block}
.logo span{display:block;color:var(--coral);font-size:.78em;padding-left:.9em}
.subtitle{font-family:var(--font-head);font-weight:600;font-size:1.2rem;margin:14px 0 22px;color:var(--muted)}
.title-stage{position:relative;text-align:center}
.title-stage .creature{width:min(360px,80vw);height:min(360px,80vw)}
.title-stage .ring{position:absolute;left:50%;top:50%;width:92%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--gold-2) 0%,rgba(255,224,102,.5) 45%,transparent 70%);z-index:0}
.title-stage .rays{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:0;opacity:.35;
  background:repeating-conic-gradient(var(--ink) 0 4deg,transparent 4deg 14deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%);animation:spin 60s linear infinite}
.title-buttons{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.title-buttons .btn{min-width:240px}
.version{font-size:.75rem;color:var(--muted);margin-top:24px}

/* ---------- Setup ---------- */
.name-input{
  width:100%;max-width:420px;font-family:var(--font-head);font-weight:700;font-size:1.4rem;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;
  box-shadow:inset 3px 3px 0 rgba(27,26,34,.08);background:#fff;
}
.name-input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(74,163,255,.25)}
.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:640px){.starter-grid{grid-template-columns:1fr}}
.starter{
  background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;text-align:center;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.starter:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.starter.selected{background:var(--gold-2);transform:translateY(-4px);box-shadow:var(--sh)}
.starter .creature{width:150px;height:150px}
.starter h3{font-size:1.3rem;margin-top:4px}

/* ---------- Map ---------- */
.map-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
@media (max-width:860px){.map-layout{grid-template-columns:1fr}}
.map-panel{padding:10px}
.worldmap{width:100%;height:auto;display:block;border-radius:14px;border:3px solid var(--ink);background:#cfe9f5}
.worldmap .node{cursor:pointer}
.worldmap .node.locked{cursor:not-allowed}
.worldmap .node .ring{transition:transform .2s}
.worldmap .node:hover .ring{transform:scale(1.08)}
.worldmap text{font-family:var(--font-head);font-weight:700}
.map-side{display:flex;flex-direction:column;gap:16px}
.tamer-card{padding:14px;overflow:hidden}
.tamer-card .creature{width:170px;height:170px;margin:0 auto;display:block}
.tamer-card .tc-name{font-family:var(--font-head);font-weight:700;font-size:1.35rem;text-align:center}
.tamer-card .tc-title{text-align:center;color:var(--muted);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.stat-row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-weight:700;font-size:.95rem}
.badge-strip{display:flex;gap:4px;justify-content:center;margin-top:10px}
.badge-strip svg{width:40px;height:40px}
.quick-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.quick-modes{grid-template-columns:1fr}}
.mode-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh-sm);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.mode-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mode-card .ic{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--gold-2);flex:0 0 auto}
.mode-card .ic svg{width:26px;height:26px}
.mode-card h4{font-size:1.05rem}
.mode-card p{font-size:.85rem;color:var(--muted);font-weight:600}
.mode-card.locked{opacity:.55;cursor:not-allowed}

/* region list (small screens) */
.region-list{display:none;flex-direction:column;gap:10px;margin-top:12px}
.region-list .rl{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh-sm);text-align:left}
.region-list .rl .em{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;flex:0 0 auto}
.region-list .rl .em svg{width:30px;height:30px}
.region-list .rl h4{font-size:1.05rem}
.region-list .rl .stars svg{width:18px;height:18px}
.region-list .rl.locked{opacity:.55}
@media (max-width:640px){.region-list{display:flex}}

/* ---------- Region hub ---------- */
.stage-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.stage-cards{grid-template-columns:1fr}}
.stage-card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.stage-card .num{position:absolute;top:-14px;left:14px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);font-family:var(--font-head);font-weight:700;display:grid;place-items:center;font-size:1.05rem}
.stage-card h3{font-size:1.25rem;margin-top:6px}
.stage-card p{font-size:.92rem;color:var(--muted);font-weight:600;flex:1}
.stage-card .stars{display:flex;gap:2px}
.stage-card .stars svg{width:24px;height:24px}
.stage-card.locked{opacity:.6}
.stage-card.locked .btn{pointer-events:none}
.creature-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.mini{width:92px;text-align:center;font-size:.8rem;font-weight:700}
.mini .creature{width:80px;height:80px}
.mini .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .wd{display:block;color:var(--muted);font-weight:600;font-size:.72rem}

/* ---------- Flashcards ---------- */
.learn-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:center}
@media (max-width:760px){.learn-layout{grid-template-columns:1fr}}
.learn-art{text-align:center}
.learn-art .creature{width:min(280px,70vw);height:min(280px,70vw)}
.flash{min-height:260px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.flash .word{font-family:var(--font-head);font-weight:700;font-size:clamp(1.8rem,4.5vw,2.6rem);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flash .word .icon-btn{width:40px;height:40px}
.flash .def{font-size:1.15rem;font-weight:600;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:14px 16px}
.flash .def.hiddenDef{color:transparent;user-select:none;text-shadow:0 0 14px rgba(27,26,34,.45);cursor:pointer}
.flash .example{font-size:.98rem;color:var(--muted);font-weight:600;font-style:italic}
.flash .clue{font-size:.95rem;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.flash .clue b{color:var(--mind)}
.progress-dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.progress-dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.progress-dots i.done{background:var(--ok)}
.progress-dots i.cur{background:var(--gold)}

/* ---------- Quiz / battle ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qbar{flex:1;height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;min-width:120px}
.qbar > i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:2px}
.hearts svg{width:28px;height:28px;transition:transform .3s}
.hearts svg.lost{animation:heartPop .5s ease-out both}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-10deg)}100%{transform:scale(1)}}
.streak{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-head);font-weight:700;color:#c2410c;animation:popIn .4s both}
.streak svg{width:22px;height:22px}

.arena{
  position:relative;border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;padding:14px 16px 4px;
  background:linear-gradient(180deg,#dff1ff 0%,#f4fbff 60%,#e3f3e1 60%,#d2ebcf 100%);margin-bottom:14px;min-height:210px;
}
.arena.mind{background:linear-gradient(180deg,#eadfff 0%,#f7f2ff 60%,#d8d0ee 60%,#c9bfe6 100%)}
.arena.civic{background:linear-gradient(180deg,#dbe6ff 0%,#f3f6ff 60%,#d5dcf0 60%,#c3cde8 100%)}
.arena.market{background:linear-gradient(180deg,#fff0d0 0%,#fff9ec 60%,#dcefc5 60%,#c9e3a6 100%)}
.arena.geo{background:linear-gradient(180deg,#d9f5ff 0%,#f0fbff 60%,#cdeccb 60%,#b6e0b1 100%)}
.arena.champion{background:linear-gradient(180deg,#ffd8df 0%,#fff0f2 60%,#e9d2d8 60%,#d8bcc4 100%)}
.arena::before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(rgba(27,26,34,.06) 0 3deg,transparent 3deg 12deg);opacity:.9;pointer-events:none}
.arena-inner{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.fighter{position:relative;text-align:center;flex:1}
.fighter .creature{width:min(200px,38vw);height:min(200px,38vw)}
.fighter.boss .creature{width:min(230px,42vw);height:min(230px,42vw)}
.fighter .plate{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:3px 3px 0 var(--ink);margin-bottom:4px;text-align:left;min-width:150px;max-width:100%}
@media (max-width:560px){.fighter .plate{min-width:0;padding:5px 8px}.fighter .plate b{font-size:.85rem}.fighter .plate .small{font-size:.72rem}}
.fighter .plate b{font-family:var(--font-head);font-size:.95rem;display:block}
.hpbar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin-top:4px}
.hpbar > i{display:block;height:100%;background:var(--ok);width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hpbar > i.low{background:var(--coral)}
.vs{font-family:var(--font-sfx);font-size:2.6rem;color:var(--coral);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);align-self:center;transform:rotate(-8deg)}
@media (max-width:560px){.vs{font-size:1.8rem}}

.question{margin-bottom:14px}
.question .prompt{font-family:var(--font-head);font-weight:600;font-size:1.05rem;color:var(--muted);margin-bottom:8px}
.question .big{font-family:var(--font-head);font-weight:700;font-size:clamp(1.5rem,4vw,2.2rem)}
.question .quote{font-size:1.15rem;font-weight:700;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:14px 16px;line-height:1.45}
.question .quote .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);margin:0 4px;text-align:center;color:var(--mind)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.stack{grid-template-columns:1fr}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{
  display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;
  box-shadow:var(--sh-sm);font-weight:700;font-size:1.05rem;transition:transform .1s,box-shadow .1s,background .2s;min-height:58px;
}
.choice .key{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--font-head);font-size:.95rem;flex:0 0 auto}
.choice:hover{transform:translateY(-2px)}
.choice:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.choice.correct{background:var(--ok-bg);border-color:var(--ok);animation:pulseOk .5s ease-out}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shakeSmall .4s ease-out}
.choice.dim{opacity:.45}
.choices.locked .choice{pointer-events:none}
@keyframes pulseOk{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shakeSmall{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* word builder */
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:12px;border:2.5px dashed var(--ink);border-radius:14px;background:var(--paper);margin-bottom:12px}
.slot{min-width:54px;height:52px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.3rem;padding:0 10px;box-shadow:3px 3px 0 var(--ink)}
.slot.empty{background:transparent;border-style:dotted;box-shadow:none;color:transparent}
.slot.filled{cursor:pointer;background:var(--gold-2);animation:popIn .25s both}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:58px;height:56px;padding:0 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--font-head);font-weight:700;font-size:1.35rem;box-shadow:var(--sh-sm);transition:transform .1s,box-shadow .1s,opacity .2s}
.tile:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.tile.used{opacity:.25;pointer-events:none;transform:scale(.9)}
.spell-input{
  width:100%;font-family:var(--font-head);font-weight:700;font-size:1.6rem;padding:14px 18px;border:3px solid var(--ink);border-radius:16px;text-align:center;
  letter-spacing:.04em;box-shadow:inset 3px 3px 0 rgba(27,26,34,.08);background:#fff;
}
.spell-input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(74,163,255,.25)}
.spell-input.ok{background:var(--ok-bg);border-color:var(--ok)}
.spell-input.bad{background:var(--bad-bg);border-color:var(--bad);animation:shakeSmall .4s}
.letter-hint{font-family:var(--font-head);font-weight:700;font-size:1.5rem;letter-spacing:.25em;text-align:center;margin:8px 0;color:var(--mind)}

.feedback{
  margin-top:14px;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;background:#fff;box-shadow:var(--sh-sm);
  display:flex;gap:12px;align-items:flex-start;animation:bubbleIn .3s both;
}
.feedback.good{background:var(--ok-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .fb-text{flex:1;font-weight:600}
.feedback .fb-text b{font-family:var(--font-head);font-size:1.1rem;display:block;margin-bottom:2px}

/* ---------- Hunt ---------- */
.team-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:-4px 0 14px}
.slotc{width:52px;height:52px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);overflow:hidden;animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both}
.slotc svg{width:56px;height:56px;margin-top:8px}
.slotc.empty{background:var(--paper);border-style:dashed;box-shadow:none;animation:none}
.hitdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:inline-block}
.hitdot.on{background:var(--coral)}
.drill-bar{display:flex;align-items:center;gap:10px;background:var(--gold-2);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:700}
.drill-bar svg{width:22px;height:22px}
.drill-bar .pips{display:inline-flex;gap:4px;margin-left:auto}
.drill-bar .pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.drill-bar .pips i.done{background:var(--ok)}
.creature.vanish svg{animation:vanish .5s ease-in both}
@keyframes vanish{to{transform:scale(.2) translateY(-40px);opacity:0}}

/* ---------- Word lists ---------- */
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.deck-card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.deck-card.current{background:var(--paper)}
.deck-head{display:flex;gap:12px;align-items:center}
.deck-head h3{font-size:1.15rem;overflow-wrap:anywhere}
.deck-head svg{flex:0 0 auto}
.deck-preview{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.deck-preview span{width:46px;height:46px;display:inline-block}
.deck-preview span svg{width:100%;height:100%}
.deck-preview .more{font-family:var(--font-head);font-weight:700;color:var(--muted);width:auto;padding-left:6px}
.deck-text{width:100%;min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;line-height:1.6;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;resize:vertical}
.deck-text:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(74,163,255,.25)}

/* ---------- Results ---------- */
.result-hero{text-align:center;padding:10px 0}
.result-hero .creature{width:220px;height:220px}
.result-stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.result-stars svg{width:58px;height:58px;animation:starIn .6s cubic-bezier(.2,1.4,.4,1) both}
.result-stars svg:nth-child(2){animation-delay:.2s}
.result-stars svg:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1);opacity:1}}
.reward-list{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.reward{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;background:#fff;font-family:var(--font-head);font-weight:700;box-shadow:3px 3px 0 var(--ink);animation:popIn .4s both}
.reward svg{width:22px;height:22px}
.evolved-list{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:10px 0}
.evolved{width:150px;text-align:center;font-weight:700;font-size:.9rem}
.evolved .creature{width:120px;height:120px}
.evolved .tag{display:inline-block;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-family:var(--font-head);font-size:.8rem}

/* ---------- Album ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-family:var(--font-head);font-weight:700;font-size:.9rem;box-shadow:2px 2px 0 var(--ink)}
.chip.active{background:var(--ink);color:#fff}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{
  background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;text-align:left;padding:0;
  transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.card .card-top{padding:8px 10px 0;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-head);font-weight:700;font-size:.8rem}
.card .card-art{padding:0 10px;text-align:center}
.card .card-art .creature{width:120px;height:120px}
.card .card-name{padding:4px 10px 10px;font-family:var(--font-head);font-weight:700;font-size:1rem;display:flex;flex-direction:column}
.card .card-name small{font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.type-pill{display:inline-block;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);font-size:.72rem;font-family:var(--font-head);font-weight:700;color:#fff;line-height:1.4}
.mastery{display:flex;gap:3px;padding:0 10px 10px}
.mastery i{flex:1;height:7px;border:1.5px solid var(--ink);border-radius:4px;background:#fff}
.mastery i.on{background:var(--ok)}
.card.unknown .card-art .creature svg{filter:brightness(0) opacity(.25)}

/* ---------- Modal ---------- */
.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(27,26,34,.55);animation:fadeIn .2s both;overflow:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:640px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:22px;position:relative;animation:popIn .35s cubic-bezier(.2,1.3,.4,1) both;max-height:calc(100vh - 32px);overflow:auto}
.modal .close{position:absolute;top:10px;right:10px}
.detail{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media (max-width:600px){.detail{grid-template-columns:1fr}}
.detail .creature{width:220px;height:220px;display:block;margin:0 auto}
.detail h2{font-size:1.7rem}
.detail .def{font-weight:700;font-size:1.05rem;background:var(--paper);border:2.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0}
.detail .clue{font-size:.95rem;font-weight:600;color:var(--muted)}
.stage-label{display:inline-block;font-family:var(--font-head);font-weight:700;font-size:.85rem;background:var(--gold-2);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}

/* ---------- Badges ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.badge-item{text-align:center;font-weight:700}
.badge-item > svg{width:110px;height:110px}
.badge-item .stars svg{width:20px;height:20px}
.badge-item .badge-svg.earned{animation:badgeIn .7s cubic-bezier(.2,1.3,.4,1) both}
.badge-item .badge-svg.locked{opacity:.55}
@keyframes badgeIn{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:var(--paper);text-align:center}
.stat b{display:block;font-family:var(--font-head);font-size:1.6rem}
.stat span{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- Shop ---------- */
.shop-layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:760px){.shop-layout{grid-template-columns:1fr}}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh-sm);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px}
.item .creature{width:100px;height:100px;margin:0 auto}
.item h4{font-size:1rem}
.item p{font-size:.8rem;color:var(--muted);font-weight:600;flex:1}
.item .btn{padding:8px 12px;font-size:.9rem}
.item.owned{background:var(--paper)}
.item.equipped{background:var(--gold-2)}

/* ---------- Parent corner ---------- */
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{padding:8px 10px;border-bottom:2px solid var(--paper-2);text-align:left}
.table th{font-family:var(--font-head);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.table .bar{height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;width:100px}
.table .bar i{display:block;height:100%;background:var(--ok)}
.table-wrap{overflow-x:auto}

/* ---------- Overlays ---------- */
.levelup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(27,26,34,.6);animation:fadeIn .25s both}
.levelup .rays{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,224,102,.35) 0 6deg,transparent 6deg 18deg);animation:spin 30s linear infinite}
.levelup .box{position:relative;text-align:center;padding:30px 40px;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both}
.levelup .big-sfx{font-family:var(--font-sfx);font-size:clamp(2.6rem,8vw,4.5rem);color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);transform:rotate(-4deg);display:block}
.levelup .creature{width:200px;height:200px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border:2px solid var(--ink);border-radius:3px;animation:confFall linear both}
@keyframes confFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-family:var(--font-head);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .3s both;max-width:90vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.flash-screen{position:fixed;inset:0;z-index:45;pointer-events:none;background:var(--coral);opacity:0;animation:flashRed .35s ease-out both}
@keyframes flashRed{0%{opacity:.35}100%{opacity:0}}

/* ---------- Print (coloring pages) ---------- */
#print-area{display:none}
@media print{
  body{background:#fff}
  #app > *:not(#print-area){display:none!important}
  .confetti,.toast,.levelup,.modal-root,.flash-screen,.sfx{display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;text-align:center;padding:20px;font-family:var(--font-body)}
  .print-page:last-child{page-break-after:auto}
  .print-page h1{font-family:var(--font-head);font-size:2rem;margin-bottom:0}
  .print-page .pw{font-size:1.2rem;margin:4px 0 10px}
  .print-page svg{width:420px;height:420px}
  .print-page.cert svg{width:64px;height:64px}
  .print-page .pdef{font-size:1rem;max-width:560px;margin:0 auto 16px;border:2px dashed #1b1a22;border-radius:12px;padding:10px}
  .print-page .pbox{border:3px solid #1b1a22;border-radius:16px;height:260px;margin:10px auto 0;max-width:640px;position:relative}
  .print-page .pbox span{position:absolute;left:12px;top:8px;font-weight:700;color:#777}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

</style>

<body>
<div id="app">
  <header id="hud" class="hud hidden" aria-label="Tamer status"></header>

    <section class="screen" id="screen-trail"></section>
    <section class="screen" id="screen-learn"></section>
    <section class="screen" id="screen-hunt"></section>
    <section class="screen" id="screen-quiz"></section>
    <section class="screen" id="screen-result"></section>
    <section class="screen" id="screen-album"></section>
    <section class="screen" id="screen-badges"></section>
    <section class="screen" id="screen-shop"></section>
    <section class="screen" id="screen-decks"></section>
    <section class="screen" id="screen-parent"></section>
  </main>
  <div id="overlay-root"></div>
  <div id="print-area"></div>
</div>

<script>
/* ============================================================
   WORD WILDS - weekly word list and settings
   ============================================================
   WORD LIST
   Replace these with the current week's words. Pattern:
   ["the word", "the meaning", "part of speech"],
   The part of speech sets the creature's type and color family,
   so keep it to noun, verb, adjective, or adverb when you can.
   Lists can also be typed inside the game (Decks button), and
   those lists are saved in the browser.
   ============================================================ */

const WORDS = [
  ["gullible",      "Believing or trusting in almost anything", "adjective"],
  ["transplant",    "An event in which an item or person is taken from one place and put into another", "noun"],
  ["pep",           "A lively, vital quality; activity; spirit", "noun"],
  ["reassured",     "Restored confidence or courage in", "verb"],
  ["suspiciously",  "Having or showing a feeling that something is wrong", "adverb"],
  ["flattered",     "Praised too much or insincerely", "verb"],
  ["reinforcement", "Additional support; encouragement", "noun"],
  ["awkwardness",   "A difficult or embarrassing moment; clumsiness", "noun"],
  ["conquer",       "To overcome; to defeat", "verb"],
  ["coordinated",   "Able to do well with physical work or sport", "adjective"]
];

/* Name of this week's list. A new name starts a new trail with new creatures. */
const DECK_NAME = "Unit 1, Week 1: Ava and Pip";

/* Miss a question in the Catch stage and this many correct practice answers
   are needed before the hunt continues. Set to 0 to turn practice drills off. */
const DRILL_REPS = 3;

/* Miss a question in the Catch stage and one caught creature runs away.
   Finishing the practice drill brings it back. Set to false to keep every creature. */
const LOSE_A_CREATURE = true;

/* Nicknames for creatures. Any word without one gets a name built automatically. */
const NICKNAMES = {
  gullible:"Gullipuff", transplant:"Rootamove", pep:"Zippity", reassured:"Calmara",
  suspiciously:"Squintix", flattered:"Flatterfly", reinforcement:"Bulwarkle",
  awkwardness:"Wobblenoot", conquer:"Conquorn", coordinated:"Tumbleon"
};

/* ============================================================
   Everything below runs the game. No edits needed.
   ============================================================ */
const INK = '#1b1a22';

const POS = {
  noun:      { label:'Noun',      color:'#f0a12c', fg:INK,   tint:'#fff0d6' },
  verb:      { label:'Verb',      color:'#e8435e', fg:'#fff', tint:'#ffe1e7' },
  adjective: { label:'Adjective', color:'#7c4ddc', fg:'#fff', tint:'#ece3ff' },
  adverb:    { label:'Adverb',    color:'#24a96c', fg:INK,   tint:'#dcf5e8' },
  other:     { label:'Word',      color:'#5d6b8a', fg:'#fff', tint:'#e6eaf2' },
};
const POS_LIST = ['noun', 'verb', 'adjective', 'adverb'];
function posKey(p){ p = (p || '').toLowerCase().trim(); return POS[p] ? p : (p ? 'other' : 'other'); }
function posInfo(p){ return POS[posKey(p)]; }

const STAGE_NAMES = ['Egg', 'Hatchling', 'Grown', 'Evolved'];
function stageFor(rec){
  if(!rec || !rec.seen) return 0;
  if(rec.mastery >= 5) return 3;
  if(rec.mastery >= 2) return 2;
  return 1;
}
const MASTERY_MAX = 6;

const TITLES = ['Rookie Tamer', 'Word Scout', 'Vocab Ranger', 'Lexicon Knight', 'Word Sage',
                'Grand Tamer', 'Word Legend', 'Mythic Tamer', 'Star Tamer', 'Supreme Tamer'];
function xpForLevel(L){ return 75 * L * (L + 1); }
function levelFromXp(xp){ let L = 1; while(xp >= xpForLevel(L) && L < 50) L++; return L; }

const ITEMS = [
  { id:'flower',    name:'Daisy Clip',  price:60,  slot:'hat',  desc:'A cheerful daisy for any head.' },
  { id:'scarf',     name:'Red Scarf',   price:90,  slot:'neck', desc:'Cozy, bold, and very stylish.' },
  { id:'bow',       name:'Big Bow',     price:110, slot:'hat',  desc:'A giant pink bow. Very manga.' },
  { id:'cap',       name:'Tamer Cap',   price:150, slot:'hat',  desc:'The official cap of Word Tamers.' },
  { id:'headphones',name:'Headphones',  price:180, slot:'hat',  desc:'For listening to study beats.' },
  { id:'crown',     name:'Star Crown',  price:260, slot:'hat',  desc:'Only true champions wear this.' },
  { id:'cape',      name:'Hero Cape',   price:320, slot:'neck', desc:'Flutters dramatically in the wind.' },
  { id:'wizard',    name:'Wizard Hat',  price:400, slot:'hat',  desc:'Grants +100 style. Maybe magic.' },
];
const ITEM_BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

/* Trail stops (levels) that every word list goes through */
const STOPS = [
  { id:'meet',     name:'Meet the Creatures', short:'Meet',     icon:'egg',    desc:'Flashcards. Hatch every egg and hear each word.' },
  { id:'catch',    name:'Tall Grass Hunt',    short:'Hunt',     icon:'grass',  desc:'Wild creatures appear one by one. Answer to catch them all.' },
  { id:'train',    name:'Training',           short:'Train',    icon:'bolt',   desc:'Ten mixed questions. Score 70% or more to unlock the Guardian.' },
  { id:'boss',     name:'Guardian Battle',    short:'Guardian', icon:'shield', desc:'A boss battle with hearts and critical hits.' },
  { id:'dojo',     name:'Spelling Dojo',      short:'Dojo',     icon:'pencil', desc:'Type every word from its meaning.' },
  { id:'champion', name:'Champion Arena',     short:'Champion', icon:'trophy', desc:'Every question type. Win the badge for this list.' },
];

const QUILL = {
  welcome: 'Welcome to the Word Wilds! I am Professor Quill. Wild Word Creatures are hiding in the tall grass, and only a Tamer who knows their words can catch them. Shall we begin?',
  pickStarter: 'Every Tamer needs a partner. Choose one of these three to travel with you. You can change partners later in your Album.',
  trail: [
    'Follow the trail from left to right. Each stop unlocks the next one.',
    'Answering correctly makes your creatures grow. Master a word and its creature will evolve!',
    'Coins can be spent in the Shop to dress up your partner.',
    'A new word list means a new trail, new creatures, and a new badge to earn.',
    'Missed a word? It will come back soon so you can catch it next time.',
  ],
  meet: 'Read the word, guess the meaning in your head, then reveal the definition. Tap the speaker to hear it.',
  catch: 'Creatures are hiding in the tall grass! Each one asks two questions. Answer both to catch it.',
  train: 'Training time! Pick the right answer. Streaks earn bonus coins.',
  boss: 'The Guardian is strong. Every correct answer is an attack. Three misses and we retreat, but we can always try again!',
  dojo: 'In the Spelling Dojo you type the word yourself. Listen for each syllable.',
  champion: 'This is it. Every word on the list, every kind of question. Show the Grand Quizzard what you can do!',
  grounds: 'Quick Practice mixes the words that need the most work. Perfect before a test!',
};

/* ============================================================
   WORD TAMERS - vector creature art
   All creatures are drawn in a 200 x 200 box. Ground line is y = 178.
   ============================================================ */
const Art = (() => {
  const SW = 3.6;
  let LINE = false;           // line-art (coloring page) mode while rendering

  /* ---------- primitives ---------- */
  const ell = (cx, cy, rx, ry) =>
    `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0 Z`;
  const circ = (cx, cy, r) => ell(cx, cy, r, r);

  function hexToRgb(h){ h = h.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
  function darken(hex, amt){ const [r,g,b] = hexToRgb(hex); return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt)); }
  function lighten(hex, amt){ const [r,g,b] = hexToRgb(hex); return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt); }

  const stroke = `stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round"`;

  /* A shaded shape: dark base, lighter inner copy shifted up-left, ink outline. */
  function shaded(d, base, dark, o = {}) {
    const { cx = 100, cy = 115, s = 0.9, dx = 5, dy = 6, outline = true } = o;
    if (LINE) return `<path d="${d}" fill="#fff" ${stroke}/>`;
    dark = dark || darken(base, 0.22);
    const tx = cx - s * cx - dx, ty = cy - s * cy - dy;
    return `<path d="${d}" fill="${dark}"/>` +
           `<path d="${d}" fill="${base}" transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s})"/>` +
           (outline ? `<path d="${d}" fill="none" ${stroke}/>` : '');
  }
  /* A flat shape with outline */
  function flat(d, fill, o = {}) {
    const { outline = true, sw = SW, opacity = 1 } = o;
    const f = LINE ? (fill === INK ? INK : '#fff') : fill;
    if (LINE && !outline) return '';
    return `<path d="${d}" fill="${f}" ${outline ? `stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"` : ''} ${opacity < 1 ? `opacity="${opacity}"` : ''}/>`;
  }
  /* Decorative fill with no outline (skipped in line art) */
  function deco(d, fill, opacity = 1) {
    if (LINE) return '';
    return `<path d="${d}" fill="${fill}" ${opacity < 1 ? `opacity="${opacity}"` : ''}/>`;
  }
  function line(d, sw = SW, color = INK) {
    if (LINE) color = INK;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  function highlight(cx, cy, rx, ry, rot = -30) {
    if (LINE) return '';
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity="0.55" transform="rotate(${rot} ${cx} ${cy})"/>`;
  }

  /* Manga eye */
  function eye(x, y, r, iris = '#3b2a6e', o = {}) {
    const { dx = 0, dy = 0, closed = false } = o;
    if (closed) return line(`M${x - r},${y + 2} q${r},${-r * 1.1} ${2 * r},0`, SW);
    const px = x + dx, py = y + dy;
    let s = `<path d="${ell(x, y, r * 0.84, r)}" fill="#fff" ${stroke}/>`;
    if (!LINE) s += `<circle cx="${px}" cy="${py + r * 0.06}" r="${(r * 0.64).toFixed(2)}" fill="${iris}"/>`;
    s += `<circle cx="${px}" cy="${py + r * 0.16}" r="${(r * 0.4).toFixed(2)}" fill="${INK}"/>`;
    if (!LINE) s += `<circle cx="${px - r * 0.28}" cy="${py - r * 0.32}" r="${(r * 0.24).toFixed(2)}" fill="#fff"/>` +
                    `<circle cx="${px + r * 0.22}" cy="${py + r * 0.2}" r="${(r * 0.1).toFixed(2)}" fill="#fff"/>`;
    return s;
  }
  function eyes(cx, cy, dist, r, iris, o = {}) { return eye(cx - dist, cy, r, iris, o) + eye(cx + dist, cy, r, iris, o); }
  function mouth(type, x, y, w = 14) {
    const h = w * 0.5;
    switch (type) {
      case 'smile': return line(`M${x - w / 2},${y} q${w / 2},${h} ${w},0`);
      case 'open': {
        const d = `M${x - w / 2},${y} q${w / 2},${h * 1.8} ${w},0 Z`;
        return flat(d, '#ff6f91') + (LINE ? '' : `<path d="M${x - w * 0.22},${y + h * 0.55} q${w * 0.22},${h * 0.7} ${w * 0.44},0 Z" fill="#ff9fb5"/>`);
      }
      case 'cat': return line(`M${x - w / 2},${y} q${w / 4},${h} ${w / 2},0 q${w / 4},${h} ${w / 2},0`);
      case 'grin': {
        const d = `M${x - w / 2},${y} q${w / 2},${h * 1.6} ${w},0 Z`;
        return flat(d, '#ff6f91') + flat(`M${x - w * 0.38},${y + 1} l0,${h * 0.55} l${w * 0.14},${-h * 0.55}Z`, '#fff', { sw: 2 }) +
               flat(`M${x + w * 0.38},${y + 1} l0,${h * 0.55} l${-w * 0.14},${-h * 0.55}Z`, '#fff', { sw: 2 });
      }
      case 'beak': return flat(`M${x - w / 2},${y - 2} L${x + w / 2},${y - 2} L${x},${y + h + 2} Z`, '#ffb347');
      case 'tiny': return line(`M${x - 3},${y} q3,3 6,0`);
      default: return '';
    }
  }
  function blush(cx, cy, dist, color = '#ff8fa3') {
    if (LINE) return '';
    return `<ellipse cx="${cx - dist}" cy="${cy}" rx="7" ry="4" fill="${color}" opacity="0.6"/><ellipse cx="${cx + dist}" cy="${cy}" rx="7" ry="4" fill="${color}" opacity="0.6"/>`;
  }
  function star(cx, cy, r, fill = '#ffc83d', o = {}) {
    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2);
    }
    return flat(d + 'Z', fill, o);
  }
  function sparkle(cx, cy, r, fill = '#fff') {
    const d = `M${cx},${cy - r} Q${cx},${cy} ${cx + r},${cy} Q${cx},${cy} ${cx},${cy + r} Q${cx},${cy} ${cx - r},${cy} Q${cx},${cy} ${cx},${cy - r}Z`;
    return flat(d, fill, { sw: 2 });
  }

  /* ---------- body shapes ---------- */
  const SHAPES = {
    egg:   'M100,52 C138,52 160,92 160,128 C160,160 134,180 100,180 C66,180 40,160 40,128 C40,92 62,52 100,52 Z',
    round: circ(100, 118, 60),
    pear:  'M100,56 C122,56 126,84 138,104 C152,128 152,176 100,178 C48,176 48,128 62,104 C74,84 78,56 100,56 Z',
    wide:  'M100,66 C150,66 172,100 172,134 C172,166 140,180 100,180 C60,180 28,166 28,134 C28,100 50,66 100,66 Z',
    bean:  'M100,60 C136,60 156,84 158,118 C160,150 142,180 100,180 C58,180 40,150 42,118 C44,84 64,60 100,60 Z',
    dome:  'M38,132 C38,84 66,62 100,62 C134,62 162,84 162,132 Z',
    blob:  'M100,62 C130,58 162,82 160,122 C158,156 136,180 100,180 C64,180 42,156 40,122 C38,82 70,66 100,62 Z',
  };

  /* ---------- accessories ---------- */
  const ACC = {
    flower(a) { const { x, y, w } = a; const r = w * 0.16, cx = x + w * 0.28, cy = y + 2; let s = '';
      for (let i = 0; i < 6; i++) { const ang = i * 60; s += `<ellipse cx="${cx}" cy="${cy - r * 0.9}" rx="${r * 0.42}" ry="${r * 0.9}" fill="${LINE ? '#fff' : '#fff'}" ${stroke} transform="rotate(${ang} ${cx} ${cy})"/>`; }
      return s + flat(circ(cx, cy, r * 0.5), '#ffc83d'); },
    bow(a) { const { x, y, w } = a; const cx = x - w * 0.3, cy = y + 4, r = w * 0.2;
      return flat(`M${cx},${cy} C${cx - r * 0.6},${cy - r * 1.3} ${cx - r * 2.6},${cy - r * 1.2} ${cx - r * 2.2},${cy} C${cx - r * 2.6},${cy + r * 1.2} ${cx - r * 0.6},${cy + r * 1.3} ${cx},${cy}Z`, '#ff6fa5') +
             flat(`M${cx},${cy} C${cx + r * 0.6},${cy - r * 1.3} ${cx + r * 2.6},${cy - r * 1.2} ${cx + r * 2.2},${cy} C${cx + r * 2.6},${cy + r * 1.2} ${cx + r * 0.6},${cy + r * 1.3} ${cx},${cy}Z`, '#ff6fa5') +
             flat(circ(cx, cy, r * 0.55), '#ff3d86'); },
    cap(a) { const { x, y, w } = a; const r = w * 0.5;
      return flat(`M${x - r * 0.95},${y + 10} C${x - r * 0.95},${y - r * 0.55} ${x + r * 0.95},${y - r * 0.55} ${x + r * 0.95},${y + 10} Z`, '#e8435e') +
             flat(`M${x - r * 0.98},${y + 10} L${x + r * 1.35},${y + 10} Q${x + r * 1.4},${y + 18} ${x + r * 0.9},${y + 18} L${x - r * 0.9},${y + 18} Z`, '#c42846') +
             star(x, y - r * 0.05, r * 0.22, '#fff', { sw: 2 }); },
    headphones(a) { const { x, y, w } = a; const r = w * 0.56;
      return line(`M${x - r},${y + 22} C${x - r},${y - 12} ${x + r},${y - 12} ${x + r},${y + 22}`, 7) +
             (LINE ? '' : line(`M${x - r},${y + 22} C${x - r},${y - 12} ${x + r},${y - 12} ${x + r},${y + 22}`, 3, '#6c5ce7')) +
             flat(`M${x - r - 8},${y + 18} h12 a5,5 0 0 1 5,5 v14 a5,5 0 0 1 -5,5 h-12 Z`, '#6c5ce7') +
             flat(`M${x + r + 8},${y + 18} h-12 a5,5 0 0 0 -5,5 v14 a5,5 0 0 0 5,5 h12 Z`, '#6c5ce7'); },
    crown(a) { const { x, y, w } = a; const r = w * 0.36, top = y - 14;
      return flat(`M${x - r},${y + 8} L${x - r},${top + 4} L${x - r * 0.5},${top + 16} L${x},${top - 6} L${x + r * 0.5},${top + 16} L${x + r},${top + 4} L${x + r},${y + 8} Z`, '#ffc83d') +
             flat(circ(x, y + 2, 3.5), '#e8435e', { sw: 2 }) + flat(circ(x - r * 0.55, y + 3, 2.6), '#2f5fe0', { sw: 2 }) + flat(circ(x + r * 0.55, y + 3, 2.6), '#24a96c', { sw: 2 }); },
    wizard(a) { const { x, y, w } = a; const r = w * 0.5;
      return flat(`M${x - r * 0.8},${y + 6} C${x - r * 0.2},${y - 10} ${x + r * 0.1},${y - 30} ${x + r * 0.35},${y - 58} C${x + r * 0.4},${y - 30} ${x + r * 0.6},${y - 12} ${x + r * 0.8},${y + 6} Z`, '#7c4ddc') +
             flat(`M${x - r * 1.25},${y + 6} Q${x},${y + 14} ${x + r * 1.25},${y + 6} Q${x},${y} ${x - r * 1.25},${y + 6} Z`, '#5b36b8') +
             star(x + r * 0.12, y - 24, 5, '#ffc83d', { sw: 2 }); },
    scarf(a) { const { x, y, w } = a; const r = w * 0.5;
      return flat(`M${x - r},${y - 6} Q${x},${y + 10} ${x + r},${y - 6} L${x + r},${y + 6} Q${x},${y + 22} ${x - r},${y + 6} Z`, '#e8435e') +
             flat(`M${x + r * 0.45},${y + 8} L${x + r * 0.85},${y + 34} L${x + r * 0.25},${y + 30} Z`, '#e8435e'); },
    cape(a) { const { x, y, w } = a; const r = w * 0.5; const b = Math.min(y + 112, 184); const h = b - y; /* drawn behind the body */
      return flat(`M${x - r * 0.9},${y} C${x - r * 1.6},${y + h * .36} ${x - r * 1.9},${y + h * .72} ${x - r * 1.3},${b} L${x + r * 1.3},${b} C${x + r * 1.9},${y + h * .72} ${x + r * 1.6},${y + h * .36} ${x + r * 0.9},${y} Z`, '#e8435e'); },
    capeKnot(a) { const { x, y, w } = a; const r = w * 0.5;
      return line(`M${x - r * 0.9},${y + 2} Q${x},${y + 12} ${x + r * 0.9},${y + 2}`, 5) + flat(circ(x, y + 8, 4), '#ffc83d', { sw: 2 }); },
  };

  /* ---------- creatures ----------
     Each returns { layers:string, hat:{x,y,w}, neck:{x,y,w} }.
     stage: 1 hatchling, 2 grown, 3 evolved  */
  const C = {};

  /* ---------- procedural creature generator ----------
     Every word gets a stable design from a hash of its letters. */
  function hash(str){ let h = 5381; for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h; }
  const pick = (arr, seed) => arr[hash(seed) % arr.length];

  const FAMILIES = {
    noun:      [{ base:'#ffc83d', dark:'#dfa000' }, { base:'#ffa541', dark:'#e5781e' }, { base:'#f2bd6e', dark:'#d6913c' }, { base:'#ffd98a', dark:'#e0a83a' }],
    verb:      [{ base:'#ff6b81', dark:'#d9405c' }, { base:'#f26d6d', dark:'#c93f3f' }, { base:'#ff8c69', dark:'#e0603f' }, { base:'#ff9fb5', dark:'#e0607f' }],
    adjective: [{ base:'#8d6bf7', dark:'#5e3fd1' }, { base:'#9fb8ff', dark:'#6f8ae0' }, { base:'#b487f0', dark:'#7b4fd0' }, { base:'#c9b8ff', dark:'#8f78e0' }],
    adverb:    [{ base:'#7fdccc', dark:'#36b1a0' }, { base:'#5fc983', dark:'#2f9a57' }, { base:'#52c9b3', dark:'#279a86' }, { base:'#a8e6a1', dark:'#63b95a' }],
    other:     [{ base:'#9aa4c4', dark:'#6a7399' }, { base:'#e9e4ff', dark:'#b9aef0' }, { base:'#c9c2b8', dark:'#8f877c' }],
  };
  const ACCENTS = ['#ffc83d', '#e8435e', '#4aa3ff', '#24a96c', '#ff8c42', '#8b5cf6', '#ff6fa5', '#2f5fe0'];
  const IRISES = ['#3b2a6e', '#2f8f6f', '#5a3618', '#1f7f8f', '#7c4ddc', '#c05891', '#2e8b57', '#2a3a7a'];

  const METRICS = {
    egg:   { top:52, face:104, earL:[66, 84], earR:[134, 84], side:[42, 128], tail:[150, 140], feet:172, feetX:30, hat:{ x:100, y:56, w:96 }, neck:{ x:100, y:150, w:84 }, cy:115 },
    round: { top:58, face:108, earL:[62, 74], earR:[138, 74], side:[40, 120], tail:[152, 144], feet:172, feetX:30, hat:{ x:100, y:60, w:104 }, neck:{ x:100, y:150, w:100 }, cy:118 },
    pear:  { top:56, face:104, earL:[78, 72], earR:[122, 72], side:[52, 148], tail:[146, 150], feet:176, feetX:34, hat:{ x:100, y:60, w:70 }, neck:{ x:100, y:134, w:76 }, cy:125 },
    bean:  { top:60, face:106, earL:[66, 80], earR:[134, 80], side:[44, 120], tail:[150, 146], feet:174, feetX:30, hat:{ x:100, y:62, w:96 }, neck:{ x:100, y:150, w:92 }, cy:118 },
    blob:  { top:62, face:104, earL:[64, 84], earR:[140, 80], side:[42, 122], tail:[150, 144], feet:174, feetX:30, hat:{ x:100, y:66, w:104 }, neck:{ x:100, y:150, w:100 }, cy:120 },
    wide:  { top:66, face:110, earL:[58, 84], earR:[142, 84], side:[30, 134], tail:[160, 150], feet:176, feetX:40, hat:{ x:100, y:68, w:110 }, neck:{ x:100, y:160, w:110 }, cy:124 },
  };

  function specFor(word, pos){
    const k = String(word).toLowerCase().replace(/[^a-z]/g, '');
    const fam = FAMILIES[pos] || FAMILIES.other;
    const pal = pick(fam, k + '|pal');
    return {
      body:    pick(['egg', 'round', 'pear', 'bean', 'blob', 'wide'], k + '|body'),
      ears:    pick(['none', 'cat', 'bunny', 'round', 'floppy', 'cat', 'round'], k + '|ears'),
      crest:   pick(['none', 'horn', 'twohorn', 'leaf', 'plume', 'antenna', 'fin', 'tuft'], k + '|crest'),
      tail:    pick(['none', 'curl', 'flame', 'leaf', 'bolt', 'fluff', 'spike'], k + '|tail'),
      pattern: pick(['none', 'spots', 'stripes', 'belly', 'star', 'belly', 'spots'], k + '|pattern'),
      mouth:   pick(['smile', 'open', 'cat', 'grin', 'tiny', 'smile', 'open'], k + '|mouth'),
      eyeR:    10 + (hash(k + '|eye') % 3),
      eyeDist: 19 + (hash(k + '|dist') % 5),
      arms:    hash(k + '|arms') % 3 !== 0,
      base: pal.base, dark: pal.dark,
      accent: pick(ACCENTS, k + '|accent'),
      iris:   pick(IRISES, k + '|iris'),
      innerEar: '#ffb3c6',
    };
  }

  function genCreature(spec, st){
    const m = METRICS[spec.body]; const cx = 100, fy = m.face;
    const { base, dark, accent } = spec;
    const light = lighten(base, .55);
    let s = '';
    const evolved = st >= 3;
    // wings (evolved), drawn behind the body
    if(evolved){
      const wc = lighten(accent, .55), wd = lighten(accent, .2);
      const wx = m.side[0] + 16, wy = m.side[1] - 14;
      s += shaded(`M${wx},${wy} C${wx - 28},${wy - 28} ${wx - 40},${wy - 52} ${wx - 20},${wy - 62} C${wx - 2},${wy - 68} ${wx + 12},${wy - 34} ${wx + 26},${wy - 6} Z`, wc, wd, { cx:wx - 10, cy:wy - 30 });
      const rx = 200 - wx;
      s += shaded(`M${rx},${wy} C${rx + 28},${wy - 28} ${rx + 40},${wy - 52} ${rx + 20},${wy - 62} C${rx + 2},${wy - 68} ${rx - 12},${wy - 34} ${rx - 26},${wy - 6} Z`, wc, wd, { cx:rx + 10, cy:wy - 30 });
    }
    // floppy ears hang outside the body and sit behind it
    if(spec.ears === 'floppy'){
      const lx = m.earL[0] - 6, ly = m.earL[1], rx = m.earR[0] + 6, ry = m.earR[1];
      s += shaded(`M${lx},${ly} C${lx - 24},${ly - 6} ${lx - 36},${ly + 30} ${lx - 22},${ly + 58} C${lx - 14},${ly + 74} ${lx + 6},${ly + 60} ${lx + 6},${ly + 36} C${lx + 6},${ly + 16} ${lx + 4},${ly + 6} ${lx},${ly} Z`, dark, darken(dark, .2), { cx:lx - 12, cy:ly + 30 });
      s += shaded(`M${rx},${ry} C${rx + 24},${ry - 6} ${rx + 36},${ry + 30} ${rx + 22},${ry + 58} C${rx + 14},${ry + 74} ${rx - 6},${ry + 60} ${rx - 6},${ry + 36} C${rx - 6},${ry + 16} ${rx - 4},${ry + 6} ${rx},${ry} Z`, dark, darken(dark, .2), { cx:rx + 12, cy:ry + 30 });
    }
    // tail
    if(st >= 2 && spec.tail !== 'none'){
      const [tx, ty] = m.tail; const tc = evolved ? '#ffc83d' : accent;
      switch(spec.tail){
        case 'curl': s += line(`M${tx},${ty} C${tx + 28},${ty - 34} ${tx + 52},${ty + 4} ${tx + 30},${ty + 16}`, 7) + flat(circ(tx + 30, ty + 16, 6), tc, { sw:2.5 }); break;
        case 'flame': s += flat(`M${tx},${ty + 10} C${tx + 8},${ty - 22} ${tx + 40},${ty - 34} ${tx + 36},${ty - 2} C${tx + 34},${ty + 16} ${tx + 14},${ty + 22} ${tx},${ty + 10}Z`, tc) + deco(`M${tx + 10},${ty + 6} C${tx + 14},${ty - 10} ${tx + 30},${ty - 16} ${tx + 28},${ty} C${tx + 26},${ty + 10} ${tx + 16},${ty + 12} ${tx + 10},${ty + 6}Z`, lighten(tc, .5)); break;
        case 'leaf': s += `<g transform="translate(${tx} ${ty + 8}) rotate(60)">` + flat('M0,0 C-16,-14 -14,-44 0,-56 C14,-44 16,-14 0,0 Z', '#3fb86b') + line('M0,-4 L0,-48', 2.2) + '</g>'; break;
        case 'bolt': s += flat(`M${tx},${ty + 4} L${tx + 24},${ty - 24} L${tx + 18},${ty - 6} L${tx + 40},${ty - 14} L${tx + 10},${ty + 20} L${tx + 18},${ty + 2} Z`, tc); break;
        case 'fluff': s += flat(circ(tx + 16, ty + 10, 10), tc) + flat(circ(tx + 30, ty, 12), tc) + flat(circ(tx + 20, ty - 12, 9), tc); break;
        case 'spike': s += flat(`M${tx},${ty - 6} L${tx + 26},${ty - 30} L${tx + 22},${ty - 6} L${tx + 42},${ty - 12} L${tx + 24},${ty + 10} L${tx + 34},${ty + 24} L${tx},${ty + 12} Z`, tc); break;
      }
    }
    // ears (behind body)
    const ear = (ex, ey, sgn, kind) => {
      const pink = spec.innerEar;
      switch(kind){
        case 'cat': return shaded(`M${ex - 10 * sgn},${ey + 8} L${ex + 10 * sgn},${ey - 30} L${ex + 26 * sgn},${ey + 14} Z`, base, dark, { cx:ex + 8 * sgn, cy:ey }) + deco(`M${ex - 2 * sgn},${ey + 6} L${ex + 10 * sgn},${ey - 18} L${ex + 19 * sgn},${ey + 10} Z`, pink);
        case 'bunny': return `<g transform="rotate(${-14 * sgn} ${ex} ${ey})">` + shaded(ell(ex + 4 * sgn, ey - 30, 12, 36), base, dark, { cx:ex + 4 * sgn, cy:ey - 30, s:.85, dx:3, dy:4 }) + deco(ell(ex + 4 * sgn, ey - 28, 6, 24), pink) + '</g>';
        case 'round': return shaded(circ(ex + 4 * sgn, ey - 8, 17), base, dark, { cx:ex + 4 * sgn, cy:ey - 8, s:.85, dx:3, dy:3 }) + deco(circ(ex + 4 * sgn, ey - 8, 8), pink);
        default: return '';
      }
    };
    if(spec.ears !== 'none' && spec.ears !== 'floppy'){ s += ear(m.earL[0], m.earL[1], -1, spec.ears) + ear(m.earR[0], m.earR[1], 1, spec.ears); }
    // crest
    if(st >= 2 && spec.crest !== 'none'){
      const hx = m.hat.x, hy = m.hat.y + 2; const cc = evolved ? '#ffc83d' : accent;
      switch(spec.crest){
        case 'horn': s += flat(`M${hx - 9},${hy + 10} L${hx - 2},${hy - 26} L${hx + 11},${hy + 8} Z`, cc); break;
        case 'twohorn': s += flat(`M${hx - 28},${hy + 14} L${hx - 30},${hy - 16} L${hx - 8},${hy + 8} Z`, cc) + flat(`M${hx + 28},${hy + 14} L${hx + 30},${hy - 16} L${hx + 8},${hy + 8} Z`, cc); break;
        case 'leaf': s += `<g transform="translate(${hx} ${hy + 8}) rotate(10)">` + flat('M0,0 C-14,-12 -12,-38 0,-48 C12,-38 14,-12 0,0 Z', '#3fb86b') + line('M0,-4 L0,-40', 2.2) + '</g>'; break;
        case 'plume': s += line(`M${hx + 2},${hy + 8} C${hx + 2},${hy - 8} ${hx + 8},${hy - 18} ${hx + 16},${hy - 26}`, 3.5) + flat(`M${hx + 16},${hy - 26} C${hx + 8},${hy - 32} ${hx + 8},${hy - 46} ${hx + 20},${hy - 48} C${hx + 32},${hy - 48} ${hx + 34},${hy - 32} ${hx + 24},${hy - 24} Z`, cc); break;
        case 'antenna': s += line(`M${hx - 14},${hy + 8} C${hx - 22},${hy - 6} ${hx - 32},${hy - 12} ${hx - 38},${hy - 22}`) + line(`M${hx + 14},${hy + 8} C${hx + 22},${hy - 6} ${hx + 32},${hy - 12} ${hx + 38},${hy - 22}`) + flat(circ(hx - 39, hy - 24, 5), cc) + flat(circ(hx + 39, hy - 24, 5), cc); break;
        case 'fin': s += flat(`M${hx - 20},${hy + 12} Q${hx},${hy - 32} ${hx + 20},${hy + 12} Z`, cc); break;
        case 'tuft': s += flat(`M${hx - 16},${hy + 10} L${hx - 10},${hy - 16} L${hx - 2},${hy + 4} L${hx + 4},${hy - 22} L${hx + 10},${hy + 4} L${hx + 16},${hy - 12} L${hx + 18},${hy + 10} Z`, cc); break;
      }
    }
    // body
    s += shaded(SHAPES[spec.body], base, dark, { cy:m.cy });
    // pattern
    const bx = cx, by = fy + 44;
    if(spec.pattern === 'belly') s += deco(ell(bx, by + 4, 30, 22), light);

const rnd = (n) => Math.floor(Math.random() * n);

function pickWeighted(items, weightFn){
  const ws = items.map(weightFn); const total = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for(let i = 0; i < items.length; i++){ r -= ws[i]; if(r <= 0) return items[i]; }

}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'list'; }

const SUFFIXES = ['mon', 'ling', 'ix', 'oo', 'puff', 'zor', 'tail', 'wisp', 'dra', 'bit', 'let', 'kin', 'nook', 'paw', 'bo', 'sprout'];
function autoName(w){
  const clean = String(w).replace(/[^a-zA-Z]/g, '');
  const stem = clean.slice(0, clean.length > 6 ? 5 : 4) || 'Word';
  return stem.charAt(0).toUpperCase() + stem.slice(1).toLowerCase() + SUFFIXES[Art.hash(clean.toLowerCase() + '|name') % SUFFIXES.length];

/* Split a word into syllable-like chunks for the Word Builder. */
function chunkWord(word){
  const parts = String(word).toLowerCase().split(/[\s-]+/).filter(Boolean);
  let chunks = [];
  parts.forEach(part => { chunks = chunks.concat(chunkPart(part)); });
  // keep between 2 and 6 tiles
  while(chunks.length > 6){ let bi = 0, bl = Infinity; for(let i = 0; i < chunks.length - 1; i++){ const l = chunks[i].length + chunks[i + 1].length; if(l < bl){ bl = l; bi = i; } } chunks.splice(bi, 2, chunks[bi] + chunks[bi + 1]); }

  return chunks;
}
function chunkPart(w){
  const isV = (c, i) => 'aeiou'.includes(c) || (c === 'y' && i > 0);
  const letters = w.replace(/[^a-z]/g, '');
  if(letters.length <= 3) return [letters];
  let tailChunk = null, body = letters;
  // consonant + "le" ending stays together (ta-ble, gul-li-ble)
  if(/[^aeiou]le$/.test(letters) && letters.length > 4){ tailChunk = letters.slice(-3); body = letters.slice(0, -3); }
  // find vowel nuclei
  const nuclei = [];
  for(let i = 0; i < body.length; i++){
    if(isV(body[i], i)){ if(nuclei.length && nuclei[nuclei.length - 1].end === i - 1) nuclei[nuclei.length - 1].end = i; else nuclei.push({ start:i, end:i }); }
  }
  // silent final e joins the previous syllable
  if(nuclei.length > 1 && body.endsWith('e') && nuclei[nuclei.length - 1].start === body.length - 1 && !isV(body[body.length - 2], body.length - 2)) nuclei.pop();
  const cuts = [];
  for(let i = 0; i < nuclei.length - 1; i++){
    const a = nuclei[i], b = nuclei[i + 1];
    const n = b.start - a.end - 1;
    if(n === 0) cuts.push(b.start);
    else if(n === 1) cuts.push(a.end + 1);
    else cuts.push(a.end + 2);
  }
  const out = []; let prev = 0;
  cuts.forEach(c => { if(c > prev && c < body.length){ out.push(body.slice(prev, c)); prev = c; } });
  out.push(body.slice(prev));
  if(tailChunk) out.push(tailChunk);
  return out.filter(Boolean);
}

  ensureBuiltin(){
    const id = 'b:' + slug(DECK_NAME);
    if(!state.decks[id]){
      state.decks[id] = newDeck(id, DECK_NAME, WORDS, false);
      state.currentDeck = id;           // a new weekly list becomes the active trail
    } else {
      const d = state.decks[id]; d.name = DECK_NAME;
      const same = JSON.stringify(d.words) === JSON.stringify(newDeck('x', 'x', WORDS).words);
      if(!same) setDeckWords(d, WORDS);
    }
    if(!state.currentDeck || !state.decks[state.currentDeck]) state.currentDeck = id;
    this.save();
  },
  save(){ try{ state.lastPlayed = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} },
  reset(){ state = defaultState(); try{ localStorage.removeItem(SAVE_KEY); }catch(e){} this.ensureBuiltin(); },
  hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } },
};

/* ---------- decks and words ---------- */
const Deck = {
  current(){ return state.decks[state.currentDeck]; },
  all(){ return Object.values(state.decks).sort((a, b) => (b.created || 0) - (a.created || 0)); },
  get(id){ return state.decks[id]; },
  setCurrent(id){ if(state.decks[id]){ state.currentDeck = id; Store.save(); } },
  addCustom(name, words){ const id = 'c:' + Date.now().toString(36); state.decks[id] = newDeck(id, name, words, true); state.currentDeck = id; Store.save(); return id; },
  updateCustom(id, name, words){ const d = state.decks[id]; if(!d) return; d.name = name; setDeckWords(d, words); Store.save(); },
  remove(id){ const d = state.decks[id]; if(!d || !d.custom) return; delete state.decks[id]; if(state.currentDeck === id) state.currentDeck = Object.keys(state.decks)[0]; if(state.partner && state.partner.deck === id) state.partner = null; Store.save(); },
  /* word objects for a deck */
  words(deckId){ const d = state.decks[deckId || state.currentDeck]; return d ? d.words.map(w => this.wordObj(d, w)) : []; },
  wordObj(d, w){
    const key = wordKey(w[0]); const pos = posKey(w[2]);
    return { deck:d.id, key, word:w[0], def:w[1], pos, posRaw:w[2], name:NICKNAMES[w[0]] || NICKNAMES[key] || autoName(w[0]),
             species:SPECIES[Art.hash(key + '|sp') % SPECIES.length], spec:Art.specFor(w[0], pos), chunks:chunkWord(w[0]) };
  },
  find(deckId, key){ const d = state.decks[deckId]; if(!d) return null; const w = d.words.find(x => wordKey(x[0]) === key); return w ? this.wordObj(d, w) : null; },
  rec(deckId, key){ const d = state.decks[deckId]; if(!d) return null; if(!d.wordsRec[key]) d.wordsRec[key] = { seen:false, mastery:0, correct:0, wrong:0, last:0 }; return d.wordsRec[key]; },
  guardian(deckId){ const ws = this.words(deckId); if(!ws.length) return null; return ws.slice().sort((a, b) => b.word.length - a.word.length || a.word.localeCompare(b.word))[0]; },
  badgeEarned(d){ return d.stops.champion.won; },
  deckStars(d){ return d.stops.catch.stars + d.stops.boss.stars + d.stops.champion.stars; },
  parseList(text){
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const out = [], bad = [];
    lines.forEach((l, i) => {
      const cut = l.indexOf('=') > -1 ? l.indexOf('=') : l.indexOf(':');
      if(cut < 1 || cut === l.length - 1){ bad.push(i + 1); return; }
      let w = l.slice(0, cut).trim(); const d = l.slice(cut + 1).trim(); let p = '';
      const m = w.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      if(m){ w = m[1].trim(); p = m[2].trim().toLowerCase(); }
      if(!w || !d){ bad.push(i + 1); return; }
      out.push([w, d, p]);
    });
    return { words:out, bad };
  },
  listText(d){ return d.words.map(([w, def, p]) => w + (p ? ' (' + p + ')' : '') + ' = ' + def).join('\n'); },
};

/* ---------- sound (tiny synth) ---------- */
const Sound = {
  ctx:null,
  ensure(){
    if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false; this.ctx = new AC(); }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  tone(freq, dur, { type = 'sine', vol = .18, at = 0, slide = null } = {}){
    const c = this.ctx, t0 = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
  },
  play(name){
    if(!state.sound) return;
    try{
      if(!this.ensure()) return;
      switch(name){
        case 'click': this.tone(660, .05, { type:'triangle', vol:.08 }); break;
        case 'correct': this.tone(523, .09, { type:'triangle' }); this.tone(659, .09, { type:'triangle', at:.08 }); this.tone(784, .16, { type:'triangle', at:.16 }); break;
        case 'wrong': this.tone(190, .22, { type:'square', vol:.08, slide:120 }); break;
        case 'coin': this.tone(1320, .06, { type:'sine', vol:.12 }); this.tone(1760, .12, { type:'sine', vol:.12, at:.06 }); break;
        case 'hit': this.tone(110, .18, { type:'sawtooth', vol:.16, slide:40 }); this.tone(880, .05, { type:'square', vol:.05 }); break;
        case 'crit': this.tone(90, .25, { type:'sawtooth', vol:.2, slide:30 }); this.tone(1200, .08, { type:'square', vol:.06 }); this.tone(1600, .1, { type:'square', vol:.05, at:.08 }); break;
        case 'hurt': this.tone(300, .2, { type:'square', vol:.08, slide:90 }); break;
        case 'levelup': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .14, { type:'triangle', at:i * .09 })); break;
        case 'win': [392, 523, 659, 784].forEach((f, i) => this.tone(f, .16, { type:'triangle', at:i * .12 })); this.tone(1047, .5, { type:'triangle', at:.5 }); break;
        case 'lose': [330, 294, 262].forEach((f, i) => this.tone(f, .3, { type:'triangle', vol:.12, at:i * .25 })); break;
        case 'evolve': this.tone(400, .5, { type:'sine', vol:.14, slide:1400 }); this.tone(600, .5, { type:'sine', vol:.08, at:.15, slide:1800 }); break;
        case 'hatch': this.tone(700, .08, { type:'triangle', vol:.1 }); this.tone(1000, .12, { type:'triangle', vol:.12, at:.1 }); this.tone(1400, .2, { type:'triangle', vol:.12, at:.2 }); break;
        case 'buy': this.tone(880, .08, { type:'triangle' }); this.tone(1175, .14, { type:'triangle', at:.08 }); break;
        case 'appear': this.tone(440, .12, { type:'triangle', vol:.1, slide:660 }); break;
        case 'grab': this.tone(600, .07, { type:'square', vol:.07 }); this.tone(900, .08, { type:'square', vol:.07, at:.08 }); this.tone(1200, .14, { type:'triangle', vol:.1, at:.16 }); break;
        case 'flee': this.tone(700, .25, { type:'triangle', vol:.1, slide:220 }); break;
      }
    }catch(e){}
  },
};

/* ---------- speech ---------- */
const Speech = {
  say(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = .88; u.pitch = 1; u.lang = 'en-US';
      window.speechSynthesis.speak(u);
